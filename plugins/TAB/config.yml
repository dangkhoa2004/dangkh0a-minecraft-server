placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%afk%':
    true: ' &o[AFK]&r'
    false: ''
  '%essentials_nickname%':
    '%essentials_nickname%': '%luckperms_prefix% %player%'
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%luckperms_prefix% %player%'
    false: ~%essentials_nickname%
  wilderness:
    conditions:
    - '%griefprevention_currentclaim_ownername%=Wilderness'
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
  locale: en-US
assign-groups-by-permissions: true
primary-group-finding-list:
- owner
- admin
- mod
- helper
- supporter
- elite
- king
- donate
- mvp
- beauty
- vip
- default
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
  - spyserver1
  - spyserver2
  server-groups:
    lobbies:
    - lobby1
    - lobby2
    group2:
    - server1
    - server2
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: false
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 500
  layouts:
    default:
      fixed-slots:
      - 1|&f&l       %animation:profile%
      - '3|&7 &fᴋɪʟʟꜱ: &#006EFF%statistic_player_kills% 🗡'
      - '4|&7 &fᴅᴇᴀᴛʜꜱ: &#006EFF%statistic_deaths% ☠'
      - '5|&7 &fᴛɪᴍᴇ ᴘʟᴀʏᴇᴅ: &#006EFF%statistic_time_played:days%d %statistic_time_played:hours%h ⌚'
      - '6|&7 &fRank: %luckperms_prefix%'
      - '7|&7 &fPower: &#006EFF%mcmmo_power_level% ✯'
      - 8|&7 &f
      - 10|&f&l          Tiền tệ
      - 11|&7        Số hạng &#006EFF#%essentials_baltop_rank%
      - '12|&7 &fSố xu: &#006EFF$%vault_eco_balance_commas%'
      - 13|&7 &f
      - 14|&f&l
      - 15|&7
      - 17|&7 &f
      - 18|&7 &f
      - 19|&7 &f
      - 21|&f&l         ᴘʟᴀʏᴇʀꜱ &7(&#006EFF%online%&7)
      - 61|&f&l       %animation:info%
      - 63|&f         %ping%ᴍꜱ ⚡ %server_tps_1%ᴛᴘꜱ
      - '65|&7 &f☁ ᴏɴʟɪɴᴇ ᴘʟᴀʏᴇʀꜱ: &#006EFF%server_online%/%server_max_players%'
      - '67|&7 &f↑ ᴜᴘᴛɪᴍᴇ: &#006EFF%server_uptime% ⌛'
      - '69|&7 &f⏯ ᴠᴇʀꜱɪᴏɴ: &#006EFF%server_version%'
      - 71|&f&l
      - '73|&f '
      - '74|&f '
      - '75|&f '
      - 77|&f&l
      - 79|&f
      groups:
        players:
          slots:
          - 23-60
permission-refresh-interval: 1000
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
proxy-support:
