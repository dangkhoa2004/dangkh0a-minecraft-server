tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld|%server%=disabledserver'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:owner,admin,helper,mod,elite,king,donate,mvp,beauty,vip,builder,default,member,user
  - PLACEHOLDER_A_TO_Z:%bedrock%
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld|%server%=disabledserver'
belowname-objective:
  enabled: false
  disable-condition: '%world%=disabledworld|%server%=disabledserver'
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  value: '%health%'
  title: '&cHealth'
prevent-spectator-effect:
