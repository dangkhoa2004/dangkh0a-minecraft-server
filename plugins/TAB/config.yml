    name: RedisBungee
  channel-name-suffix: TAB
compensate-for-packetevents-bug: false
playerlist-objective:
  enabled: true
  value: '%ping%'
  disable-condition: '%world%=disabledworld|%server%=disabledserver'
  fancy-value: '&7Ping: %ping%'
  title: TAB
  render-type: INTEGER
config-version: 6
components:
