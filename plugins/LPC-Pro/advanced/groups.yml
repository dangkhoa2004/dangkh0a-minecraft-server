# LPC Pro V2 - Groups Configuration
# This file controls per-group chat settings (VIP tiers, staff, etc.)

# ===========================================
# General Settings
# ===========================================
enabled: false

# How to determine group: PERMISSION, LUCKPERMS_GROUP, VAULT_GROUP
# PERMISSION: Check for lpcpro.group.<name> permission
# LUCKPERMS_GROUP: Use LuckPerms primary group (group names below must match LuckPerms group names)
# VAULT_GROUP: Use Vault primary group
detection-mode: "LUCKPERMS_GROUP"

# ===========================================
# Default Settings
# ===========================================
# Applied to players who don't match any group below
default:
  message-cooldown: 3
  command-cooldown: 1
  max-mentions: 3
  max-message-length: 256
  can-use-colors: false
  can-use-formatting: false
  can-use-gradients: false
  # Chat prefix: leave empty "" to use LuckPerms/Vault prefix instead
  chat-prefix: ""

# ===========================================
# Group Definitions
# ===========================================
# Groups are checked in order of priority (highest first)
# First matching group is used
#
# NOTE: When using LUCKPERMS_GROUP detection mode, the group name (e.g. "owner:")
# must match your LuckPerms group name exactly.
#
# TIP: Set chat-prefix to "" (empty) to use prefixes from LuckPerms instead.
# Example: /lp group owner meta setprefix 100 "<red>[Owner]</red>"

groups:
  # ===========================================
  # Staff Groups
  # ===========================================
  owner:
    priority: 1000
    permission: "lpcpro.group.owner"
    message-cooldown: 0
    command-cooldown: 0
    max-mentions: -1
    max-message-length: -1
    can-use-colors: true
    can-use-formatting: true
    can-use-gradients: true
    bypass-moderation: true
    bypass-slowmode: true
    bypass-mute: true
    chat-prefix: ""

  developer:
    priority: 900
    permission: "lpcpro.group.developer"
    message-cooldown: 0
    command-cooldown: 0
    max-mentions: -1
    max-message-length: -1
    can-use-colors: true
    can-use-formatting: true
    can-use-gradients: true
