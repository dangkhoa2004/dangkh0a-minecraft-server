    - '[close]'
    - '[player] team leave'
    - '[sound] UI_BUTTON_CLICK'

  'disband':
    material: RED_BANNER
    item_flags: [ HIDE_ATTRIBUTES ]
    slot: 16
    display_name: '&#FF9AA2&lɢɪảɪ ᴛáɴ ᴛổ độɪ'
    lore:
    - '&#fcfcfcxóᴀ ʙỏ ʜᴏàɴ ᴛᴏàɴ ᴛổ độɪ ᴄủᴀ ʙạɴ.'
