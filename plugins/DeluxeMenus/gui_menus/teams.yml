    display_name: '&#B5EAD7&lᴛạᴏ ᴛổ độɪ (ᴛᴇᴀᴍ)'
    lore:
    - '&#fcfcfcᴛạᴏ ᴛổ độɪ ᴄủᴀ ʀɪêɴɢ ʙạɴ để'
    - '&#fcfcfcᴄùɴɢ ɴʜᴀᴜ ѕɪɴʜ ᴛồɴ ᴠà ᴘʜáᴛ ᴛʀɪểɴ.'
    - ''
    - '&#B5EAD7&lᴛíɴʜ ɴăɴɢ ɴổɪ ʙậᴛ:'
    - ' &#57F287➥ &#fcfcfcʟɪêɴ ᴍɪɴʜ ɢɪữᴀ ᴄáᴄ ɴɢườɪ ᴄʜơɪ'
    - ' &#57F287➥ &#fcfcfcᴋʜᴜ ᴠựᴄ ɴʜà ᴄʜᴜɴɢ (ʜᴏᴍᴇ)'
    - ' &#57F287➥ &#fcfcfcʀươɴɢ ʟưᴜ ᴛʀữ ᴄʜᴜɴɢ'
    - ' &#57F287➥ &#fcfcfcʙậᴛ/ᴛắᴛ ᴘᴠᴘ ɴộɪ ʙộ'
    - ' &#57F287➥ &#fcfcfcᴋêɴʜ ᴄʜᴀᴛ ʀɪêɴɢ ᴛư'
    - ''
    - '&#E0E0E0ᴄú ᴘʜáᴘ: &#FFD700/team create <tên> <tag>'
    click_commands:
    - '[close]'
    - '[sound] BLOCK_NOTE_BLOCK_BELL'
    - '[message] &#57F287&l(!) &#E0E0E0ʜãʏ ɢõ ʟệɴʜ &#FFD700/team create <tên> <tag> &#E0E0E0để ᴛạᴏ ᴛổ độɪ!'

  'leave':
    material: PINK_BANNER
    item_flags: [ HIDE_ATTRIBUTES ]
    slot: 13
    display_name: '&#FFB7B2&lʀờɪ ᴛổ độɪ'
    lore:
    - '&#fcfcfcʀờɪ ᴋʜỏɪ ᴛổ độɪ ʜɪệɴ ᴛạɪ ᴄủᴀ ʙạɴ.'
    - ''
    - '&#fcfcfcʙạɴ ᴍᴜốɴ ᴛìᴍ ᴍộᴛ ʙếɴ đỗ ᴍớɪ?'
    - '&#fcfcfcʜãʏ ʀờɪ đɪ để ᴛìᴍ ᴋɪếᴍ ѕự ᴛự ᴅᴏ.'
    - ''
