    - '&#FF9AA2&l⚠ ᴄảɴʜ ʙáᴏ:'
    - '&#FF9AA2ʜàɴʜ độɴɢ ɴàʏ ᴋʜôɴɢ ᴛʜể ᴋʜôɪ ᴘʜụᴄ!'
    - '&#FF9AA2ʜãʏ ᴄâɴ ɴʜắᴄ ᴛʜậᴛ ᴋỹ ᴛʀướᴄ ᴋʜɪ ʟàᴍ.'
    - ''
    - '&#E0E0E0ᴄú ᴘʜáᴘ: &#FFD700/team disband'
    - ''
    - '&#a8e6cf▶ ɴʜấɴ ᴄʜᴜộᴛ để ɢɪảɪ ᴛáɴ'
