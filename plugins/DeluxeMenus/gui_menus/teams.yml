    - '&#fcfcfcᴋʜɪ ᴛổ độɪ ᴋʜôɴɢ ᴄòɴ ᴀɪ ʜᴏặᴄ ʙạɴ ʟà'
    - '&#fcfcfcđộɪ ᴛʀưởɴɢ, ʙạɴ ᴄó ǫᴜʏềɴ ɢɪảɪ ᴛáɴ.'
