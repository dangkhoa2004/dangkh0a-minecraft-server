    - ' &#FFD700/shop &#E0E0E0- ᴍở ᴄửᴀ ʜàɴɢ ѕᴇʀᴠᴇʀ'
    - ' &#FFD700/diemdanh &#E0E0E0- Đɪểᴍ ᴅᴀɴʜ ʜàɴɢ ɴɢàʏ'
    - ' &#FFD700/claim &#E0E0E0- ᴍở ᴍᴇɴᴜ ǫᴜảɴ ʟý ᴠà ᴄʜỉɴʜ ѕửᴀ ᴍảɴʜ đấᴛ'
