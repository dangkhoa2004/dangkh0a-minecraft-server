      - "&fSố point của bạn là: &e%playerpoints_points%"
      - "&8&lGiá: &f5 point"
    click_commands:
    - '[console] points take %player_name% 5 '
    - '[console] crate key give %player_name% mvp_key'
    - '[message] &fBạn đã mua thành công.'
    - '[close]'
