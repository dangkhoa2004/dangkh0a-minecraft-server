items:
  # ==================================================
  # CÁC KHU VỰC DỊCH CHUYỂN CHÍNH
  # ==================================================
  'wilderness':
    material: GRASS_BLOCK
    slot: 10
    display_name: '&#B9FBC0&lᴅịᴄʜ ᴄʜᴜʏểɴ ɴɢẫᴜ ɴʜɪêɴ'
    lore:
    - ''
    - '&#fcfcfcᴅịᴄʜ ᴄʜᴜʏểɴ ʙạɴ đếɴ ᴍộᴛ ᴠùɴɢ'
    - '&#fcfcfcđấᴛ ʜᴏᴀɴɢ ѕơ để ʙắᴛ đầᴜ ѕɪɴʜ ᴛồɴ.'
    - ''
    - '&#a8e6cf▶ ɴʜấɴ để ᴍở ᴍᴇɴᴜ ʀᴛᴘ!'
    click_commands:
    - '[openguimenu] rtp'
    - '[sound] UI_BUTTON_CLICK'

  'parkour':
    material: WHITE_GLAZED_TERRACOTTA
    slot: 12
    display_name: '&#FDFD96&lᴋʜᴜ ᴠᴜɪ ᴄʜơɪ ᴘᴀʀᴋᴏᴜʀ'
    lore:
    - ''
    - '&#fcfcfcᴛʜử ᴛʜáᴄʜ ᴋỹ ɴăɴɢ ɴʜảʏ ᴄủᴀ ʙạɴ'
    - '&#fcfcfcᴠà ɴʜậɴ ɴʜữɴɢ ᴘʜầɴ ᴛʜưởɴɢ ʜấᴘ ᴅẫɴ.'
