    - '&#a8e6cf▶ ɴʜấɴ để ᴅịᴄʜ ᴄʜᴜʏểɴ!'
    click_commands:
    - '[close]'
    - '[player] warp parkour'
    - '[sound] ENTITY_ENDERMAN_TELEPORT'

  'crates':
    material: CHEST
    slot: 14
    display_name: '&#FFB7B2&lʀươɴɢ ᴍᴀʏ ᴍắɴ (ᴄʀᴀᴛᴇѕ)'
    lore:
    - ''
    - '&#fcfcfcᴅịᴄʜ ᴄʜᴜʏểɴ đếɴ ᴋʜᴜ ᴠựᴄ ᴍở ʀươɴɢ'
    - '&#fcfcfcđể ᴛìᴍ ᴋɪếᴍ ᴠậᴛ ᴘʜẩᴍ ɢɪá ᴛʀị.'
    - ''
    - '&#a8e6cf▶ ɴʜấɴ để ᴅịᴄʜ ᴄʜᴜʏểɴ!'
    click_commands:
    - '[close]'
    - '[player] warp crates'
    - '[sound] ENTITY_ENDERMAN_TELEPORT'

  'enchant':
    material: ENCHANTING_TABLE
    slot: 16
    display_name: '&#BDB2FF&lᴋʜᴜ ᴘʜù ᴘʜéᴘ'
    lore:
    - ''
    - '&#fcfcfcᴋʜᴜ ᴠựᴄ ᴀɴ ᴛᴏàɴ để ᴘʜù ᴘʜéᴘ'
