  # VIP - START
  'Vip':
    material: leather_helmet
    item_flags: [ HIDE_ATTRIBUTES ]
    slot: 11
    priority: 2
    display_name: '&#00FFEA&lᴠ&#00FFEA&lɪ&#00FFEA&lᴘ %player_name%'
    lore:
    - ''
    - '&7 Quyền lợi bạn nhận'
    - '&7 khi mua rank là:'
    - ''
    - '&8 > &#b0e0e6/pv :&7 thêm kho đồ phụ thứ 3'
    - '&8 > &#b0e0e6/nick :&7 đổi tên màu'
    - '&8 > &#b0e0e6/tags :&7 Kho danh hiệu'
    - '&8 > &#b0e0e6/sethome :&7 Đặt tối đa 8 Homes '
    - ''
    - '&a  +&f Balo &8[&athêm 1 hàng&8]'
    - ''
    - '&f Giá:&7 20&e Points'
    - ''
    - '&#f5c45b Nhấn để mua'
    - ''
    view_requirement:
      requirements:
        Has-Vip:
          type: contains
          input: "%luckperms_groups%"
          output: "default"
    click_commands:
    - '[close]'
    - '[sound] ENTITY_PLAYER_LEVELUP 1 5'
    - '[console] points take %player_name% 20'
    - '[console] lp user %player_name% parent addtemp vip 30d'
    - '[console] customitem giveshard %player% 20'
    - '[message] &f'
    - '[message] &8 >&#03ff58 Chúc mừng!&f Bạn đã nâng cấp'
    - '[message] &8 >&f thành công cấp bậc của mình!'
    - '[message] &f'
    click_requirement:
      requirements:
        Du-Points:
          type: '>='
          input: "%playerpoints_points%"
          output: "20"
          deny_commands:
          - '[close]'
          - '[sound] BLOCK_ANVIL_PLACE 1 5'
          - '[message] &f'
          - '[message] &8 >&f Bạn không có đủ Points để'
          - '[message] &8 >&f mua &#FFC700cấp bậc&f này!'
          - '[message] &f'

