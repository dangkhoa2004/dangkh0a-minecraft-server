  # GHI CHÚ: Layout là hệ thống mẫu lý do được cài sẵn trong file layouts.yml (ví dụ: hack, spam).
  LayoutNotFound: "§x§F§F§8§B§9§4Kʜôɴɢ ᴛìᴍ ᴛʜấʏ ᴍẫᴜ ʟý ᴅᴏ (ʟᴀʏᴏᴜᴛ) ɴàᴏ ᴛêɴ ʟà %NAME%"
