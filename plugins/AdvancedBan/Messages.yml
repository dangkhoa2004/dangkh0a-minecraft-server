# GHI CHÚ: Đây là file quy định toàn bộ tin nhắn hiển thị của plugin AdvancedBan.
# Biến %NAME% là tên người bị phạt, %OPERATOR% là tên Admin/Staff ra lệnh phạt.
# Các ký tự &c, &8, &7... là mã màu chuẩn của Minecraft.

General:
  Prefix: "§x§F§F§8§B§9§4§lAᴅᴠᴀɴᴄᴇᴅBᴀɴ §x§8§8§8§8§8§8§l»"
