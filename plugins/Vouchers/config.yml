# The global prefix for the plugin
prefix: '&#BDB2FF[ᴡɪʙᴜʟᴀɴᴅ] &r'
# The default language for the plugin
language: en_us
# If true, vouchers will log if the voucher was placed in the user's inventory or dropped
log voucher give status: true
# If true, players cannot redeem a voucher while shifting/sneaking
prevent redeem while sneaking: false
# Categories for vouchers, these can be applied in each voucher file.
categories:
- id:food name:&#FCD05C&lᴠᴏᴜᴄʜᴇʀ ᴛʜứᴄ ăɴ item:APPLE
- id:money name:&#57F287&lᴠᴏᴜᴄʜᴇʀ ᴛɪềɴ ᴍặᴛ item:SUNFLOWER
time aliases:
  # Time aliases for week, Must be in lowercase.
  week:
  - w
  - week
  - weeks
  - tuan
  # Time aliases for month, Must be in lowercase.
  month:
  - mo
  - month
  - months
  - thang
  # Time aliases for hour, Must be in lowercase.
  hour:
  - h
  - hour
  - hours
  - gio
  # Time aliases for year, Must be in lowercase.
  year:
  - y
  - year
  - years
  - nam
  # Time aliases for day, Must be in lowercase.
  day:
  - d
  - day
  - days
  - ngay
  # Time aliases for minute, Must be in lowercase.
  minute:
  - min
  - minute
  - minutes
  - phut
  # Time aliases for second, Must be in lowercase.
  second:
  - s
  - second
  - seconds
  - giay
