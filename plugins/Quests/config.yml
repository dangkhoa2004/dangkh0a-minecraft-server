  command-quest-start-doesntexist: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFɴʜɪệᴍ ᴠụ '&#FF6B6B{quest}&#FFFFFF' ᴋʜôɴɢ ᴛồɴ ᴛạɪ."
  command-quest-general-doesntexist: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFɴʜɪệᴍ ᴠụ '&#FF6B6B{quest}&#FFFFFF' ᴋʜôɴɢ ᴛồɴ ᴛạɪ."
  command-category-open-disabled: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʜệ ᴛʜốɴɢ ᴅᴀɴʜ ᴍụᴄ đᴀɴɢ ʙị ᴛắᴛ."
  command-category-open-doesntexist: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFᴅᴀɴʜ ᴍụᴄ '&#FF6B6B{category}&#FFFFFF' ᴋʜôɴɢ ᴛồɴ ᴛạɪ."
  command-quest-admin-playernotfound: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFᴋʜôɴɢ ᴛìᴍ ᴛʜấʏ ɴɢườɪ ᴄʜơɪ '&#FF6B6B{player}&#FFFFFF'."
