# -----------------------------------------------------------
#  Tiêu đề & Tin nhắn
# -----------------------------------------------------------
titles:
  quest-start:
    title: "&#FDFD96&lđã ɴʜậɴ ɴʜɪệᴍ ᴠụ"
    subtitle: "&#FFFFFF{quest}"
  quest-complete:
    title: "&#B9FBC0&lʜᴏàɴ ᴛʜàɴʜ ɴʜɪệᴍ ᴠụ"
    subtitle: "&#FFFFFF{quest}"

messages:
  time-format: "{hours}ɢɪờ {minutes}ᴘʜúᴛ"
  quest-start: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFđã ʙắᴛ đầᴜ ɴʜɪệᴍ ᴠụ &#B9FBC0{quest}&#FFFFFF!"
  quest-complete: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFđã ʜᴏàɴ ᴛʜàɴʜ ɴʜɪệᴍ ᴠụ &#B9FBC0{quest}&#FFFFFF!"
  quest-cancel: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFđã ʜủʏ ʙỏ ɴʜɪệᴍ ᴠụ &#FF6B6B{quest}&#FFFFFF!"
  quest-expire: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFɴʜɪệᴍ ᴠụ &#FF6B6B{quest} &#FFFFFFđã ʜếᴛ ʜạɴ."
  quest-track: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFđᴀɴɢ ᴛʜᴇᴏ ᴅõɪ ᴛɪếɴ độ &#A3C4F3{quest}&#FFFFFF."
  quest-track-stop: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFđã ɴɢừɴɢ ᴛʜᴇᴏ ᴅõɪ &#FFB347{quest}&#FFFFFF."
  quest-random-none: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FF6B6Bʙạɴ ᴋʜôɴɢ ᴄòɴ ɴʜɪệᴍ ᴠụ ɴàᴏ ᴄó ᴛʜể ɴʜậɴ."
  quest-start-limit: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴄʜỉ đượᴄ ɴʜậɴ ᴛốɪ đᴀ &#FF6B6B{limit} &#FFFFFFɴʜɪệᴍ ᴠụ ᴄùɴɢ ʟúᴄ."
  quest-start-disabled: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴋʜôɴɢ ᴛʜể ʟàᴍ ʟạɪ ɴʜɪệᴍ ᴠụ ɴàʏ."
  quest-start-locked: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴄʜưᴀ ᴍở ᴋʜóᴀ ɴʜɪệᴍ ᴠụ ɴàʏ."
  quest-start-cooldown: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴠừᴀ ʜᴏàɴ ᴛʜàɴʜ xᴏɴɢ. ʜãʏ đợɪ &#FFB347{time} &#FFFFFFđể ᴄó ᴛʜể ʟàᴍ ʟạɪ."
  quest-start-started: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ đã ɴʜậɴ ɴʜɪệᴍ ᴠụ ɴàʏ ʀồɪ."
