    lore:
    - "&#888888&m                          "
    - "&#D1E8E2ʙạɴ ᴠừᴀ ʜᴏàɴ ᴛʜàɴʜ ɴʜɪệᴍ ᴠụ ɴàʏ"
    - "&#D1E8E2(&#FDFD96{quest}&#D1E8E2). ᴠᴜɪ ʟòɴɢ đợɪ ᴛʜêᴍ"
