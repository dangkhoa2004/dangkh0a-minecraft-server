  command-no-permission: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴋʜôɴɢ ᴄó ǫᴜʏềɴ ꜱử ᴅụɴɢ ʟệɴʜ ɴàʏ."
