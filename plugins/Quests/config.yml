  quest-category-permission: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴋʜôɴɢ ᴄó ǫᴜʏềɴ xᴇᴍ ᴅᴀɴʜ ᴍụᴄ ɴàʏ."
  quest-category-quest-permission: "&#FDFD96&lɴʜɪệᴍ ᴠụ &#D1E8E2» &#FFFFFFʙạɴ ᴋʜôɴɢ ᴛʜể ɴʜậɴ ɴʜɪệᴍ ᴠụ ɴàʏ ᴠì ɴó ɴằᴍ ᴛʀᴏɴɢ ᴅᴀɴʜ ᴍụᴄ ʙị ᴋʜóᴀ."
