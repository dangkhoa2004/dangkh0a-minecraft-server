# Đang tìm cách thêm danh mục mới? Chức năng này đã được chuyển sang file categories.yml.
# Tuy nhiên bạn gộp chung vào đây plugin vẫn đọc được bình thường.

# -----------------------------------------------------------
#  Tùy chọn cơ bản (Basic options)
# -----------------------------------------------------------
options:
  categories-enabled: true
  trim-gui-size:
    quests-category-menu: true
    quests-menu: true
    quests-started-menu: true
  titles-enabled: true

  bossbar:
    progress: true
    complete: true
    time: 5
    color:
      '0.0': BLUE
    style:
      '0.0': SOLID
    limit: -1
    replace-on-limit: true

  actionbar:
    progress: true
    complete: true

  quest-limit:
    default: 2
  allow-quest-cancel: true
  allow-quest-track: true
  task-type-exclusions: []

  guinames:
    quests-category: "ᴅᴀɴʜ ᴍụᴄ ɴʜɪệᴍ ᴠụ"
    quests-menu: "ɴʜɪệᴍ ᴠụ"
    quests-started-menu: "ɴʜɪệᴍ ᴠụ đᴀɴɢ ʟàᴍ"
    daily-quests: "ɴʜɪệᴍ ᴠụ ʜằɴɢ ɴɢàʏ"
    quest-cancel: "ʜủʏ ɴʜɪệᴍ ᴠụ"

  sounds:
    quest-start: "ENTITY_PLAYER_LEVELUP:2:3"
    quest-cancel: "UI_TOAST_OUT:2:3"
    quest-complete: "UI_TOAST_CHALLENGE_COMPLETE:1.25:3"
    gui:
      open: "ITEM_BOOK_PAGE_TURN:1:3"
      interact: ""

  gui-hide-locked: false
  gui-confirm-cancel: true
  gui-hide-quests-nopermission: false
  gui-hide-categories-nopermission: false
  gui-use-placeholderapi: false
  gui-truncate-requirements: true
  gui-close-after-accept: true

  gui-actions:
    start-quest: "LEFT"
    track-quest: "DROP"
    cancel-quest: "RIGHT"

  quest-autostart: false
  quest-autotrack: false
  verbose-logging-level: 2
  record-log-history: true
  quests-use-placeholderapi: false
  progress-use-placeholderapi: false
  use-progress-as-fallback: true

  playerblocktracker-class-name: "dev.krakenied.blocktracker.bukkit.BukkitBlockTrackerPlugin"
  placeholderapi-global-refresh-ticks: 30
  coreprotect-block-lookup-delay: -1
  mobkilling-use-wildstacker-hook: true
  verify-quest-exists-on-load: true

  performance-tweaking:
    quest-queue-executor-interval: 1
    quest-autosave-interval: 12000
  tab-completion:
    enabled: true
  error-checking:
    override-errors: false
  placeholder-cache-time: 10
  global-task-configuration-override: false
  global-quest-display-configuration-override: false

  storage:
    provider: "yaml"
    synchronisation:
      delay-loading: 0
    database-settings:
      network:
        database: "minecraft"
        username: "root"
        password: ""
        address: "localhost:3306"
      connection-pool-settings:
        minimum-idle: 8
        maximum-pool-size: 8
        connection-timeout: 5000
        idle-timeout: 600000
        keepalive-time: 0
        maximum-lifetime: 1800000
        data-source-properties: {}
      table-prefix: "quests_"

quest-mode:
  mode: "NORMAL"

number-formats:
  floating:
    format: '#,##0.00'
    locale: 'en-US'
  integral:
    format: '#,##0'
    locale: 'en-US'

# -----------------------------------------------------------
#  Giao diện Nhiệm vụ Toàn cầu
# -----------------------------------------------------------
global-quest-display:
  lore:
    append-not-started:
    - ""
    - "&#B9FBC0🖱 ᴄʟɪᴄᴋ ᴛʀáɪ &#D1E8E2để ɴʜậɴ ɴʜɪệᴍ ᴠụ ɴàʏ."
    append-started:
    - ""
    - "&#D1E8E2ʙạɴ &#B9FBC0đᴀɴɢ ᴛʜựᴄ ʜɪệɴ &#D1E8E2ɴʜɪệᴍ ᴠụ ɴàʏ."
    - "&#FDFD96🖱 ᴘʜíᴍ Q &#D1E8E2để ᴛʜᴇᴏ ᴅõɪ."
    - "&#FF6B6B🖱 ᴄʟɪᴄᴋ ᴘʜảɪ &#D1E8E2để ʜủʏ ɴʜɪệᴍ ᴠụ."
    append-tracked:
    - ""
    - "&#D1E8E2ʙạɴ &#B9FBC0đᴀɴɢ ᴛʜᴇᴏ ᴅõɪ &#D1E8E2ɴʜɪệᴍ ᴠụ ɴàʏ."
    - "&#FFB347🖱 ᴘʜíᴍ Q &#D1E8E2để ɴɢừɴɢ ᴛʜᴇᴏ ᴅõɪ."
    - "&#FF6B6B🖱 ᴄʟɪᴄᴋ ᴘʜảɪ &#D1E8E2để ʜủʏ ɴʜɪệᴍ ᴠụ."

global-macros:
  bar: "&6---&7---&6---"

# -----------------------------------------------------------
#  Cấu hình GUI hệ thống (Đã chèn ItemFlags ẩn thông số rác)
# -----------------------------------------------------------
gui:
  back-button:
    enabled: true
    slot: 45
    type: "ARROW"
    name: "&#FF6B6B&lǫᴜᴀʏ ʟạɪ"
    lore:
    - "&#D1E8E2ᴛʀở ᴠề ᴍᴇɴᴜ ᴅᴀɴʜ ᴍụᴄ ᴄʜíɴʜ."
    itemflags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
    - "HIDE_POTION_EFFECTS"
  page-prev:
    enabled: true
    slot: 48
    type: "FEATHER"
    name: "&#A3C4F3&lᴛʀᴀɴɢ ᴛʀướᴄ"
    lore:
    - "&#D1E8E2ᴄʜᴜʏểɴ ᴠề ᴛʀᴀɴɢ số &c{prevpage}&#D1E8E2."
    itemflags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
    - "HIDE_POTION_EFFECTS"
  page-next:
    enabled: true
    slot: 50
    type: "FEATHER"
    name: "&#A3C4F3&lᴛʀᴀɴɢ sᴀᴜ"
    lore:
    - "&#D1E8E2ᴄʜᴜʏểɴ ᴛớɪ ᴛʀᴀɴɢ số &c{nextpage}&#D1E8E2."
    itemflags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
    - "HIDE_POTION_EFFECTS"
  page-desc:
    enabled: true
    slot: 49
    type: "PAPER"
    name: "&#F8E9A1&lᴛʀᴀɴɢ {page}"
    lore:
    - "&#D1E8E2ʙạɴ đᴀɴɢ xᴇᴍ ᴛʀᴀɴɢ số &c{page}&#D1E8E2."
    itemflags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
    - "HIDE_POTION_EFFECTS"
  quest-locked-display:
    type: "RED_STAINED_GLASS_PANE"
    name: "&#FF6B6B&lɴʜɪệᴍ ᴠụ đã ᴋʜóᴀ"
    lore:
    - "&#888888&m                          "
    - "&#D1E8E2ʙạɴ ᴄʜưᴀ ʜᴏàɴ ᴛʜàɴʜ đủ ʏêᴜ ᴄầᴜ"
    - "&#D1E8E2ᴄủᴀ ɴʜɪệᴍ ᴠụ ɴàʏ (&#FF6B6B{quest}&#D1E8E2)."
    - ""
    - "&#D1E8E2ʏêᴜ ᴄầᴜ: &#FF6B6B{requirements}"
    - "&#D1E8E2ᴄầɴ ʜᴏàɴ ᴛʜàɴʜ để ᴍở ᴋʜóᴀ."
    - "&#888888&m                          "
