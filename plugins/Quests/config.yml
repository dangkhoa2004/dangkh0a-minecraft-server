    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
    - "HIDE_POTION_EFFECTS"
  quest-permission-display:
    type: "BROWN_STAINED_GLASS_PANE"
    name: "&#FFB347&lᴋʜôɴɢ ᴄó ǫᴜʏềɴ"
    lore:
    - "&#888888&m                          "
    - "&#D1E8E2ʙạɴ ᴋʜôɴɢ ᴄó ǫᴜʏềɴ để ɴʜậɴ"
