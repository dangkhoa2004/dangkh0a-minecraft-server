# PlaceholderAPI
# Version: 2.12.2
# Created by: extended_clip
# Contributors: https://github.com/PlaceholderAPI/PlaceholderAPI/graphs/contributors
# Issues: https://github.com/PlaceholderAPI/PlaceholderAPI/issues
# Expansions: https://placeholderapi.com/ecloud
# Wiki: https://wiki.placeholderapi.com/
# Discord: https://helpch.at/discord
# If you're seeing performance issues with plugins that use component replacement, or things don't look quite right,
# switch to the replacer provided by adventure itself by changing use_adventure_provided_replacer to true
# No placeholders are provided with this plugin by default.
# Download placeholders: /papi ecloud
check_updates: true
cloud_enabled: true
cloud_sorting: name
boolean:
  'true': 'yes'
  'false': 'no'
date_format: MM/dd/yy HH:mm:ss
detect_malicious_expansions: true
use_adventure_provided_replacer: false
debug: false
expansions:
  griefprevention:
    formatting:
      thousands: k
      trillions: T
      quadrillions: Q
      billions: B
      millions: M
    translate:
      not-owner: You don't own this claim!
      unclaimed: Unclaimed
    color:
      trusted: '&a'
      enemy: '&4'
      neutral: '&7'
  player:
    ping_value:
      high: 100
      medium: 50
    direction:
      north: N
      south: S
      north_west: NW
      north_east: NE
      east: E
      south_east: SE
      west: W
      south_west: SW
    ping_color:
      medium: '&e'
      high: '&c'
      low: '&a'
  playerlist:
    update-cooldown: 1000
    offline-text: Offline
    argument-separator: ','
    lists:
      players:
        type: ONLINE
        included: true
        filters:
        - '!PERMISSION:group.staff'
        - CANSEE
      staff:
        type: ONLINE
        included: true
        filters:
        - PERMISSION:group.staff
        - CANSEE
    groups:
      staffAndPlayers:
        gap: 1
        lists:
          staff:
            title: Staff Members (%amount%)
            max: 10
            remaining: '... and %remaining% more!'
          players:
            title: Players (%amount%)
  server:
    server_name: A Minecraft Server
    time:
      locale: en-US
      zone: Asia/Saigon
      suffix:
        week: w
        day: d
        hour: h
        minute: m
        second: s
    tps_color:
      high: '&a'
      medium: '&e'
      low: '&c'
  vault:
    formatting:
      thousands: k
      millions: M
      billions: B
      trillions: T
      quadrillions: Q
  betterteamsextra:
    layouts:
      member_list:
      - "  &8&7%playerName% &8| &7%playerRank%  \n"
      invited_player_list:
      - "  &8&7%playerName%  \n"
      public_team_list:
      - "  &b&lTeam &e%teamName%  \n"
      - "  &8&7Members &f%teamMemberCount%  \n"
      - "  &8&7Level &f%teamLevel%  \n\n"
      ban_list:
      - "  &8&7%playerName%  \n"
      warp_list:
      - "  &a&lWarp &e%warpName%  \n"
      - "  &8&7World &f%worldName%  \n"
      - "  &8&7X &f%locationX%  \n"
      - "  &8&7Y &f%locationY%  \n"
      - "  &8&7Z &f%locationZ%  \n\n"
      ally_list:
      - "  &e&lAlly &a%allyName%  \n"
      - "  &8&7Members &f%allyMembers%  \n"
      - "  &8&7Balance &a$%allyBalance%  \n"
      - "  &8&7Level &b%allyLevel%  \n\n"
      claimed_chest_list:
      - "  &6&lChest &d%chestNumber%  \n"
      - "  &8&7World &f%worldName%  \n"
      - "  &8&7X &f%locationX%  \n"
      - "  &8&7Y &f%locationY%  \n"
      - "  &8&7Z &f%locationZ%  \n\n"
