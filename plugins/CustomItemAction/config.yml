shard_item:
  material: AMETHYST_SHARD
  name: "&#B955FF💎 Mảnh Vỡ Tinh Thể 💎"
  lore:
    - "&#AAAAAAVật phẩm này dùng để trao đổi."
  custom_model_data: 1000

  # --- TÙY CHỈNH CÁC CHỨC NĂNG CỦA SHARD ---
  # true = Cấm hành động đó | false = Cho phép hành động đó
  prevent_drop: true          # Cấm vứt ra đất
  prevent_move_to_chest: false # Đặt FALSE để CÓ THỂ cất vào rương/kho đồ khác
  prevent_craft: true         # Cấm dùng để chế tạo
  prevent_enchant: true       # Cấm dùng trong Đe và Bàn Phù Phép
  prevent_death_drop: true    # Không rơi ra đất khi chết (giữ lại trong người)

