#
# By Citymoon Dynamics - Symbol of Quality.
#
# Thanks for use my configuration
# You are currently running version 1.0.1
# https://builtbybit.com/resources/vulcan-grim-prime-configuration.95057
#
# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)
Punishments:
  Simulation: # PRESS ATTENTION: IF YOU ARE RUNNING GRIM ON A 1.21.8 SERVER, MAYBE U NEED REMOVE THIS CATEGORY
    # After how many seconds should a violation be removed?
    remove-violations-after: 300
    # This section will match all checks with the name,
    # To exclude a check that would otherwise be matched, put an exclamation mark in front of the name
    # For example, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "NoFall"
    # Threshold:Interval Command
    #
    # Example, to kick the player with the message "incorrect movement!" after 100 violations, with no interval
    # commands:
    # - "100:0 kick %player% incorrect movement!"
    # 0 means execute exactly once
    # - "100:50 say %player% is cheating"
    # Execute when the user hits flag 100, and after that, every 50th flag after 100
    #
    commands:
      - "20:20 [alert]"
      - "100:40 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "5:5 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "Exploit"
      - "Chat"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
      - "10:0 tempban %player% Unfair Advantages 5d -s"
      - "10:0 bc &b× &f%player% &7got removed due to &cUnfair Advantages&7."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "5:3 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "20:0 tempban %player% Unfair Advantages 5d -s"
      - "20:0 bc &b× &f%player% &7got removed due to &cUnfair Advantages&7."
  Misc:
    remove-violations-after: 300
    checks:
      - "MultiActions"
      - "Place"
      - "Break"
      - "Place"
      - "Elytra"
    commands:
      - "10:5 [alert]"
      - "10:5 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "50:0 tempban %player% Unfair Advantages 5d -s"
      - "50:0 bc &b× &f%player% &7got removed due to &cUnfair Advantages&7."
  MiscTwo:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "Sprint"
      - "NoSlow"
      - "Sprint"
      - "TransactionOrder"
    commands:
      - "10:5 [alert]"
      - "10:5 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Baritone:
    remove-violations-after: 300
    checks:
      - "Baritone"
    commands:
      - "1:1 [alert]"
      - "10:5 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "30:0 tempban %player% Unfair Advantages 5d -s"
      - "30:0 bc &b× &f%player% &7got removed due to &cUnfair Advantages&7."
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Killaura"
      - "Aim"
    commands:
      - "5:5 [alert]"
      - "20:40 [log]"
      - "50:0 tempban %player% Unfair Advantages 5d -s"
      - "50:0 bc &b× &f%player% &7got removed due to &cUnfair Advantages&7."
  # As of 2.2.10, there are no AutoClicker checks and this is a placeholder. Grim will include AutoClicker checks in the future.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "20:40 [log]"
