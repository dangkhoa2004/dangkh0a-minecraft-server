item-enchantment-not-supported: Phép thuật này không được hỗ trợ trong phiên bản Minecraft này.
enchantment-cannot-apply-to-item: Để áp dụng phép thuật lên vật phẩm, vật liệu cần là sách phù phép hoặc một công cụ phù hợp với phép thuật đó.
item-spawnertype-null: Không thể lấy loại spawner của vật phẩm.
need-item-spawnertype: Không thể tạo spawner với loại spawner trống.
material-needs-to-be-spawner: Để áp dụng Loại Spawner (Loại Entity) cho vật phẩm, vật liệu của vật phẩm cần là một spawner.
item-potiontype-null: Không thể lấy loại thuốc của vật phẩm.
need-item-potiontype: Không thể tạo một loại thuốc với giá trị trống.
potiontype-not-supported: Loại thuốc này không được hỗ trợ trong phiên bản Minecraft này.
material-needs-to-be-potion: Để áp dụng hiệu ứng thuốc, vật liệu cần là một loại thuốc hoặc một mũi tên có thuốc.
cant-bind-multiple-applyments: Không thể tạo một vật phẩm với nhiều phép áp dụng như các phép thuật/spawner-types hoặc các loại hiệu ứng thuốc.
item-error: '&cLỗi Vật Phẩm, xem trong bảng điều khiển.'
material-not-supported: Vật liệu vật phẩm này không được hỗ trợ trong phiên bản Minecraft này.
item-needs-buy-and-sell-value: Mỗi vật phẩm trong cửa hàng cần có giá mua/bán.
sell-value-wrong: Giá bán cần là một số thập phân hoặc một số.
buy-value-wrong: Giá mua cần là một số thập phân hoặc một số.
option-type-changed: Vui lòng thay đổi tùy chọn 'type' thành tùy chọn 'spawnertype' để tạo một spawner trong cửa hàng. Tên của tùy chọn đã thay đổi trong phiên bản 2.2 để rõ ràng hơn.
option-meta-changed: Vui lòng thay đổi tùy chọn 'meta' thành tùy chọn 'displayname' để tạo một vật phẩm với tên hiển thị trong cửa hàng. Tên của tùy chọn đã thay đổi trong phiên bản 2.2 để rõ ràng hơn.
cannot-display-shopsection: Không thể tạo phần cửa hàng '%shopsection%' vì ô của vật phẩm cần nằm trong khoảng từ 0 - %maxInvSize%.
need-recipe-material: Không thể tạo vật liệu công thức với giá trị trống.
cannot-get-recipe-material: Không thể tạo vật liệu công thức, Vui lòng kiểm tra tên vật liệu xem có lỗi chính tả không và nếu nó tồn tại.
recipe-material-not-supported: Vật liệu công thức được cung cấp không được hỗ trợ trong phiên bản Minecraft này.
material-needs-to-be-book: Để áp dụng công thức cho vật phẩm, vật liệu của vật phẩm cần là sách kiến thức.
need-skullowner: Không thể tạo Đầu Người Chơi mà không có người chơi cụ thể (Chủ Sở Hữu Đầu).
material-needs-to-be-skull: Để áp dụng kết cấu đầu (Chủ Sở Hữu Đầu) cho vật phẩm, vật liệu của vật phẩm cần là một Đầu Người Chơi.
material-needs-to-be-leather-armor: Để áp dụng màu cho một mảnh giáp, vật liệu cần là giáp da.
invalid-item-requirement-type: Invalid item requirement type for '%type%'
