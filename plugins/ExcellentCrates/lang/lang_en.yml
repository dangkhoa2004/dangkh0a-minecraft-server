        - ''
        - Bạn có thể tìm hiểu thêm về cách hoạt động của độ hiếm và trọng lượng tại <click:open_url:"https://nightexpressdev.com/excellentcrates/rewards/rarity-weights/"><soft_green><u>ĐÂY</u></soft_green></click>.
