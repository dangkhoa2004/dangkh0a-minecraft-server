          Name: <soft_yellow><b>Hiệu Ứng Hoạt Hình Mở Rương</b></soft_yellow>
          Lore:
          - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white>%inspection%</white></gray>'
          - '<gray><dark_gray>» </dark_gray>ID Xem Trước: <white>%value%</white></gray>'
          - ' '
          - <gray>Đặt hiệu ứng hoạt hình mở rương cho rương này.</gray>
          - ' '
          - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
        Unset:
          Name: <soft_yellow><b>Hiệu Ứng Hoạt Hình Mở Rương</b></soft_yellow>
          Lore:
          - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white><red>Đã Tắt</red></white></gray>'
          - ' '
          - <gray>Đặt hiệu ứng hoạt hình mở rương cho rương này.</gray>
          - ' '
          - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
