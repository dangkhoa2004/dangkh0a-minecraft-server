        - ''
        - <sprite:"item/clock_00"> Sử dụng chế độ hồi chiêu <soft_yellow>Hàng Ngày</soft_yellow> để làm mới thời gian hồi chiêu vào lúc <soft_yellow>nửa đêm</soft_yellow> sau số ngày đã được chỉ định.
        - <sprite:"item/clock_00"> Sử dụng chế độ hồi chiêu <soft_yellow>Tùy Chỉnh</soft_yellow> để thiết lập một thời gian hồi chiêu chính xác bằng <soft_yellow>giây</soft_yellow>.
        - ''
        - <sprite:"item/barrier"> Để vô hiệu hóa thời gian hồi chiêu, hãy đặt giá trị của nó là <soft_red>0</soft_red>.
        - <sprite:"item/barrier"> Để xóa bỏ giới hạn số lần quay thưởng, hãy đặt giá trị của nó là <soft_red>-1</soft_red>.
