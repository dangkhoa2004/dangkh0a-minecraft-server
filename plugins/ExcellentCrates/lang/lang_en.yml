Command:
  Argument:
    Name:
      Crate: Rương
      Key: Chìa khoá
      X: x
      Y: y
      Z: z
  Editor:
    Desc: Mở giao diện chỉnh sửa.
  Drop:
    Desc: Tạo ra rương vật lý trong thế giới.
    Done: <gray>Đã thả <soft_yellow>%crate_name%</soft_yellow> tại <soft_yellow>%location_x%, %location_y%, %location_z%</soft_yellow> thuộc <soft_yellow>%location_world%</soft_yellow>.</gray>
  DropKey:
    Desc: Tạo ra chìa khoá vật lý trong thế giới.
    Done: <gray>Đã thả <soft_yellow>%key_name%</soft_yellow> tại <soft_yellow>%location_x%, %location_y%, %location_z%</soft_yellow> thuộc <soft_yellow>%location_world%</soft_yellow>.</gray>
  Open:
    Desc: Mở một rương.
  OpenFor:
    Desc: Mở rương cho một người chơi.
    Done: <gray>Đã mở <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Notify: <gray>Bạn đã bị ép mở <soft_yellow>%crate_name%</soft_yellow>.</gray>
  Give:
    Desc: Đưa rương cho một người chơi.
    Done: <gray>Đã trao <soft_yellow>x%amount%</soft_yellow> rương <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
    Notify: <gray>Bạn đã nhận được <soft_yellow>x%amount%</soft_yellow> rương <soft_yellow>%crate_name%</soft_yellow>.</gray>
  Key:
    Desc: Quản lý chìa khoá của người chơi.
    Give:
      Desc: Đưa chìa khoá cho một người chơi.
      Done: <gray>Đã trao <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Bạn đã nhận được <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow>!</gray>
    Take:
      Desc: Lấy chìa khoá từ một người chơi.
      Done: <gray>Đã lấy <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> từ <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Bạn đã mất <soft_red>x%amount%</soft_red> chìa khoá <soft_red>%key_name%</soft_red>.</gray>
    Set:
      Desc: Cài đặt số lượng chìa khoá cho một người chơi.
      Done: <gray>Đã cài đặt <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>%player_name%</soft_yellow>.</gray>
      Notify: <gray>Số lượng chìa khoá <soft_yellow>%key_name%</soft_yellow> của bạn đã thay đổi thành <soft_yellow>x%amount%</soft_yellow>.</gray>
    Show:
      Desc: Xem số lượng chìa khoá ảo của [người chơi].
      Format:
        List:
        - '[prefix="false"]'
        - ' '
        - '<soft_yellow><b>Chìa Khoá Ảo Của %player_name%: </b></soft_yellow>'
        - '%entry%'
        - ' '
        Entry: '<soft_yellow>▪ <gray>%key_name%: </gray>x%amount%</soft_yellow>'
    GiveAll:
      Desc: Đưa chìa khoá cho tất cả người chơi đang trực tuyến.
      Done: <gray>Đã trao <soft_yellow>x%amount%</soft_yellow> chìa khoá <soft_yellow>%key_name%</soft_yellow> cho <soft_yellow>Tất Cả Người Chơi</soft_yellow>.</gray>
  Preview:
    Desc: Mở giao diện xem trước phần thưởng của rương.
    Done:
      Others: <gray>Đã mở giao diện xem trước <soft_yellow>%crate_name%</soft_yellow> cho <soft_yellow>%player_display_name%</soft_yellow>.</gray>
  ResetCooldown:
    Desc: Xoá thời gian hồi mở rương của một người chơi.
    Done: <gray>Đã xoá thời gian hồi khi mở <soft_yellow>%crate_name%</soft_yellow> của <soft_yellow>%player_name%</soft_yellow>.</gray>
  Menu:
    Desc: Mở menu chứa rương.
    Done:
      Others: <gray>Đã mở menu chứa rương cho <soft_yellow>%player_display_name%</soft_yellow>.</gray>
Error:
  Command:
    Argument:
      InvalidCrate: <gray><soft_red>%value%</soft_red> không phải là một rương hợp lệ!</gray>
      InvalidKey: <gray><soft_red>%value%</soft_red> không phải là một chìa khoá hợp lệ!</gray>
  DataIsLoading: <soft_red>Dữ liệu vẫn đang tải... Vui lòng thử lại sau.</soft_red>
Crate:
  Open:
    Error:
      InventorySpace:
      - '[type="title",sound="minecraft:entity.villager.no;0.8;1.0",title_times="20:60:20"]'
      - <soft_red><b>Túi Đồ Đã Đầy!</b></soft_red>
      - <gray>Vui lòng dọn túi đồ trước khi mở rương.</gray>
      Cooldown:
        Temporary:
        - '[type="title",sound="minecraft:entity.villager.no;0.8;1.0",title_times="20:60:20"]'
        - <soft_red><b>Rương thưởng đang trong trạng thái hồi!</b></soft_red>
        - <gray>Bạn có thể mở lại rương trong vòng <soft_red>%time%</soft_red> nữa</gray>
        OneTimed:
        - '[type="title",sound="minecraft:entity.villager.no;0.8;1.0",title_times="20:60:20"]'
        - <soft_red><b>Rất Tiếc!</b></soft_red>
        - <gray>Bạn đã mở rương giới hạn và không thể mở lại lần nữa!</gray>
      NoRewards:
      - '[type="title",sound="minecraft:entity.villager.no;0.8;1.0",title_times="20:60:20"]'
      - <red><b>Rất Tiếc!</b></red>
      - <gray>Không có phần thưởng nào trong rương này, thử lại sau.</gray>
      Already:
      - '[type="title",sound="minecraft:entity.villager.no;0.8;1.0",title_times="20:60:20"]'
      - <red><b>Rất Tiếc!</b></red>
      - <gray>Bạn đang mở rương này!</gray>
    TooExpensive:
    - '[prefix="false"]'
    - ' '
    - <red><b>MỞ RƯƠNG THẤT BẠI:</b></red>
    - '<red>» </red><gray>Rương: </gray><white>%crate_name%</white>'
    - '<red>» </red><gray>Bạn không thể trả chi phí mở rương: %costs%</gray>'
    - ' '
    Milestone:
      Completed: '[sound="minecraft:entity.player.levelup;0.8;1.0",prefix="false"]<gray>Bạn đã hoàn thành cột mốc <green>%milestone_openings% Mở </green> và nhận được phần thưởng <green>%reward_name%</green>!</gray>'
    Reward:
      Broadcast:
      - '[sound="minecraft:block.note_block.bell;0.8;1.0",prefix="false"]'
      - ' '
      - <gray><light_purple>%player_display_name%</light_purple> đã mở <light_purple>%crate_name%</light_purple> và nhận được <light_purple>%reward_name%</light_purple>!</gray>
      - ' '
      - '<gray>Mua chìa khoá: <click:open_url:"https://YOUR_LINK_HERE.xyz"><light_purple>[Nhấn để mở Cửa Hàng]</light_purple></click></gray>'
      - ' '
  Rewards:
  - '[prefix="false"]'
  - ' '
  - <yellow><b>MỞ RƯƠNG THÀNH CÔNG:</b></yellow>
  - '<yellow>» </yellow><gray>Rương: </gray><white>%crate_name%</white>'
  - '<yellow>» </yellow><gray>Phần Thưởng: </gray><white>%rewards%</white>'
  - ' '
  Opened:
    Result:
      Reward: '%reward_name%'
  Preview:
    Error:
      Cooldown: <gray>Bạn có thể xem trước rương này sau <soft_red>%time%</soft_red></gray>
Other:
  Cooldown:
    Ready: <green>Sẵn sàng để mở!</green>
  LastOpener:
    Empty: '-'
  LastReward:
    Empty: '-'
  NextMilestone:
    Empty: '-'
  Midnight: Nửa Đêm
  Free: Miễn Phí
