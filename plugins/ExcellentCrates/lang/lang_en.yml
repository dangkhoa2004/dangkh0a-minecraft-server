      Title: <yellow><b>PHẦN THƯỞNG</b></yellow><dark_gray> » </dark_gray><white>Các Phân Quyền</white>
      Body:
        Contents:
        - Chỉ định các quyền hạn mà một người chơi phải có hoặc không được có để truy cập phần thưởng này.
        - ''
        - Sử dụng tiền tố <green><b>+</b></green> để liệt kê các quyền hạn mà người chơi <green>phải có</green>, và tiền tố <red><b>-</b></red> cho các quyền hạn mà người chơi <red>không được phép có</red>.
        - ''
        - Người chơi phải sở hữu bất kỳ quyền hạn <green>'được phép'</green> nào và không sở hữu bất kỳ quyền hạn <red>'bị cấm'</red> nào.
        Width: 400
      Input:
        Permissions: Các Phân Quyền
