UI:
  Costs:
    Option:
      Available:
        Name: <white>%cost_name%</white>
        Lore:
        - '%costs%'
        - '%empty-if-above%'
        - '<yellow><b>SỐ LƯỢNG MỞ: </b></yellow><white><u>%available%</u></white>'
        - ''
        - <green>→ <u>Nhấn để chọn</u></green>
      Unavailable:
        Name: <white>%cost_name%</white>
        Lore:
        - '%costs%'
        - '%empty-if-above%'
        - <red><b>BẠN KHÔNG ĐỦ KHẢ NĂNG ĐỂ TRẢ</b></red>
    Entry0:
      Available: <white>%entry%</white> <gray>(<green>✔</green>)</gray>
      Unavailable: <white>%entry%</white> <gray>(<red>✘</red>)</gray>
  OpenAmount:
    Single:
      Name: <yellow><b>Mở Một</b></yellow>
      Lore:
      - <gray>Mở một rương duy nhất.</gray>
      - ''
      - <yellow>→ <u>Nhấn để chọn</u></yellow>
    All:
      Name: <yellow><b>Mở Tất Cả</b></yellow>
      Lore:
      - <gray>Mở tối đa <white>%max%</white> rương.</gray>
      - ''
      - <yellow>→ <u>Nhấn để chọn</u></yellow>
Editor:
  Title:
    Main: <black>Trình Chỉnh Sửa ExcellentCrates</black>
    Crates: <black>Trình Chỉnh Sửa Rương</black>
    Crate:
      Settings: <black>Cài Đặt Rương</black>
      CostOptions: <black>Lựa Chọn Chi Phí</black>
      CostOption: <black>Cài Đặt Chi Phí Lựa Chọn</black>
      Milestones: <black>Cột Mốc Của Rương</black>
    Reward:
      List: <black>Phần Thưởng Của Rương</black>
      Content: <black>Vật Phẩm Phần Thưởng</black>
      Settings: <black>Cài Đặt Phần Thưởng</black>
    Keys: <black>Trình Chỉnh Sửa Chìa Khoá</black>
    Key:
      Settings: <black>Cài Đặt Chìa Khoá</black>
  Enter:
    Amount: <gray>Nhập <green>[Số Lượng]</green></gray>
  Reward:
    Enter:
      Id: <gray>Nhập <green>[ID Phần Thưởng]</green></gray>
  Button:
    Main:
      Crates:
        Name: <green><b>Các Rương</b></green>
        Lore:
        - <gray>Có <green>%amount%</green> rương đã được tạo.</gray>
        - ' '
        - <green>→ <u>Nhấn để mở</u></green>
      Keys:
        Name: <gold><b>Các Chìa Khoá</b></gold>
        Lore:
        - <gray>Có <gold>%amount%</gold> chìa khoá đã được tạo.</gray>
        - ' '
        - <gold>→ <u>Nhấn để mở</u></gold>
    Crates:
      Crate:
        Name: '%crate_name%'
        Lore:
        - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white>%inspection%</white></gray>'
        - '<gray><dark_gray>» </dark_gray>ID: <white>%crate_id%</white></gray>'
        - ' '
        - <soft_yellow>→ <u>Nhấn để mở</u></soft_yellow>
      Create:
        Name: <green><b>Tạo Rương Mới</b></green>
        Lore:
        - <gray>Sử dụng nút này để tạo ra</gray>
        - <gray>những rương hoàn toàn mới!</gray>
        - ' '
        - <green>→ <u>Nhấn để tạo mới</u></green>
    Crate:
      Delete:
        Name: <red><b>Xoá Rương Này</b></red>
        Lore:
        - <gray>Xoá rương này vĩnh viễn.</gray>
        - ' '
        - <red>→ <u>Nhấn [<key:key.drop>] để xoá</u></red>
      DisplayName:
        Name: <soft_yellow><b>Tên Hiển Thị</b></soft_yellow>
        Lore:
        - '<gray><dark_gray>» </dark_gray>Hiện Tại: <white>%crate_name%</white></gray>'
        - ' '
        - <gray>Đặt tên hiển thị cho rương này.</gray>
        - ' '
        - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
      Description:
        Name: <soft_yellow><b>Mô Tả Của Rương</b></soft_yellow>
        Lore:
        - '%crate_description%'
        - '%empty-if-above%'
        - <gray>Đặt mô tả cho rương này.</gray>
        - ' '
        - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
      Item:
        Name: <soft_yellow><b>Vật Phẩm Của Rương</b></soft_yellow>
        Lore:
        - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white>%inspection%</white></gray>'
        - '<gray><dark_gray>» </dark_gray>Cho Phép Xếp Chồng: <white>%state%</white></gray>'
        - ' '
        - <gray>Thả một vật phẩm lên nút <soft_yellow>này</soft_yellow></gray>
        - <gray>để thay đổi vật phẩm của rương này.</gray>
        - ' '
        - <soft_yellow>→ <u>Nhấn để thay đổi cho phép xếp chồng</u></soft_yellow>
      Preview:
        Set:
          Name: <soft_yellow><b>Xem Trước Giao Diện</b></soft_yellow>
          Lore:
          - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white>%inspection%</white></gray>'
          - '<gray><dark_gray>» </dark_gray>ID Xem Trước: <white>%value%</white></gray>'
          - ' '
          - <gray>Đặt xem trước giao diện cho rương này.</gray>
          - ' '
          - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
        Unset:
          Name: <soft_yellow><b>Xem Trước Giao Diện</b></soft_yellow>
          Lore:
          - '<gray><dark_gray>» </dark_gray>Tình Trạng: <white><red>Đã Tắt</red></white></gray>'
          - ' '
          - <gray>Đặt xem trước giao diện cho rương này.</gray>
          - ' '
          - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
      Opening:
