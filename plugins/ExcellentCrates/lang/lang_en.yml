        - <gray>Giới hạn số lần mở rương cho</gray>
        - <gray>mỗi người chơi cho đến khi họ phải</gray>
        - <gray>chờ qua khoảng thời gian được đặt.</gray>
        - ' '
        - <soft_yellow>→ <u>Nhấn để thay đổi</u></soft_yellow>
      Effect:
        Name: <soft_yellow><b>Hiệu Ứng Của Rương</b></soft_yellow>
        Lore:
        - '<gray><dark_gray>» </dark_gray>Hình Dạng: <white>%type%</white></gray>'
        - '<gray><dark_gray>» </dark_gray>Hạt (Particle): <white>%value%</white></gray>'
