      Body:
        Contents:
        - Tại đây bạn có thể đặt giới hạn mở rương cho mỗi người chơi.
        - ''
        - <soft_yellow>Thời Gian Hồi</soft_yellow> thiết lập khoảng thời gian (tính bằng giây) mà trong đó người chơi có thể mở rương một số lần nhất định được chỉ định ở phần <soft_yellow>Số Lượng</soft_yellow>.
        - ''
        - Khi thời gian này hết hạn, bộ đếm số lần mở rương của người chơi sẽ được đặt lại, làm cho rương khả dụng trở lại.
        - ''
        - Đồng hồ đếm thời gian hồi chiêu sẽ bắt đầu với rương đầu tiên được mở sau khi bộ đếm được đặt lại.
        - ''
        - <soft_yellow>→</soft_yellow> Để làm cho rương chỉ được mở một lần (không bao giờ đặt lại), đặt <soft_yellow>Thời Gian Hồi</soft_yellow> thành <soft_yellow>-1</soft_yellow>.
        - ''
        - <soft_yellow>→</soft_yellow> Để tắt tính năng này, hãy bỏ tích ô <soft_yellow>Bật Giới Hạn</soft_yellow>.
