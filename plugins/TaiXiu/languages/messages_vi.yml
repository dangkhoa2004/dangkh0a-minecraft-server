  not-enough-currency: '&#ED4245&l(!) &#E0E0E0ʙạɴ ᴋʜôɴɢ đủ ᴛɪềɴ để ᴛʜựᴄ ʜɪệɴ ɢɪᴀᴏ ᴅịᴄʜ
