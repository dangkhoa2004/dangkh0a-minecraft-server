      - ' '
      - '&#fcfcfc❖ ᴛổɴɢ 3 xúᴄ xắᴄ ᴛừ &#FCD05C4 - 10 &#fcfcfcѕẽ ʀᴀ &#B9FBC0xỉᴜ&#fcfcfc.'
      - '&#fcfcfc❖ ᴛổɴɢ 3 xúᴄ xắᴄ ᴛừ &#FCD05C11 - 17 &#fcfcfcѕẽ ʀᴀ &#FFB7B2ᴛàɪ&#fcfcfc.'
      - '&#fcfcfc❖ ᴛổɴɢ xúᴄ xắᴄ ʟà &#FCD05C3 &#fcfcfcʜᴏặᴄ &#FCD05C18 &#fcfcfcᴛʜì &#BDB2FFɴʜà
