      - '&#fcfcfc❖ ᴍứᴄ ᴄượᴄ ᴛốɪ ᴛʜɪểᴜ ʟà %currencySymbol%&#FFD700%minBet%&#fcfcfc.'
      - '&#fcfcfc❖ ᴍứᴄ ᴄượᴄ ᴛốɪ đᴀ ʟà %currencySymbol%&#FFD700%maxBet%&#fcfcfc.'
      - '&#fcfcfc❖ ᴋʜɪ ᴛʜắɴɢ, ʙạɴ ѕẽ ɴʜậɴ đượᴄ &#57F287ɢấᴘ đôɪ &#fcfcfcѕố ᴛɪềɴ đã ᴄượᴄ.'
      - '&#FCD05C⭐ ᴄʜúᴄ ʙạɴ ᴍᴀʏ ᴍắɴ!'
