##Swords
Guides.Swords.Section.0=§x§A§3§C§4§F§3Về Dùɴɢ Kɪếᴍ:\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ɴàʏ ʙᴀɴ ᴛʜưởɴɢ ᴄáᴄ ᴄʜỉ ꜱố ᴄʜɪếɴ đấᴜ ᴄʜᴏ ᴀɪ ᴄʜɪếɴ đấᴜ ʙằɴɢ ᴋɪếᴍ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴅựᴀ ᴛʀêɴ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ ɢâʏ ʀᴀ ʟêɴ ǫᴜáɪ ʜᴏặᴄ \n§x§F§D§F§D§9§6ɴɢườɪ ᴄʜơɪ ᴋʜɪ ᴠáᴄ ᴋɪếᴍ ᴛʀêɴ ᴛᴀʏ.
Guides.Swords.Section.1=§x§A§3§C§4§F§3Nʜáᴛ ᴄʜéᴍ Răɴɢ ᴄưᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Nʜáᴛ ᴄʜéᴍ Răɴɢ ᴄưᴀ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴋíᴄʜ ʜᴏạᴛ ʙằɴɢ ᴄáᴄʜ\n§x§F§D§F§D§9§6ᴄʟɪᴄᴋ ᴘʜảɪ ᴋʜɪ ᴄầᴍ ᴋɪếᴍ. Kỹ ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ đáɴʜ \n§x§F§D§F§D§9§6AᴏE (Dɪệɴ ʀộɴɢ). Cú đáɴʜ AᴏE ɴàʏ ꜱẽ ɢâʏ ᴛʜêᴍ 25%\n§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠà ᴄó ᴋʜả ɴăɴɢ ɢâʏ Ráᴄʜ ᴠếᴛ ᴛʜươɴɢ (Bʟᴇᴇᴅ).
Guides.Swords.Section.2=§x§A§3§C§4§F§3Pʜảɴ ᴄôɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Pʜảɴ ᴄôɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ. Kʜɪ ʙạɴ đỡ đòɴ ᴠà ăɴ\n§x§F§D§F§D§9§6ʜɪᴛ ᴛừ ǫᴜáɪ, ʙạɴ ꜱẽ ᴄó ᴛỉ ʟệ ᴘʜảɴ ʟạɪ 50% \n§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠừᴀ ɴʜậɴ.
Guides.Swords.Section.3=§x§A§3§C§4§F§3Ráᴄʜ ᴠếᴛ ᴛʜươɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Ráᴄʜ ᴠếᴛ ᴛʜươɴɢ ᴋʜɪếɴ đốɪ ᴛʜủ ɴʜậɴ ꜱáᴛ ᴛʜươɴɢ ᴍỗɪ ʜᴀɪ ɢɪâʏ. Mụᴄ \n§x§F§D§F§D§9§6ᴛɪêᴜ ꜱẽ ʙị ʀỉ ᴍáᴜ ᴄʜᴏ đếɴ ᴋʜɪ ʜɪệᴜ ứɴɢ ᴋếᴛ ᴛʜúᴄ, ʜᴏặᴄ ᴄʜếᴛ, \n§x§F§D§F§D§9§6ᴛùʏ ᴄáɪ ɴàᴏ ᴛớɪ ᴛʀướᴄ.\n§x§F§D§F§D§9§6Tʜờɪ ɢɪᴀɴ ʀỉ ᴍáᴜ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ ᴋỹ ɴăɴɢ ᴋɪếᴍ ᴄủᴀ ʙạɴ.
##Taming
Guides.Taming.Section.0=§x§A§3§C§4§F§3Về Tʜᴜầɴ ʜóᴀ:\n§x§F§D§F§D§9§6Tʜᴜầɴ ʜóᴀ ᴍᴀɴɢ ʟạɪ ᴄʜᴏ ɴɢườɪ ᴄʜơɪ ɴʜɪềᴜ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜɪ ᴅắᴛ ᴛʜᴇᴏ\n§x§F§D§F§D§9§6ꜱóɪ đã đượᴄ ᴛʜᴜầɴ ʜóᴀ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Để ʟấʏ XP ᴋỹ ɴăɴɢ ɴàʏ, ʙạɴ ᴄầɴ ᴛʜᴜầɴ ʜóᴀ ꜱóɪ/ᴍèᴏ ʀừɴɢ ʜᴏặᴄ\n§x§F§D§F§D§9§6ᴄʜỉ ᴄầɴ ᴍᴀɴɢ ᴄʜúɴɢ ᴛʜᴇᴏ ᴛʀᴏɴɢ ɢɪᴀᴏ ᴛʀᴀɴʜ.
Guides.Taming.Section.1=§x§A§3§C§4§F§3Tɪếɴɢ ɢọɪ Nơɪ Hᴏᴀɴɢ ᴅã ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Tɪếɴɢ ɢọɪ Nơɪ Hᴏᴀɴɢ ᴅã ʟà ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ ɢɪúᴘ ʙạɴ ɢọɪ\n§x§F§D§F§D§9§6ᴍộᴛ ᴄʜú ꜱóɪ ʜᴏặᴄ ᴍèᴏ ʀừɴɢ ᴛớɪ ʙêɴ ᴄạɴ. Bạɴ ᴄó ᴛʜể ʟàᴍ ᴠɪệᴄ ɴàʏ ʙằɴɢ ᴄáᴄʜ\n§x§F§D§F§D§9§6ɴɢồɪ (ꜱɴᴇᴀᴋ) + ᴄʟɪᴄᴋ ᴛʀáɪ ᴋʜɪ đᴀɴɢ ᴄầᴍ xươɴɢ ʜᴏặᴄ ᴄá.
Guides.Taming.Section.2=§x§A§3§C§4§F§3Hɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Hɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ꜱᴏɪ ᴛʜú ᴄưɴɢ ᴠà xᴇᴍ\n§x§F§D§F§D§9§6ᴄʜỉ ꜱố ᴄủᴀ ꜱóɪ ᴠà ᴍèᴏ ʀừɴɢ. Cʟɪᴄᴋ ᴛʀáɪ ᴠàᴏ ꜱóɪ ʜᴏặᴄ ᴍèᴏ ʀừɴɢ để ᴅùɴɢ\n§x§F§D§F§D§9§6Hɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ.
Guides.Taming.Section.3=§x§A§3§C§4§F§3Cắɴ xé ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Cắɴ xé ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ, ᴄó xáᴄ ꜱᴜấᴛ ɢâʏ ʜɪệᴜ ứɴɢ\n§x§F§D§F§D§9§6ʀỉ ᴍáᴜ ʟêɴ ɴʜữɴɢ ᴋẻ địᴄʜ ʙị đàɴ ꜱóɪ ᴄủᴀ ʙạɴ ᴛấɴ ᴄôɴɢ.
Guides.Taming.Section.4=§x§A§3§C§4§F§3Vᴜốᴛ Sắᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Vᴜốᴛ Sắᴄ ʟàᴍ ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ ᴍà ꜱóɪ\n§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ ᴄắɴ ᴠàᴏ đốɪ ᴘʜươɴɢ. Sáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴅựᴀ ᴠàᴏ ᴄấᴘ Tʜᴜầɴ ʜóᴀ ᴄủᴀ ʙạɴ.
Guides.Taming.Section.5=§x§A§3§C§4§F§3Nʜậɴ ᴛʜứᴄ Môɪ ᴛʀườɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ꜱẽ ɢɪúᴘ ꜱóɪ ᴅịᴄʜ ᴄʜᴜʏểɴ ᴠề ʙêɴ ʙạɴ ᴋʜɪ\n§x§F§D§F§D§9§6ᴄʜúɴɢ ʟảɴɢ ᴠảɴɢ ǫᴜᴀɴʜ ɴơɪ ɴɢᴜʏ ʜɪểᴍ, ᴋɪểᴜ Xươɴɢ ʀồɴɢ/Dᴜɴɢ ɴʜᴀᴍ. Nó ᴄũɴɢ ɢɪúᴘ\n§x§F§D§F§D§9§6ꜱóɪ ᴍɪễɴ ɴʜɪễᴍ ʜᴏàɴ ᴛᴏàɴ ᴠớɪ ꜱáᴛ ᴛʜươɴɢ ʀơɪ.
Guides.Taming.Section.6=§x§A§3§C§4§F§3Lôɴɢ Dàʏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ɢɪảᴍ ꜱáᴛ ᴛʜươɴɢ ᴠà ʟàᴍ ᴄʜᴏ ꜱóɪ\n§x§F§D§F§D§9§6ᴋʜáɴɢ ʟạɪ ʟửᴀ.
Guides.Taming.Section.7=§x§A§3§C§4§F§3Cʜốɴɢ Sốᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ꜱóɪ ɢɪảᴍ ᴛʜɪệᴛ ʜạɪ\n§x§F§D§F§D§9§6ᴛừ ᴛʜᴜốᴄ ɴổ.
Guides.Taming.Section.8=§x§A§3§C§4§F§3Gɪᴀᴏ đồ ăɴ Nʜᴀɴʜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ꜱóɪ ᴄơ ʜộɪ đượᴄ ʜồɪ ᴍáᴜ ᴍỗɪ ᴋʜɪ\n§x§F§D§F§D§9§6ᴄʜúɴɢ ᴄắɴ ᴋẻ địᴄʜ.
##Unarmed
Guides.Unarmed.Section.0=§x§A§3§C§4§F§3Về Tᴀʏ Kʜôɴɢ:\n§x§F§D§F§D§9§6Tᴀʏ ᴋʜôɴɢ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ɴʜậɴ ᴄáᴄ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜɪ ꜱử ᴅụɴɢ\n§x§F§D§F§D§9§6ɴắᴍ đấᴍ ʟàᴍ ᴠũ ᴋʜí. \n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6XP ɴʜậɴ đượᴄ ᴅựᴀ ᴛʀêɴ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ đấᴍ đượᴄ ʟêɴ ǫᴜáɪ \n§x§F§D§F§D§9§6ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ ᴋʜɪ ʙạɴ ᴋʜôɴɢ ᴄầᴍ ɢì ᴛʀêɴ ᴛᴀʏ.
Guides.Unarmed.Section.1=§x§A§3§C§4§F§3Cᴜồɴɢ ɴộ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Cᴜồɴɢ ɴộ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ đượᴄ ᴋíᴄʜ ʜᴏạᴛ ʙằɴɢ\n§x§F§D§F§D§9§6ᴄʟɪᴄᴋ ᴘʜảɪ. Kʜɪ ở ᴛʀạɴɢ ᴛʜáɪ Cᴜồɴɢ ɴộ, ʙạɴ ɢâʏ ᴛʜêᴍ 50%\n§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠà ᴄó ᴛʜể đấᴍ ɴáᴛ ᴄáᴄ ᴋʜốɪ ᴍềᴍ ɴɢᴀʏ ᴛứᴄ ᴋʜắᴄ, ᴋɪểᴜ ɴʜư\n§x§F§D§F§D§9§6Đấᴛ ʜᴀʏ Cỏ.
Guides.Unarmed.Section.2=§x§A§3§C§4§F§3Tʜɪếᴛ Sᴀ Cʜưởɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Tʜɪếᴛ Sᴀ Cʜưởɴɢ ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ ᴋʜɪ ʙạɴ ʟấʏ ᴛᴀʏ\n§x§F§D§F§D§9§6đấᴍ ǫᴜáɪ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ.
Guides.Unarmed.Section.3=§x§A§3§C§4§F§3Đẩʏ ʟùɪ Cᴜɴɢ ᴛêɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Đẩʏ ʟùɪ Cᴜɴɢ ᴛêɴ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ\n§x§F§D§F§D§9§6ɢạᴛ ᴘʜăɴɢ ᴍũɪ ᴛêɴ ᴄủᴀ Bộ Xươɴɢ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ ʙắɴ ʀᴀ.\n§x§F§D§F§D§9§6Mũɪ ᴛêɴ ꜱẽ ʀớᴛ ʙịᴄʜ xᴜốɴɢ đấᴛ, ᴠô ʜạɪ.
Guides.Unarmed.Section.4=§x§A§3§C§4§F§3Tᴀʏ ᴋẹᴘ ꜱắᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Tᴀʏ ᴋẹᴘ ꜱắᴛ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ᴄʜốɴɢ ʟạɪ ᴠɪệᴄ ʙị ᴛướᴄ ᴠũ ᴋʜí. Cấᴘ độ\n§x§F§D§F§D§9§6Tᴀʏ ᴋʜôɴɢ ᴄàɴɢ ᴄᴀᴏ, ᴄơ ʜộɪ ᴄʜốɴɢ ᴛướᴄ ᴠũ ᴋʜí ᴄàɴɢ ᴛăɴɢ.
Guides.Unarmed.Section.5=§x§A§3§C§4§F§3Tướᴄ ᴠũ ᴋʜí ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ᴛướᴄ ᴠũ ᴋʜí ᴄủᴀ ɴɢườɪ ᴋʜáᴄ,\n§x§F§D§F§D§9§6ʟàᴍ ᴠũ ᴋʜí ᴍụᴄ ᴛɪêᴜ đᴀɴɢ ᴄầᴍ ʙị ʀớᴛ ʀᴀ ɴɢᴏàɪ.
##Woodcutting
Guides.Woodcutting.Section.0=§x§A§3§C§4§F§3Về ᴛɪềᴜ ᴘʜᴜ:\n§x§F§D§F§D§9§6ᴛɪềᴜ ᴘʜᴜ ɴóɪ ᴄʜᴜɴɢ ʟà đɪ đốɴ ᴄâʏ đấʏ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ʙấᴛ ᴄứ ᴋʜɪ ɴàᴏ ʙạɴ ᴄʜặᴛ ᴠỡ ᴍộᴛ ᴋʜốɪ ɢỗ.
Guides.Woodcutting.Section.1=§x§A§3§C§4§F§3Đốɴ ᴄâʏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Đốɴ ᴄâʏ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴄʟɪᴄᴋ ᴘʜảɪ\n§x§F§D§F§D§9§6ᴋʜɪ đᴀɴɢ ᴄầᴍ ʀìᴜ để ᴋíᴄʜ ʜᴏạᴛ. Kỹ ɴăɴɢ ɴàʏ\n§x§F§D§F§D§9§6ᴋʜɪếɴ ᴄả ᴄáɪ ᴄâʏ ᴠỡ ᴠụɴ ɴɢᴀʏ ʟậᴘ ᴛứᴄ, ʀớᴛ ʀᴀ\n§x§F§D§F§D§9§6ᴛᴏàɴ ʙộ ɢỗ ᴄủᴀ ᴄâʏ ᴛʀᴏɴɢ ᴛíᴄʜ ᴛắᴄ.
Guides.Woodcutting.Section.2=§x§A§3§C§4§F§3Máʏ Tʜổɪ Lá ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Máʏ Tʜổɪ Lá ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ʟàᴍ ᴄʜᴏ\n§x§F§D§F§D§9§6ʟá ᴄâʏ ɴổ ᴛᴜɴɢ ɴɢᴀʏ ʟậᴘ ᴛứᴄ ᴋʜɪ ʙạɴ ᴄʜéᴍ ʀìᴜ ᴠàᴏ. Mặᴄ địɴʜ,\n§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ᴍở ᴋʜóᴀ ở ᴄấᴘ 100.
Guides.Woodcutting.Section.3=§x§A§3§C§4§F§3Nʜâɴ đôɪ Sảɴ ʟượɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ ɴʜặᴛ đượᴄ ᴍộᴛ\n§x§F§D§F§D§9§6ᴋʜốɪ ɢỗ ᴅôɪ ʀᴀ ᴄʜᴏ ᴍỗɪ ᴋʜúᴄ ɢỗ ʙạɴ ᴄʜặᴛ.
# Crossbows
Guides.Crossbows.Section.0=§x§A§3§C§4§F§3Về Bắɴ ɴỏ:\n§x§F§D§F§D§9§6Bắɴ ɴỏ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ʙắɴ ᴋẻ ᴛʜù ʙằɴɢ ᴄʜɪếᴄ ɴỏ ᴄủᴀ ʙạɴ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ʙắɴ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʙằɴɢ Nỏ.
Guides.Crossbows.Section.1=§x§A§3§C§4§F§3Pʜáᴛ ʙắɴ Bậᴛ ᴛườɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bậᴛ ᴛườɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ, ʙạɴ ɴʜắᴍ ʙắɴ ɴỏ ở ɴʜữɴɢ ɢóᴄ ʜẹᴘ để ᴛʜựᴄ ʜɪệɴ ᴄú Bậᴛ ᴛườɴɢ. Mũɪ ᴛêɴ ꜱẽ ɴảʏ ʙậᴛ ʟạɪ ᴋʜɪ ᴄʜạᴍ ᴠàᴏ ᴛườɴɢ ʜᴏặᴄ ɴềɴ ᴠà ᴄó ᴛʜể xᴜʏêɴ ᴛʀúɴɢ ᴍụᴄ ᴛɪêᴜ. Số ʟượɴɢ ʟầɴ ʙậᴛ ɴảʏ ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ ʙậᴄ xếᴘ ʜạɴɢ ᴄủᴀ Pʜáᴛ ʙắɴ Bậᴛ ᴛườɴɢ.
# Tridents
Guides.Tridents.Section.0=§x§A§3§C§4§F§3Về Đɪɴʜ ʙᴀ:\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ Đɪɴʜ ʙᴀ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴘʜóɴɢ đɪɴʜ ʙᴀ xᴜʏêɴ ᴛʜủɴɢ ᴋẻ ᴛʜù.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ᴘʜɪ Đɪɴʜ ʙᴀ ᴠàᴏ ǫᴜáɪ ᴠậᴛ.
Guides.Maces.Section.0=§x§A§3§C§4§F§3Về Cʜùʏ:\n§x§F§D§F§D§9§6Cʜùʏ ɴóɪ ᴄʜᴜɴɢ ʟà đɪ đậᴘ ᴛᴀɴ ɴáᴛ ᴋẻ ᴛʜù ʙằɴɢ ᴍộᴛ ᴄáɪ Cʜùʏ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ɴệɴ Cʜùʏ ᴠàᴏ ǫᴜáɪ ᴠậᴛ.
Guides.Spears.Section.0=§x§A§3§C§4§F§3Về Tʜươɴɢ:\n§x§F§D§F§D§9§6Tʜươɴɢ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ đâᴍ ᴋẻ ᴛʜù ʙằɴɢ ᴄâʏ Tʜươɴɢ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ đâᴍ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʙằɴɢ Tʜươɴɢ.
