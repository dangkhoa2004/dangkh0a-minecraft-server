# File ghi đè ngôn ngữ mcMMO được tạo vào 05/03/2026 16:06
# -- Bạn đang muốn thay đổi ngôn ngữ của mcMMO mà không cần tự tay chỉnh sửa? --
#
# mcMMO có khá nhiều bản dịch có sẵn, bạn có thể chọn bản dịch bằng cách sửa config.yml với mã ngôn ngữ phù hợp. Cài đặt nằm ở `General.Locale` trong config.yml
# Khả năng cao là nếu bạn nói một ngôn ngữ phổ biến trên thế giới, chúng tôi đã có sẵn bản dịch cho nó.
# Tuy nhiên, các bản dịch của chúng tôi do cộng đồng đóng góp và ít khi được cập nhật. (Vui lòng giúp chúng tôi một tay <3)
# Chúng tôi rất mong có thêm nhiều người giúp cập nhật file ngôn ngữ, hãy gửi bất kỳ file dịch nào đã cập nhật lên GitHub của chúng tôi hoặc gửi email cho tôi tại business@neetgames.com
# Để xem danh sách các bản dịch có sẵn, hãy truy cập link này: https://github.com/mcMMO-Dev/mcMMO/tree/master/src/main/resources/locale
#
# -- Sử dụng bản dịch có sẵn -- 
# Giả sử bạn đã đọc phần trên, hãy sửa General.Locale trong config.yml từ en_US sang mã ngôn ngữ mà chúng tôi hỗ trợ (xem link trên), sau đó khởi động lại server của bạn
#
# -- Bạn có muốn thay đổi văn bản trong mcMMO không? Bao gồm cả thêm màu sắc? (Ghi đè Ngôn ngữ) -- 
# Đầu tiên, một lời giải thích ngắn gọn.
# Locales là các file ngôn ngữ được mcMMO sử dụng, chúng cũng chứa mã màu và phần lớn phong cách hiển thị của mcMMO.
# Bạn có thể tùy chỉnh file ngôn ngữ bên ngoài file JAR từ phiên bản 2.1.51 trở lên.
#
# Có thể ghi đè ngôn ngữ bằng cách chỉnh sửa file này
# Bạn có thể tìm thấy các file ngôn ngữ hiện tại được cập nhật mới nhất ở đây https://github.com/mcMMO-Dev/mcMMO/tree/master/src/main/resources/locale
# File gốc là en_US, nếu một bản dịch bị thiếu các mục (thường là vậy), nó sẽ lấy từ file en_US https://github.com/mcMMO-Dev/mcMMO/blob/master/src/main/resources/locale/locale_en_US.properties
#
# Để ghi đè một ngôn ngữ, hãy thêm các mục vào file này và sao chép ** chỉ ** những chuỗi bạn muốn thay thế, nếu không bạn sẽ không thấy bất kỳ chuỗi cập nhật nào khi mcMMO update và sẽ phải tự tay thay đổi chúng cũng như đọc kỹ patch notes.
# Nếu bạn muốn thay đổi mọi dòng theo cách nào đó, cứ thoải mái copy toàn bộ nội dung của file này, chỉ cần lưu ý là bạn sẽ phải theo dõi sát sao các bản cập nhật ngôn ngữ trong mcMMO và bám sát changelog của chúng tôi.
#
# WARNING: Hiện tại Locales chỉ hỗ trợ các ký tự ASCII và UTF16, vì vậy bạn sẽ cần chạy các ký tự đặc biệt qua bộ chuyển đổi UTF16 (tra google) để chúng hoạt động. Lỗi này sẽ được sửa trong tương lai!
# TÌM KEYS Ở ĐÂY: Trên repo github của chúng tôi (en_US là file gốc và có TẤT CẢ keys) -> https://github.com/mcMMO-Dev/mcMMO/tree/master/src/main/resources/locale
# WARNING: Một số keys trong file gốc của chúng tôi không được sử dụng, hãy tận dụng tối đa Ctrl+F
