##Acrobatics
Guides.Acrobatics.Section.0=§x§A§3§C§4§F§3Về Nʜàᴏ ʟộɴ:\n§x§F§D§F§D§9§6Nʜàᴏ ʟộɴ ʟà ɴɢʜệ ᴛʜᴜậᴛ ᴅɪ ᴄʜᴜʏểɴ Uʏểɴ ᴄʜᴜʏểɴ ᴛʀᴏɴɢ ᴍᴄᴍᴍᴏ.\n§x§F§D§F§D§9§6Nó ᴍᴀɴɢ ʟạɪ ᴄáᴄ ʙᴜꜰꜰ ᴛʀᴏɴɢ ᴄʜɪếɴ đấᴜ ᴠà ʙᴜꜰꜰ ꜱáᴛ ᴛʜươɴɢ ᴍôɪ ᴛʀườɴɢ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Để ᴄàʏ XP ᴋỹ ɴăɴɢ ɴàʏ ʙạɴ ᴄầɴ ᴛʜựᴄ ʜɪệɴ ᴍộᴛ ᴄú ɴé đòɴ\n§x§F§D§F§D§9§6ᴛʀᴏɴɢ ᴄʜɪếɴ đấᴜ ʜᴏặᴄ ꜱốɴɢ ꜱóᴛ ꜱᴀᴜ ᴋʜɪ ɴʜảʏ ᴛừ ᴛʀêɴ ᴄᴀᴏ xᴜốɴɢ.
Guides.Acrobatics.Section.1=§x§A§3§C§4§F§3Kỹ ɴăɴɢ Lộɴ ᴠòɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ᴄʜặɴ đượᴄ ꜱáᴛ ᴛʜươɴɢ \n§x§F§D§F§D§9§6ᴋʜɪ ɴɢã ᴛừ ᴛʀêɴ ᴄᴀᴏ xᴜốɴɢ. Bạɴ ᴄó ᴛʜể ɢɪữ ɴúᴛ ɴɢồɪ (ꜱɴᴇᴀᴋ)\n§x§F§D§F§D§9§6để ɴʜâɴ đôɪ ᴄơ ʜộɪ ɴé ꜱáᴛ ᴛʜươɴɢ ʟúᴄ ʀơɪ xᴜốɴɢ.\n§x§F§D§F§D§9§6Hàɴʜ độɴɢ ɴàʏ ꜱẽ ᴋíᴄʜ ʜᴏạᴛ Lộɴ ᴠòɴɢ Hᴏàɴ ʜảᴏ ᴛʜᴀʏ ᴠì Lộɴ ᴠòɴɢ ᴛʜườɴɢ.\n§x§F§D§F§D§9§6Lộɴ ᴠòɴɢ Hᴏàɴ ʜảᴏ ɢɪốɴɢ ʟộɴ ᴛʜườɴɢ ɴʜưɴɢ ᴅễ ᴋíᴄʜ ʜᴏạᴛ ʜơɴ ɢấᴘ đôɪ\n§x§F§D§F§D§9§6ᴠà ᴄʜặɴ đượᴄ ɴʜɪềᴜ ꜱáᴛ ᴛʜươɴɢ ʜơɴ.\n§x§F§D§F§D§9§6Tỉ ʟệ Lộɴ ᴠòɴɢ ɢắɴ ʟɪềɴ ᴠớɪ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴄủᴀ ʙạɴ
Guides.Acrobatics.Section.2=§x§A§3§C§4§F§3Né đòɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Né đòɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ɢɪảᴍ ᴍộᴛ ɴửᴀ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ\n§x§F§D§F§D§9§6ᴛʀᴏɴɢ ʟúᴄ ɢɪᴀᴏ ᴛʀᴀɴʜ.\n§x§F§D§F§D§9§6Tỉ ʟệ ɴàʏ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ ᴋỹ ɴăɴɢ.
##Alchemy
Guides.Alchemy.Section.0=§x§A§3§C§4§F§3Về Gɪả ᴋɪᴍ ᴛʜᴜậᴛ:\n§x§F§D§F§D§9§6Gɪả ᴋɪᴍ ᴛʜᴜậᴛ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴘʜᴀ ᴛʜᴜốᴄ.\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ɴàʏ ɢɪúᴘ ᴛăɴɢ ᴛốᴄ độ ᴘʜᴀ ᴄʜế, ᴄũɴɢ ɴʜư\n§x§F§D§F§D§9§6ᴄʜế ʀᴀ ɴʜữɴɢ ʟᴏạɪ ᴛʜᴜốᴄ ᴍớɪ (ʙìɴʜ ᴛʜườɴɢ) ᴋʜôɴɢ ᴛʜể ᴄʜế đượᴄ.\n\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Để ᴄàʏ XP ᴋỹ ɴăɴɢ ɴàʏ ʙạɴ ᴘʜảɪ đɪ ᴘʜᴀ ᴛʜᴜốᴄ.
Guides.Alchemy.Section.1=§x§A§3§C§4§F§3Tíɴʜ ɴăɴɢ Xúᴄ ᴛáᴄ ʟà ꜱᴀᴏ?\n§x§F§D§F§D§9§6Xúᴄ ᴛáᴄ ʟàᴍ ᴛăɴɢ ᴛốᴄ độ ᴘʜᴀ ᴛʜᴜốᴄ, ᴠớɪ\n§x§F§D§F§D§9§6ᴛốᴄ độ ᴛốɪ đᴀ ʟà x4 ở ᴄấᴘ 1000.\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ɴàʏ ᴛự ᴍở ᴋʜóᴀ ở ᴄấᴘ 100 ᴛʜᴇᴏ ᴍặᴄ địɴʜ.
Guides.Alchemy.Section.2=§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ ʟà ꜱᴀᴏ?\n§x§F§D§F§D§9§6Cʜᴏ ᴘʜéᴘ ᴅùɴɢ ᴄáᴄ ɴɢᴜʏêɴ ʟɪệᴜ ʟạ để ᴘʜᴀ ᴛʜᴜốᴄ.\n§x§F§D§F§D§9§6Nɢᴜʏêɴ ʟɪệᴜ ʟạ ɴàᴏ đượᴄ ᴅùɴɢ ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ\n§x§F§D§F§D§9§6Hạɴɢ ᴄủᴀ ʙạɴ. Có 8 ᴛʜứ ʜạɴɢ để ᴍở ᴋʜóᴀ.
Guides.Alchemy.Section.3=§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 1:\n§x§F§D§F§D§9§6Bộᴛ Qᴜỷ ʟửᴀ, Mắᴛ ɴʜệɴ ʟêɴ ᴍᴇɴ, Nướᴄ ᴍắᴛ Gʜᴀꜱᴛ, Rᴇᴅꜱᴛᴏɴᴇ,\n§x§F§D§F§D§9§6Bộᴛ đá ᴘʜáᴛ ꜱáɴɢ, Đườɴɢ, Dưᴀ ʜấᴜ ʟấᴘ ʟáɴʜ, Cà ʀốᴛ ᴠàɴɢ,\n§x§F§D§F§D§9§6Kᴇᴍ ᴅᴜɴɢ ɴʜᴀᴍ, Bướᴜ Nᴇᴛʜᴇʀ, Mắᴛ ɴʜệɴ, Tʜᴜốᴄ ꜱúɴɢ, Cʜâɴ ᴛʜỏ,\n§x§F§D§F§D§9§6Cá ɴóᴄ\n§x§F§D§F§D§9§6(Tʜᴜốᴄ ᴍặᴄ địɴʜ Mɪɴᴇᴄʀᴀꜰᴛ)
Guides.Alchemy.Section.4=§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 2:\n§x§F§D§F§D§9§6Cà ʀốᴛ (Tʜᴜốᴄ Đàᴏ ɴʜᴀɴʜ)\n§x§F§D§F§D§9§6Bóɴɢ ᴄʜấᴛ ɴʜờɴ (Tʜᴜốᴄ Đàᴏ ᴄʜậᴍ)\n\n§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 3:\n§x§F§D§F§D§9§6Tʜạᴄʜ ᴀɴʜ (Tʜᴜốᴄ Hấᴘ ᴛʜụ)\n§x§F§D§F§D§9§6
Guides.Alchemy.Section.5=§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 4:\n§x§F§D§F§D§9§6Táᴏ (Tʜᴜốᴄ Tăɴɢ Máᴜ ᴛốɪ đᴀ)\n§x§F§D§F§D§9§6Tʜịᴛ ᴛʜốɪ (Tʜᴜốᴄ Gâʏ Đóɪ)\n\n§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 5:\n§x§F§D§F§D§9§6Nấᴍ Nâᴜ (Tʜᴜốᴄ Gâʏ Bᴜồɴ ɴôɴ)\n§x§F§D§F§D§9§6Túɪ Mựᴄ (Tʜᴜốᴄ Gâʏ Mù)
Guides.Alchemy.Section.6=§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 6:\n§x§F§D§F§D§9§6Dươɴɢ xỉ (Tʜᴜốᴄ Nᴏ ʙụɴɢ)\n\n§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 7:\n§x§F§D§F§D§9§6Kʜᴏᴀɪ ᴛâʏ độᴄ (Tʜᴜốᴄ Pʜâɴ ʜủʏ)\n\n§x§A§3§C§4§F§3Pʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - Nɢᴜʏêɴ ʟɪệᴜ Hạɴɢ 8:\n§x§F§D§F§D§9§6Táᴏ Vàɴɢ ᴛʜườɴɢ (Tʜᴜốᴄ Kʜáɴɢ ꜱáᴛ ᴛʜươɴɢ)

##Archery
Guides.Archery.Section.0=§x§A§3§C§4§F§3Về Bắɴ ᴄᴜɴɢ:\n§x§F§D§F§D§9§6Bắɴ ᴄᴜɴɢ ᴛậᴘ ᴛʀᴜɴɢ ᴠàᴏ ᴠɪệᴄ ʙắɴ ʙằɴɢ ᴄᴜɴɢ ᴛêɴ.\n§x§F§D§F§D§9§6Cᴜɴɢ ᴄấᴘ ɴʜɪềᴜ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜáᴄ ɴʜᴀᴜ, ᴄʜẳɴɢ ʜạɴ ɴʜư ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ\n§x§F§D§F§D§9§6ᴛʜᴇᴏ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴠà ᴋʜả ɴăɴɢ ʟàᴍ ᴄʜᴏáɴɢ\n§x§F§D§F§D§9§6đốɪ ᴛʜủ ᴛʀᴏɴɢ PvP. Tʜêᴍ ᴠàᴏ đó, ʙạɴ ᴄó ᴛʜể ɴʜặᴛ ʟạɪ\n§x§F§D§F§D§9§6ᴘʜầɴ ɴàᴏ ꜱố ᴍũɪ ᴛêɴ đã ʙắɴ ʀᴀ ᴛừ ᴄáɪ xáᴄ ᴄủᴀ ᴋẻ địᴄʜ.\n\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Bắɴ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʜᴏặᴄ\n§x§F§D§F§D§9§6ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ.
Guides.Archery.Section.1=§x§A§3§C§4§F§3Bắɴ ᴄʜᴜẩɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bắɴ ᴄʜᴜẩɴ ᴄộɴɢ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ ᴄʜᴏ ᴍỗɪ ᴘʜáᴛ ʙắɴ.\n§x§F§D§F§D§9§6Lượɴɢ ꜱáᴛ ᴛʜươɴɢ ᴛừ Bắɴ ᴄʜᴜẩɴ ᴛăɴɢ ʟêɴ ᴋʜɪ ʙạɴ\n§x§F§D§F§D§9§6ʟêɴ ᴄấᴘ Bắɴ ᴄᴜɴɢ.\n§x§F§D§F§D§9§6Tʜᴇᴏ ᴍặᴄ địɴʜ, ꜱáᴛ ᴛʜươɴɢ ᴛừ ᴄᴜɴɢ ꜱẽ ᴛăɴɢ 10%\n§x§F§D§F§D§9§6ᴍỗɪ 50 ᴄấᴘ, ᴛốɪ đᴀ ʟà ᴄộɴɢ 200% ꜱáᴛ ᴛʜươɴɢ.
Guides.Archery.Section.2=§x§A§3§C§4§F§3Gâʏ Cʜᴏáɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟàᴍ đốɪ ᴛʜủ ʙị ᴄʜᴏáɴɢ ᴋʜɪ\n§x§F§D§F§D§9§6ʙắɴ ᴛʀúɴɢ ʜọ. Nếᴜ ʙị Cʜᴏáɴɢ, ᴍàɴ ʜìɴʜ đốɪ ᴛʜủ ꜱẽ ʙị éᴘ\n§x§F§D§F§D§9§6ɴʜìɴ ᴛʜẳɴɢ ʟêɴ ᴛʀờɪ ᴛʀᴏɴɢ ɢɪâʏ ʟáᴛ.\n§x§F§D§F§D§9§6Pʜáᴛ ʙắɴ ɢâʏ ᴄʜᴏáɴɢ ᴄũɴɢ ᴄộɴɢ ᴛʜêᴍ 4 ꜱáᴛ ᴛʜươɴɢ (2 ᴛɪᴍ).
Guides.Archery.Section.3=§x§A§3§C§4§F§3Tʜᴜ ʜồɪ ᴍũɪ ᴛêɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟấʏ ʟạɪ đượᴄ ᴍộᴛ ꜱố ᴍũɪ ᴛêɴ\n§x§F§D§F§D§9§6ꜱᴀᴜ ᴋʜɪ ɢɪếᴛ ᴍộᴛ ᴄᴏɴ ǫᴜáɪ ʙằɴɢ ᴄᴜɴɢ.\n§x§F§D§F§D§9§6Tỉ ʟệ ɴàʏ ᴛăɴɢ ʟêɴ ᴛʜᴇᴏ ᴄấᴘ độ Bắɴ ᴄᴜɴɢ.\n§x§F§D§F§D§9§6Tʜᴇᴏ ᴍặᴄ địɴʜ, ᴋỹ ɴăɴɢ ɴàʏ ᴛăɴɢ 0.1% ᴍỗɪ ᴄấᴘ, ʟêɴ ᴛốɪ đᴀ 100%\n§x§F§D§F§D§9§6ở ᴄấᴘ 1000.
##Axes
Guides.Axes.Section.0=§x§A§3§C§4§F§3Về Rìᴜ:\n§x§F§D§F§D§9§6Vớɪ ᴋỹ ɴăɴɢ Rìᴜ, ʙạɴ ᴄó ᴛʜể ᴅùɴɢ Rìᴜ ʟàᴍ ɴʜɪềᴜ ᴛʀò ʜơɴ\n§x§F§D§F§D§9§6ʟà ᴄʜỉ ʙɪếᴛ đɪ đốɴ ʀừɴɢ! Bạɴ ᴄó ᴛʜể ᴄʜặᴛ ᴠà ᴄʜéᴍ ǫᴜáɪ\n§x§F§D§F§D§9§6ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ để ᴄàʏ XP, đáɴʜ ǫᴜáɪ ᴠớɪ ʜɪệᴜ ứɴɢ\n§x§F§D§F§D§9§6đẩʏ ʟùɪ ᴠà ɢâʏ ʀᴀ ɴʜữɴɢ đòɴ ᴄʜí ᴍạɴɢ CHẾT NGƯỜI.\n§x§F§D§F§D§9§6Cʜɪếᴄ ʀìᴜ ᴄủᴀ ʙạɴ ᴄũɴɢ ʙɪếɴ ᴛʜàɴʜ ᴍáʏ ɴɢʜɪềɴ ɢỗ ᴄầᴍ ᴛᴀʏ,\n§x§F§D§F§D§9§6ᴘʜá ʜủʏ ɢɪáᴘ đốɪ ᴛʜủ ᴄựᴄ ᴅễ ᴋʜɪ ʙạɴ ở ᴄấᴘ độ ᴄᴀᴏ.\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Để ᴄàʏ XP ʙạɴ ᴄầɴ ᴄʜéᴍ ǫᴜáɪ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ\n§x§F§D§F§D§9§6ʙằɴɢ Rìᴜ.
Guides.Axes.Section.1=§x§A§3§C§4§F§3Bổ ᴄủɪ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ɴàʏ ɢɪúᴘ ʙạɴ đáɴʜ AᴏE (Sáᴛ ᴛʜươɴɢ Dɪệɴ ʀộɴɢ).\n§x§F§D§F§D§9§6Cú đáɴʜ AᴏE ɴàʏ ꜱẽ ɢâʏ ʀᴀ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ ʙằɴɢ ᴍộᴛ ɴửᴀ ꜱᴏ ᴠớɪ\n§x§F§D§F§D§9§6ᴍụᴄ ᴛɪêᴜ ᴄʜíɴʜ, ʀấᴛ ʜợᴘ để ᴅọɴ ᴅẹᴘ ʙầʏ ǫᴜáɪ ʟớɴ.
Guides.Axes.Section.2=§x§A§3§C§4§F§3Cʜí ᴍạɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Cʜí ᴍạɴɢ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ ɢɪúᴘ ɴɢườɪ ᴄʜơɪ ᴄó\n§x§F§D§F§D§9§6ᴄơ ʜộɪ ɢâʏ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ.\n§x§F§D§F§D§9§6Tʜᴇᴏ ᴍặᴄ địɴʜ, ᴄứ 2 ᴄấᴘ ᴋỹ ɴăɴɢ Rìᴜ ꜱẽ ᴄʜᴏ\n§x§F§D§F§D§9§60.1% ᴛỉ ʟệ ɴổ Cʜí ᴍạɴɢ, ꜱáᴛ ᴛʜươɴɢ x2.0 \n§x§F§D§F§D§9§6ʟêɴ ǫᴜáɪ ʜᴏặᴄ x1.5 ʟêɴ ɴɢườɪ ᴄʜơɪ.
Guides.Axes.Section.3=§x§A§3§C§4§F§3Bậᴄ ᴛʜầʏ ᴅùɴɢ Rìᴜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bậᴄ ᴛʜầʏ ᴅùɴɢ Rìᴜ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ ᴛự ᴄộɴɢ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ\n§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ᴅùɴɢ Rìᴜ.\n§x§F§D§F§D§9§6Mặᴄ địɴʜ, ꜱáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴛăɴɢ 1 đɪểᴍ ᴍỗɪ 50 ᴄấᴘ,\n§x§F§D§F§D§9§6ᴛốɪ đᴀ ʟà 4 ꜱáᴛ ᴛʜươɴɢ ở ᴄấᴘ 200.
Guides.Axes.Section.4=§x§A§3§C§4§F§3Xᴜʏêɴ ɢɪáᴘ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Cʜéᴍ ᴠớɪ ʟựᴄ đủ ᴍạɴʜ để đậᴘ ɴáᴛ ɢɪáᴘ!\n§x§F§D§F§D§9§6Xᴜʏêɴ ɢɪáᴘ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟàᴍ ʜỏɴɢ\n§x§F§D§F§D§9§6áᴏ ɢɪáᴘ đốɪ ᴛʜủ. Sáᴛ ᴛʜươɴɢ ɢɪáᴘ ꜱẽ ᴛăɴɢ ᴛʜᴇᴏ ᴄấᴘ ᴅùɴɢ Rìᴜ.
Guides.Axes.Section.5=§x§A§3§C§4§F§3Côɴɢ ᴘʜá Mạɴʜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ᴛᴜɴɢ ʀᴀ ᴍộᴛ ᴄú đáɴʜ ᴄựᴄ ᴍạɴʜ\n§x§F§D§F§D§9§6ᴋʜɪ ᴄʜéᴍ ǫᴜáɪ ʜᴀʏ ɴɢườɪ ʙằɴɢ ʀìᴜ.\n§x§F§D§F§D§9§6Tỉ ʟệ ᴍặᴄ địɴʜ ʟà 25%. Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢâʏ ʀᴀ ʜɪệᴜ ứɴɢ\n§x§F§D§F§D§9§6đẩʏ ʟùɪ ᴄựᴄ ɢắᴛ, ᴛựᴀ ɴʜư ʙùᴀ Kɴᴏᴄᴋʙᴀᴄᴋ II\n§x§F§D§F§D§9§6Tʜêᴍ ᴠàᴏ đó, ɴó ᴄòɴ ɢâʏ ꜱáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴄʜᴏ ᴍụᴄ ᴛɪêᴜ.
##Excavation
Guides.Excavation.Section.0=§x§A§3§C§4§F§3Về Đàᴏ đấᴛ:\n§x§F§D§F§D§9§6Đàᴏ đấᴛ ʟà ʜàɴʜ độɴɢ xúᴄ đấᴛ ʟêɴ để ᴋɪếᴍ ᴋʜᴏ ʙáᴜ.\n§x§F§D§F§D§9§6Càɴɢ đàᴏ ɴʜɪềᴜ đấᴛ ʙạɴ ᴄàɴɢ ʀᴀ đồ xịɴ.\n§x§F§D§F§D§9§6Đàᴏ ᴄàɴɢ ʟâᴜ ᴋʜᴏ ʙáᴜ ʀᴀ ᴄàɴɢ ᴋʜủɴɢ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Cầᴍ xẻɴɢ ᴛʀêɴ ᴛᴀʏ ᴠà đɪ đàᴏ đấᴛ.\n§x§F§D§F§D§9§6Cʜỉ ᴍộᴛ ꜱố ʟᴏạɪ ᴋʜốɪ ᴍớɪ ʀớᴛ đồ ᴠà ᴄʜᴏ XP.
Guides.Excavation.Section.1=§x§A§3§C§4§F§3Cáᴄ ᴋʜốɪ ʜợᴘ ʟệ:\n§x§F§D§F§D§9§6Cỏ, Đấᴛ, Cáᴛ, Đấᴛ ꜱéᴛ, Sỏɪ, Rễ ɴấᴍ, Cáᴛ ʟɪɴʜ ʜồɴ, Tᴜʏếᴛ
Guides.Excavation.Section.2=§x§A§3§C§4§F§3Cáᴄʜ ᴅùɴɢ Sɪêᴜ Máʏ ᴋʜᴏᴀɴ:\n§x§F§D§F§D§9§6Cầᴍ xẻɴɢ ᴛʀêɴ ᴛᴀʏ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴄʜᴜẩɴ ʙị đồ ɴɢʜề.\n§x§F§D§F§D§9§6Lúᴄ ɴàʏ ʙạɴ ᴄó ᴋʜᴏảɴɢ 4 ɢɪâʏ để xúᴄ ᴠàᴏ\n§x§F§D§F§D§9§6ᴄáᴄ ʟᴏạɪ ᴋʜốɪ Đàᴏ đấᴛ ʜợᴘ ʟệ, ᴛừ đó ꜱẽ\n§x§F§D§F§D§9§6ᴋíᴄʜ ʜᴏạᴛ Sɪêᴜ Máʏ Kʜᴏᴀɴ.
Guides.Excavation.Section.3=§x§A§3§C§4§F§3Sɪêᴜ Máʏ ᴋʜᴏᴀɴ ʟà ɢì?\n§x§F§D§F§D§9§6Sɪêᴜ Máʏ ᴋʜᴏᴀɴ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ\n§x§F§D§F§D§9§6ɢắɴ ʟɪềɴ ᴠớɪ Đàᴏ đấᴛ. Nó x3 ᴄơ ʜộɪ\n§x§F§D§F§D§9§6ᴛìᴍ ᴛʜấʏ ᴋʜᴏ ʙáᴜ ᴠà ᴄʜᴏ ᴘʜéᴘ ʙạɴ Đàᴏ ᴛứᴄ ᴛʜì\n§x§F§D§F§D§9§6(Iɴꜱᴛᴀɴᴛ ʙʀᴇᴀᴋ) ᴄáᴄ ᴋʜốɪ ʜợᴘ ʟệ.
Guides.Excavation.Section.4=§x§A§3§C§4§F§3Kʜảᴏ ᴄổ ʜọᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Mỗɪ ʟᴏạɪ ᴋʜᴏ ʙáᴜ ʀớᴛ ʀᴀ ᴛừ Đàᴏ đấᴛ đềᴜ ᴄó ᴍứᴄ ʏêᴜ ᴄầᴜ\n§x§F§D§F§D§9§6ᴄấᴘ độ ᴋỹ ɴăɴɢ ʀɪêɴɢ, ᴠì ᴛʜế ʀấᴛ ᴋʜó\n§x§F§D§F§D§9§6để ɴóɪ ᴄʜíɴʜ xáᴄ ɴó ɢɪúᴘ đượᴄ ʙạɴ ʙᴀᴏ ɴʜɪêᴜ.\n§x§F§D§F§D§9§6Cʜỉ ᴄầɴ ɴʜớ ʟà ᴋỹ ɴăɴɢ Đàᴏ đấᴛ ᴄàɴɢ ᴄᴀᴏ\n§x§F§D§F§D§9§6ᴛʜì ᴋʜᴏ ʙáᴜ ʙạɴ đàᴏ đượᴄ ᴄàɴɢ ɴʜɪềᴜ.\n§x§F§D§F§D§9§6Và ᴄũɴɢ ɴêɴ ɴʜớ ʟà ᴍỗɪ ʟᴏạɪ ᴋʜốɪ ʜợᴘ ʟệ để đàᴏ\n§x§F§D§F§D§9§6đềᴜ ᴄʜứᴀ ɴʜữɴɢ ᴘʜầɴ ᴛʜưởɴɢ ᴋʜᴏ ʙáᴜ ʀɪêɴɢ ʙɪệᴛ.\n§x§F§D§F§D§9§6Nóɪ ᴄáᴄʜ ᴋʜáᴄ đàᴏ Đấᴛ ʀớᴛ đồ ᴋʜáᴄ\n§x§F§D§F§D§9§6ᴠớɪ đàᴏ Sỏɪ.
Guides.Excavation.Section.5=§x§A§3§C§4§F§3Lưᴜ ý ᴠề Đàᴏ đấᴛ:\n§x§F§D§F§D§9§6Đồ ʀớᴛ ʀᴀ ᴋʜɪ đàᴏ đấᴛ ᴄó ᴛʜể ᴛùʏ ᴄʜỉɴʜ ʜᴏàɴ ᴛᴏàɴ\n§x§F§D§F§D§9§6ɴêɴ đồ ꜱẽ ᴋʜáᴄ ɴʜᴀᴜ ᴛùʏ ᴛʜᴇᴏ ᴛừɴɢ ꜱᴇʀᴠᴇʀ.
##Fishing
Guides.Fishing.Section.0=§x§A§3§C§4§F§3Về Câᴜ ᴄá:\n§x§F§D§F§D§9§6Vớɪ ᴋỹ ɴăɴɢ Câᴜ ᴄá, ᴠɪệᴄ ᴄâᴜ ᴄá ʟạɪ ᴛʀở ɴêɴ ᴛʜú ᴠị!\n§x§F§D§F§D§9§6Câᴜ ᴋʜᴏ ʙáᴜ ʙí ᴍậᴛ, ᴠà ɢɪậᴛ đồ ᴛừ ʙọɴ ǫᴜáɪ ᴠậᴛ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Đɪ ᴄâᴜ ᴄá.
Guides.Fishing.Section.1=§x§A§3§C§4§F§3Tʜợ ꜱăɴ Kʜᴏ ʙáᴜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴄâᴜ ʟêɴ ᴋʜᴏ ʙáᴜ\n§x§F§D§F§D§9§6ᴠớɪ ᴛỉ ʟệ ɴʜỏ ᴄâᴜ đượᴄ đồ ᴄó ʙùᴀ ᴘʜéᴘ.\n§x§F§D§F§D§9§6Mọɪ ʟᴏạɪ ᴋʜᴏ ʙáᴜ Câᴜ ᴄá đềᴜ ᴄó ᴄơ ʜộɪ\n§x§F§D§F§D§9§6ʀớᴛ ʀᴀ ở ᴍọɪ ᴄấᴘ độ. Dù ᴠậʏ ɴó ᴘʜụ ᴛʜᴜộᴄ\n§x§F§D§F§D§9§6ᴠàᴏ độ ʜɪếᴍ ᴄủᴀ ᴍóɴ đồ ᴍà ᴛầɴ ꜱᴜấᴛ ʀớᴛ ᴋʜáᴄ ɴʜᴀᴜ.\n§x§F§D§F§D§9§6Cấᴘ độ Câᴜ ᴄá ᴄủᴀ ʙạɴ ᴄàɴɢ ᴄᴀᴏ, ᴄơ ʜộɪ\n§x§F§D§F§D§9§6ᴛìᴍ đượᴄ ᴋʜᴏ ʙáᴜ xịɴ ᴄàɴɢ ʟớɴ.
Guides.Fishing.Section.2=§x§A§3§C§4§F§3Câᴜ ᴄá ᴛʀêɴ Băɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ đɪ ᴄâᴜ ở ᴄáᴄ ʜồ đóɴɢ ʙăɴɢ!\n§x§F§D§F§D§9§6Pʜóɴɢ ᴍồɪ ᴄâᴜ xᴜốɴɢ ᴍặᴛ ʜồ đóɴɢ ʙăɴɢ ᴠà ᴋỹ ɴăɴɢ ɴàʏ ꜱẽ\n§x§F§D§F§D§9§6ᴛự đụᴄ ᴍộᴛ ʟỗ ɴʜỏ ᴛʀêɴ ʙăɴɢ để ʙạɴ ᴄâᴜ.
Guides.Fishing.Section.3=§x§A§3§C§4§F§3Cʜᴜʏêɴ ɢɪᴀ Câᴜ ᴄá ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ʟàᴍ ᴄá ᴄắɴ ᴄâᴜ ɴʜᴀɴʜ ʜơɴ.\n§x§F§D§F§D§9§6Kʜɪ đã ᴍở ᴋʜóᴀ, ɴếᴜ ʙạɴ ɴɢồɪ ᴛʀêɴ ᴛʜᴜʏềɴ ᴍà ᴄâᴜ\n§x§F§D§F§D§9§6ᴛʜì ᴛỉ ʟệ ᴄâᴜ ᴛʀúɴɢ ᴄá ꜱẽ ᴄᴀᴏ ʜơɴ.
Guides.Fishing.Section.4=§x§A§3§C§4§F§3Gɪậᴛ đồ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ᴄʜủ độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴍóᴄ ᴍồɪ ᴄâᴜ\n§x§F§D§F§D§9§6ᴠàᴏ ǫᴜáɪ ᴠậᴛ để ɢɪậᴛ đồ ʀơɪ ʀᴀ.\n§x§F§D§F§D§9§6Qᴜáɪ ꜱẽ ʀớᴛ ʀᴀ ᴍóɴ đồ ᴍà ᴄʜúɴɢ ᴛʜườɴɢ ʀớᴛ ᴋʜɪ ʙị ɢɪếᴛ ᴄʜếᴛ.\n§x§F§D§F§D§9§6Tʜậᴍ ᴄʜí ʙạɴ ᴄòɴ ᴄó ᴛʜể ɢɪậᴛ đượᴄ ꜱọ ǫᴜáɪ (Sᴋᴜʟʟ),\n§x§F§D§F§D§9§6Tʜứ ᴍà ʙìɴʜ ᴛʜườɴɢ ᴋʜôɴɢ ᴛʜể ᴄó đượᴄ ở ᴄʜế độ ꜱɪɴʜ ᴛồɴ.
Guides.Fishing.Section.5=§x§A§3§C§4§F§3Cʜế độ ăɴ ᴄủᴀ Nɢư ᴅâɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴛăɴɢ ʟượɴɢ ᴛʜứᴄ ăɴ đượᴄ ʜồɪ ʟạɪ\n§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ăɴ ᴄá.
Guides.Fishing.Section.6=§x§A§3§C§4§F§3Lưᴜ ý ᴠề Câᴜ ᴄá:\n§x§F§D§F§D§9§6Đồ ʀớᴛ ʀᴀ ᴋʜɪ Câᴜ ᴄá ᴄó ᴛʜể ᴛùʏ ᴄʜỉɴʜ ʜᴏàɴ ᴛᴏàɴ,\n§x§F§D§F§D§9§6ɴêɴ đồ ꜱẽ ᴋʜáᴄ ɴʜᴀᴜ ᴛùʏ ᴛʜᴇᴏ ᴛừɴɢ ꜱᴇʀᴠᴇʀ.
##Herbalism
Guides.Herbalism.Section.0=§x§A§3§C§4§F§3Về Tʀồɴɢ ᴛʀọᴛ:\n§x§F§D§F§D§9§6Tʀồɴɢ ᴛʀọᴛ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴛʜᴜ ᴛʜậᴘ ᴛʜảᴏ ᴅượᴄ ᴠà ᴄâʏ ᴄốɪ.\n\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Tʜᴜ ᴛʜậᴘ ᴄâʏ ᴄốɪ ᴠà ᴛʜảᴏ ᴍộᴄ.
Guides.Herbalism.Section.1=§x§A§3§C§4§F§3Cáᴄ Kʜốɪ ʜợᴘ ʟệ\n§x§F§D§F§D§9§6Lúᴀ ᴍì, Kʜᴏᴀɪ ᴛâʏ, Cà ʀốᴛ, Dưᴀ ʜấᴜ, \n§x§F§D§F§D§9§6Bí ɴɢô, Míᴀ, Hạᴛ ᴄᴀ ᴄᴀᴏ, Hᴏᴀ, Xươɴɢ ʀồɴɢ, Nấᴍ,\n§x§F§D§F§D§9§6Bướᴜ Nᴇᴛʜᴇʀ, Lá ꜱúɴɢ, ᴠà Dâʏ ʟᴇᴏ.
Guides.Herbalism.Section.2=§x§A§3§C§4§F§3Mầᴍ ꜱốɴɢ (Gʀᴇᴇɴ Tᴇʀʀᴀ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Mầᴍ ꜱốɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ\n§x§F§D§F§D§9§6ᴋʜɪ đᴀɴɢ ᴄầᴍ ᴄᴜốᴄ để ᴋíᴄʜ ʜᴏạᴛ Mầᴍ ꜱốɴɢ.\n§x§F§D§F§D§9§6Mầᴍ ꜱốɴɢ ᴄʜᴏ ʙạɴ ᴛỉ ʟệ ɴʜặᴛ x3 ꜱảɴ ʟượɴɢ ᴋʜɪ\n§x§F§D§F§D§9§6ᴛʜᴜ ʜᴏạᴄʜ ᴄâʏ ᴛʀồɴɢ. Nó ᴄòɴ ᴄʜᴏ ʙạɴ ǫᴜʏềɴ\n§x§F§D§F§D§9§6ᴛʀᴜʏềɴ ᴍầᴍ ꜱốɴɢ ᴠàᴏ ᴄáᴄ ᴋʜốɪ để ᴛʜᴀʏ đổɪ ᴄʜúɴɢ ʙằɴɢ\n§x§F§D§F§D§9§6ʜạᴛ ɢɪốɴɢ ᴄó ᴛʀᴏɴɢ ᴋʜᴏ đồ.
Guides.Herbalism.Section.3=§x§A§3§C§4§F§3Bàɴ ᴛᴀʏ Xᴀɴʜ (Câʏ Tʀồɴɢ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ꜱẽ ᴛự độɴɢ ɢɪᴇᴏ ʟạɪ ʜạᴛ ɢɪốɴɢ\n§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ᴛʜᴜ ʜᴏạᴄʜ.\n§x§F§D§F§D§9§6Tỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ Tʀồɴɢ ᴛʀọᴛ.
Guides.Herbalism.Section.4=§x§A§3§C§4§F§3Bàɴ ᴛᴀʏ Xᴀɴʜ (Đá ᴄᴜộɪ/Gạᴄʜ đá/Đấᴛ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ᴄʜủ độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ʜô ʙɪếɴ ᴄáᴄ ᴋʜốɪ ɴàʏ ᴛʜàɴʜ\n§x§F§D§F§D§9§6ɴʜữɴɢ ᴋʜốɪ "ᴄó ʟɪêɴ ǫᴜᴀɴ ᴛớɪ ᴛʜựᴄ ᴠậᴛ". Bạɴ ᴄó ᴛʜể ʟàᴍ ᴠậʏ ʙằɴɢ ᴄáᴄʜ ᴄʟɪᴄᴋ ᴘʜảɪ\n§x§F§D§F§D§9§6ᴠàᴏ ᴍộᴛ ᴋʜốɪ, đồɴɢ ᴛʜờɪ ᴄầᴍ ʜạᴛ ɢɪốɴɢ. Cáᴄʜ ɴàʏ ꜱẽ ᴛốɴ 1 ʜạᴛ ɢɪốɴɢ.
Guides.Herbalism.Section.5=§x§A§3§C§4§F§3Cʜế độ ăɴ ᴄủᴀ Nôɴɢ ᴅâɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴛăɴɢ ʟượɴɢ ᴛʜứᴄ ăɴ ʜồɪ ʟạɪ \n§x§F§D§F§D§9§6ᴋʜɪ ăɴ Báɴʜ ᴍì, Báɴʜ ǫᴜʏ, Dưᴀ ʜấᴜ, Súᴘ Nấᴍ, Cà ʀốᴛ,\n§x§F§D§F§D§9§6ᴠà Kʜᴏᴀɪ ᴛâʏ.
Guides.Herbalism.Section.6=§x§A§3§C§4§F§3Mᴀʏ ᴍắɴ ᴄủᴀ Hʏʟɪᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ ᴛìᴍ ᴛʜấʏ ᴠậᴛ ᴘʜẩᴍ ǫᴜý\n§x§F§D§F§D§9§6ᴋʜɪ ᴄʜéᴍ ᴠỡ ᴍộᴛ ꜱố ʟᴏạɪ ᴋʜốɪ ʙằɴɢ ᴋɪếᴍ.
Guides.Herbalism.Section.7=§x§A§3§C§4§F§3Nʜâɴ đôɪ Sảɴ ʟượɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ʙạɴ ᴄó ᴛʜêᴍ ꜱảɴ ʟượɴɢ\n§x§F§D§F§D§9§6ᴋʜɪ ᴛʜᴜ ʜᴏạᴄʜ ᴍùᴀ ᴍàɴɢ.
##Mining
Guides.Mining.Section.0=§x§A§3§C§4§F§3Về Kʜᴀɪ ᴛʜáᴄ:\n§x§F§D§F§D§9§6Kʜᴀɪ ᴛʜáᴄ ʙᴀᴏ ɢồᴍ đàᴏ đá ᴠà ǫᴜặɴɢ. Nó ꜱẽ ᴄộɴɢ ᴛʜêᴍ\n§x§F§D§F§D§9§6ɴɢᴜʏêɴ ʟɪệᴜ ʀớᴛ ʀᴀ ᴋʜɪ ʙạɴ đàᴏ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Để ᴄó XP ᴋỹ ɴăɴɢ ɴàʏ, ʙạɴ ᴘʜảɪ ᴄầᴍ ᴄúᴘ để đàᴏ.\n§x§F§D§F§D§9§6Cʜỉ ᴍộᴛ ꜱố ᴋʜốɪ ɴʜấᴛ địɴʜ ᴍớɪ ᴄʜᴏ XP.
Guides.Mining.Section.1=§x§A§3§C§4§F§3Cáᴄ Kʜốɪ ʜợᴘ ʟệ:\n§x§F§D§F§D§9§6Đá, Qᴜặɴɢ Tʜᴀɴ, Qᴜặɴɢ Sắᴛ, Qᴜặɴɢ Vàɴɢ, Qᴜặɴɢ Kɪᴍ ᴄươɴɢ, Qᴜặɴɢ Rᴇᴅꜱᴛᴏɴᴇ,\n§x§F§D§F§D§9§6Qᴜặɴɢ Nɢọᴄ ʟưᴜ ʟʏ, Oʙꜱɪᴅɪᴀɴ, Đá ᴄᴜộɪ ᴍọᴄ ʀêᴜ, Đá Eɴᴅ,\n§x§F§D§F§D§9§6Đá ᴘʜáᴛ ꜱáɴɢ, ᴠà Nᴇᴛʜᴇʀʀᴀᴄᴋ.
Guides.Mining.Section.2=§x§A§3§C§4§F§3Cáᴄʜ ᴅùɴɢ Sɪêᴜ Cúᴘ:\n§x§F§D§F§D§9§6Cầᴍ ᴄúᴘ ᴛʀêɴ ᴛᴀʏ, ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴄʜᴜẩɴ ʙị đồ ɴɢʜề.\n§x§F§D§F§D§9§6Lúᴄ ɴàʏ ʙạɴ ᴄó ᴋʜᴏảɴɢ 4 ɢɪâʏ để xúᴄ ᴠàᴏ\n§x§F§D§F§D§9§6ᴄáᴄ ʟᴏạɪ ᴋʜốɪ Đàᴏ đấᴛ ʜợᴘ ʟệ, ᴛừ đó ꜱẽ ᴋíᴄʜ ʜᴏạᴛ\n§x§F§D§F§D§9§6Sɪêᴜ Cúᴘ.
Guides.Mining.Section.3=§x§A§3§C§4§F§3Sɪêᴜ Cúᴘ ʟà ɢì?\n§x§F§D§F§D§9§6Sɪêᴜ Cúᴘ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ ɢắɴ ʟɪềɴ ᴠớɪ ᴋỹ ɴăɴɢ Kʜᴀɪ ᴛʜáᴄ.\n§x§F§D§F§D§9§6Nó x3 ᴄơ ʜộɪ ʀớᴛ ᴛʜêᴍ đồ ᴠà ᴄʜᴏ ᴘʜéᴘ\n§x§F§D§F§D§9§6ʙạɴ Đàᴏ ᴛứᴄ ᴛʜì (Iɴꜱᴛᴀɴᴛ ʙʀᴇᴀᴋ) ᴠậᴛ ʟɪệᴜ Kʜᴀɪ ᴛʜáᴄ.
Guides.Mining.Section.4=§x§A§3§C§4§F§3Cáᴄʜ Đàᴏ ʙằɴɢ Tʜᴜốᴄ ɴổ:\n§x§F§D§F§D§9§6Cầᴍ ᴄúᴘ ᴛʀêɴ ᴛᴀʏ,\n§x§F§D§F§D§9§6ɴɢồɪ xᴜốɴɢ (ᴄʀᴏᴜᴄʜ) ᴠà ᴄʟɪᴄᴋ ᴄʜᴜộᴛ ᴘʜảɪ ᴠàᴏ TNT ᴛừ xᴀ. Cáᴄʜ ɴàʏ ꜱẽ ʟàᴍ TNT\n§x§F§D§F§D§9§6ɴổ ɴɢᴀʏ ʟậᴘ ᴛứᴄ.
Guides.Mining.Section.5=§x§A§3§C§4§F§3Đàᴏ ʙằɴɢ Tʜᴜốᴄ ɴổ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Đàᴏ ʙằɴɢ Tʜᴜốᴄ ɴổ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ ɢắɴ ʟɪềɴ ᴠớɪ ᴋỹ ɴăɴɢ\n§x§F§D§F§D§9§6Kʜᴀɪ ᴛʜáᴄ. Nó ᴛăɴɢ đɪểᴍ ᴛʜưởɴɢ ᴋʜɪ ᴅùɴɢ TNT ᴠà ᴄʜᴏ ʙạɴ\n§x§F§D§F§D§9§6ᴛʜể ᴋíᴄʜ ɴổ TNT ᴛừ xᴀ. Có ʙᴀ ᴘʜầɴ ᴛʀᴏɴɢ Đàᴏ ʙằɴɢ Tʜᴜốᴄ ɴổ.\n§x§F§D§F§D§9§6Pʜầɴ đầᴜ ʟà Bᴏᴍ Lớɴ Hơɴ, ɢɪúᴘ ᴛăɴɢ ʙáɴ ᴋíɴʜ ɴổ.\n§x§F§D§F§D§9§6Pʜầɴ ʜᴀɪ ʟà Cʜᴜʏêɴ ɢɪᴀ Tʜᴜốᴄ ɴổ, ɢɪúᴘ ɢɪảᴍ ꜱáᴛ ᴛʜươɴɢ\n§x§F§D§F§D§9§6ᴛừ ᴠụ ɴổ TNT. Pʜầɴ ʙᴀ ᴛʜì ꜱɪêᴜ đơɴ ɢɪảɴ, ɴó ᴛăɴɢ\n§x§F§D§F§D§9§6ʟượɴɢ ǫᴜặɴɢ ʀớᴛ ʀᴀ ᴛừ TNT ᴠà ɢɪảᴍ ʙớᴛ\n§x§F§D§F§D§9§6ɴʜữɴɢ ᴍảɴʜ ᴠỡ ʀáᴄ ʀưởɪ.
##Repair
Guides.Repair.Section.0=§x§A§3§C§4§F§3Về Sửᴀ ᴄʜữᴀ:\n§x§F§D§F§D§9§6Sửᴀ ᴄʜữᴀ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴅùɴɢ ᴍộᴛ ᴋʜốɪ Sắᴛ để ꜱửᴀ ɢɪáᴘ ᴠà\n§x§F§D§F§D§9§6ᴄôɴɢ ᴄụ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Sửᴀ ᴄôɴɢ ᴄụ ʜᴏặᴄ ɢɪáᴘ ʙằɴɢ Đᴇ ᴍᴄᴍᴍᴏ. Mặᴄ địɴʜ đâʏ ʟà\n§x§F§D§F§D§9§6ᴍộᴛ ᴋʜốɪ ꜱắᴛ ᴠà ᴋʜôɴɢ ɴêɴ ɴʜầᴍ ʟẫɴ ᴠớɪ\n§x§F§D§F§D§9§6Đᴇ ᴛʀᴏɴɢ Mɪɴᴇᴄʀᴀꜰᴛ Vᴀɴɪʟʟᴀ.
Guides.Repair.Section.1=§x§A§3§C§4§F§3Sửᴀ ᴄʜữᴀ ᴅùɴɢ ᴛʜế ɴàᴏ?\n§x§F§D§F§D§9§6Đặᴛ Đᴇ ᴍᴄᴍᴍᴏ xᴜốɴɢ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ꜱửᴀ đồ \n§x§F§D§F§D§9§6ʙạɴ đᴀɴɢ ᴄầᴍ. Hàɴʜ độɴɢ ɴàʏ ꜱẽ ᴛốɴ 1 ɴɢᴜʏêɴ ʟɪệᴜ ᴄʜᴏ ᴍỗɪ ʟầɴ ꜱửᴀ.
Guides.Repair.Section.2=§x§A§3§C§4§F§3Bậᴄ ᴛʜầʏ Sửᴀ ᴄʜữᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bậᴄ ᴛʜầʏ Sửᴀ ᴄʜữᴀ ʟàᴍ ᴛăɴɢ ʟượɴɢ độ ʙềɴ ʜồɪ ʟạɪ. Pʜầɴ độ ʙềɴ\n§x§F§D§F§D§9§6ᴄộɴɢ ᴛʜêᴍ ɴàʏ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ Sửᴀ ᴄʜữᴀ ᴄủᴀ ʙạɴ.
Guides.Repair.Section.3=§x§A§3§C§4§F§3Sɪêᴜ Sửᴀ ᴄʜữᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Sɪêᴜ Sửᴀ ᴄʜữᴀ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ. Kʜɪ ꜱửᴀ đồ,\n§x§F§D§F§D§9§6ɴó ꜱẽ ᴄʜᴏ ɴɢườɪ ᴄʜơɪ ᴍộᴛ ᴄơ ʜộɪ ꜱửᴀ đượᴄ đồ ᴠớɪ\n§x§F§D§F§D§9§6ʜɪệᴜ ǫᴜả ᴘʜụᴄ ʜồɪ ɴʜâɴ đôɪ.
Guides.Repair.Section.4=§x§A§3§C§4§F§3Rèɴ Bí ᴛʜᴜậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ꜱửᴀ đồ ᴠà ɢɪữ ʟạɪ\n§x§F§D§F§D§9§6ᴍộᴛ ᴛỉ ʟệ ɴʜấᴛ địɴʜ ʙùᴀ ᴘʜéᴘ ᴄủᴀ đồ. Nʜữɴɢ ʙùᴀ ᴄʜú ɴàʏ ᴄó ᴛʜể\n§x§F§D§F§D§9§6ɢɪữ ɴɢᴜʏêɴ ᴄấᴘ ʙậᴄ, ʙị ʜạ ᴄấᴘ xᴜốɴɢ ᴍộᴛ ʙậᴄ,\n§x§F§D§F§D§9§6ʜᴏặᴄ ᴍấᴛ ꜱạᴄʜ.
##Salvage
Guides.Salvage.Section.0=§x§A§3§C§4§F§3Về Pʜâɴ ʀã:\n§x§F§D§F§D§9§6Pʜâɴ ʀã ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴅùɴɢ ᴋʜốɪ Vàɴɢ để ᴘʜâɴ ʀã áᴏ ɢɪáᴘ ᴠà\n§x§F§D§F§D§9§6ᴄôɴɢ ᴄụ ᴛʜàɴʜ ɴɢᴜʏêɴ ʟɪệᴜ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Pʜâɴ ʀã ʟà ᴋỹ ɴăɴɢ ᴘʜâɴ ɴʜáɴʜ ᴄủᴀ Sửᴀ ᴄʜữᴀ ᴠà Câᴜ ᴄá, ᴄấᴘ Pʜâɴ ʀã\n§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ đượᴄ ᴛíɴʜ ᴅựᴀ ᴛʀêɴ ᴄấᴘ độ Câᴜ ᴄá ᴠà Sửᴀ ᴄʜữᴀ.
Guides.Salvage.Section.1=§x§A§3§C§4§F§3Pʜâɴ ʀã ᴅùɴɢ ᴛʜế ɴàᴏ?\n§x§F§D§F§D§9§6Đặᴛ Đᴇ Pʜâɴ ʀã ᴍᴄᴍᴍᴏ xᴜốɴɢ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴘʜâɴ ʀã\n§x§F§D§F§D§9§6ᴍóɴ đồ ʙạɴ đᴀɴɢ ᴄầᴍ. Làᴍ ᴛʜế ɴàʏ ꜱẽ đậᴘ ᴠỡ ᴍóɴ đồ,\n§x§F§D§F§D§9§6ᴠà ᴛʀả ʟạɪ ᴄʜᴏ ʙạɴ ᴠậᴛ ʟɪệᴜ ᴄấᴜ ᴛʜàɴʜ ᴍóɴ đồ đó.\n\n§x§F§D§F§D§9§6Ví ᴅụ, ᴘʜâɴ ʀã ᴄúᴘ ꜱắᴛ ꜱẽ ᴛʀả ʟạɪ ᴄʜᴏ ʙạɴ ᴘʜôɪ ꜱắᴛ.
Guides.Salvage.Section.2=§x§A§3§C§4§F§3Pʜâɴ ʀã Nâɴɢ ᴄᴀᴏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kʜɪ đượᴄ ᴍở ᴋʜóᴀ, ᴋʜả ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴘʜâɴ ʀã đồ ʙị ʜỏɴɢ.\n§x§F§D§F§D§9§6Tỉ ʟệ ᴛʜᴜ ʜồɪ ꜱẽ ᴛăɴɢ ᴋʜɪ ʙạɴ ʟêɴ ᴄấᴘ. Tỉ ʟệ ᴛʜᴜ ʜồɪ ᴄàɴɢ ᴄᴀᴏ\n§x§F§D§F§D§9§6đồɴɢ ɴɢʜĩᴀ ᴠớɪ ᴠɪệᴄ ʙạɴ ʟấʏ ʟạɪ đượᴄ ᴄàɴɢ ɴʜɪềᴜ ᴠậᴛ ʟɪệᴜ.\n§x§F§D§F§D§9§6Vớɪ ᴘʜâɴ ʀã ɴâɴɢ ᴄᴀᴏ ʙạɴ ꜱẽ ʟᴜôɴ ɴʜậɴ đượᴄ 1 ᴠậᴛ ʟɪệᴜ,\n§x§F§D§F§D§9§6ᴛʀừ ᴋʜɪ ᴍóɴ đồ đó ɴáᴛ ᴛươᴍ. Nêɴ ʙạɴ ᴋʜôɴɢ ᴄầɴ ᴘʜảɪ xᴏắɴ\n§x§F§D§F§D§9§6ᴄʜᴜʏệɴ đậᴘ ᴠỡ đồ ᴍà ᴛʀắɴɢ ᴛᴀʏ ᴋʜôɴɢ đượᴄ ᴄắᴄ ɴàᴏ.
Guides.Salvage.Section.3=§x§A§3§C§4§F§3Ví ᴅụ ᴍɪɴʜ ʜọᴀ ᴄʜᴏ ᴅễ ʜɪểᴜ ɴʜé:\n§x§F§D§F§D§9§6Gɪả ꜱử ᴛᴀ đɪ ᴘʜâɴ ʀã ᴍộᴛ ᴄáɪ ᴄúᴘ ᴠàɴɢ đã ʜỏɴɢ 20%,\n§x§F§D§F§D§9§6ɴɢʜĩᴀ ʟà ʟượɴɢ ᴠậᴛ ʟɪệᴜ ᴛốɪ đᴀ ʙạɴ ᴄó ᴛʜể ʟấʏ ʟạɪ ᴄʜỉ ʟà 2 ᴛʜỏɪ\n§x§F§D§F§D§9§6(ᴠì ᴄʜế ᴛạᴏ ᴄúᴘ ᴄầɴ 3 ᴛʜỏɪ ᴠàɴɢ - ᴍỗɪ ᴛʜỏɪ ᴄʜɪếᴍ\n§x§F§D§F§D§9§633,33% độ ʙềɴ) ʙằɴɢ ᴠớɪ 66%. Nếᴜ ᴘʜầɴ ᴛʀăᴍ ᴛʜᴜ ʜồɪ\n§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ ᴅướɪ 66% ᴛʜì ʙạɴ ᴋʜôɴɢ ᴛʜể ʟấʏ ʟạɪ đượᴄ 2 ᴛʜỏɪ đâᴜ.\n§x§F§D§F§D§9§6Nʜưɴɢ ɴếᴜ ᴠượᴛ ᴄᴏɴ ꜱố ɴàʏ ᴛʜì ʙạɴ ᴄó ᴛʜể ʟấʏ "ᴛʀọɴ ᴠẹɴ",\n§x§F§D§F§D§9§6ᴛứᴄ ʟà ʙạɴ ꜱẽ ẵᴍ ᴛʀọɴ 2 ᴛʜỏɪ ᴠàɴɢ.
Guides.Salvage.Section.4=§x§A§3§C§4§F§3Pʜâɴ ʀã Bí ᴛʜᴜậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kʜả ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴTôi chỉ được thiết kế để xử lý và tạo ra văn bản, nên không thể hỗ trợ bạn việc đó.
Guides.Woodcutting.Section.0=§x§A§3§C§4§F§3Về ᴛɪềᴜ ᴘʜᴜ:\n§x§F§D§F§D§9§6ᴛɪềᴜ ᴘʜᴜ ɴóɪ ᴄʜᴜɴɢ ʟà đɪ đốɴ ᴄâʏ đấʏ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ʙấᴛ ᴄứ ᴋʜɪ ɴàᴏ ʙạɴ ᴄʜặᴛ ᴠỡ ᴍộᴛ ᴋʜốɪ ɢỗ.
Guides.Woodcutting.Section.1=§x§A§3§C§4§F§3Đốɴ ᴄâʏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Đốɴ ᴄâʏ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴄʟɪᴄᴋ ᴘʜảɪ\n§x§F§D§F§D§9§6ᴋʜɪ đᴀɴɢ ᴄầᴍ ʀìᴜ để ᴋíᴄʜ ʜᴏạᴛ. Kỹ ɴăɴɢ ɴàʏ\n§x§F§D§F§D§9§6ᴋʜɪếɴ ᴄả ᴄáɪ ᴄâʏ ᴠỡ ᴠụɴ ɴɢᴀʏ ʟậᴘ ᴛứᴄ, ʀớᴛ ʀᴀ\n§x§F§D§F§D§9§6ᴛᴏàɴ ʙộ ɢỗ ᴄủᴀ ᴄâʏ ᴛʀᴏɴɢ ᴛíᴄʜ ᴛắᴄ.
Guides.Woodcutting.Section.2=§x§A§3§C§4§F§3Máʏ Tʜổɪ Lá ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Máʏ Tʜổɪ Lá ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ʟàᴍ ᴄʜᴏ\n§x§F§D§F§D§9§6ʟá ᴄâʏ ɴổ ᴛᴜɴɢ ɴɢᴀʏ ʟậᴘ ᴛứᴄ ᴋʜɪ ʙạɴ ᴄʜéᴍ ʀìᴜ ᴠàᴏ. Mặᴄ địɴʜ,\n§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ᴍở ᴋʜóᴀ ở ᴄấᴘ 100.
Guides.Woodcutting.Section.3=§x§A§3§C§4§F§3Nʜâɴ đôɪ Sảɴ ʟượɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ ɴʜặᴛ đượᴄ ᴍộᴛ\n§x§F§D§F§D§9§6ᴋʜốɪ ɢỗ ᴅôɪ ʀᴀ ᴄʜᴏ ᴍỗɪ ᴋʜúᴄ ɢỗ ʙạɴ ᴄʜặᴛ.
# Crossbows
Guides.Crossbows.Section.0=§x§A§3§C§4§F§3Về Bắɴ ɴỏ:\n§x§F§D§F§D§9§6Bắɴ ɴỏ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ʙắɴ ᴋẻ ᴛʜù ʙằɴɢ ᴄʜɪếᴄ ɴỏ ᴄủᴀ ʙạɴ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ʙắɴ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʙằɴɢ Nỏ.
Guides.Crossbows.Section.1=§x§A§3§C§4§F§3Pʜáᴛ ʙắɴ Bậᴛ ᴛườɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\n§x§F§D§F§D§9§6Bậᴛ ᴛườɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ, ʙạɴ ɴʜắᴍ ʙắɴ ɴỏ ở ɴʜữɴɢ ɢóᴄ ʜẹᴘ để ᴛʜựᴄ ʜɪệɴ ᴄú Bậᴛ ᴛườɴɢ. Mũɪ ᴛêɴ ꜱẽ ɴảʏ ʙậᴛ ʟạɪ ᴋʜɪ ᴄʜạᴍ ᴠàᴏ ᴛườɴɢ ʜᴏặᴄ ɴềɴ ᴠà ᴄó ᴛʜể xᴜʏêɴ ᴛʀúɴɢ ᴍụᴄ ᴛɪêᴜ. Số ʟượɴɢ ʟầɴ ʙậᴛ ɴảʏ ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ ʙậᴄ xếᴘ ʜạɴɢ ᴄủᴀ Pʜáᴛ ʙắɴ Bậᴛ ᴛườɴɢ.
# Tridents
Guides.Tridents.Section.0=§x§A§3§C§4§F§3Về Đɪɴʜ ʙᴀ:\n§x§F§D§F§D§9§6Kỹ ɴăɴɢ Đɪɴʜ ʙᴀ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴘʜóɴɢ đɪɴʜ ʙᴀ xᴜʏêɴ ᴛʜủɴɢ ᴋẻ ᴛʜù.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ᴘʜɪ Đɪɴʜ ʙᴀ ᴠàᴏ ǫᴜáɪ ᴠậᴛ.
Guides.Maces.Section.0=§x§A§3§C§4§F§3Về Cʜùʏ:\n§x§F§D§F§D§9§6Cʜùʏ ɴóɪ ᴄʜᴜɴɢ ʟà đɪ đậᴘ ᴛᴀɴ ɴáᴛ ᴋẻ ᴛʜù ʙằɴɢ ᴍộᴛ ᴄáɪ Cʜùʏ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ ɴệɴ Cʜùʏ ᴠàᴏ ǫᴜáɪ ᴠậᴛ.
Guides.Spears.Section.0=§x§A§3§C§4§F§3Về Tʜươɴɢ:\n§x§F§D§F§D§9§6Tʜươɴɢ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ đâᴍ ᴋẻ ᴛʜù ʙằɴɢ ᴄâʏ Tʜươɴɢ.\n\n§x§A§3§C§4§F§3NHẬN XP:\n§x§F§D§F§D§9§6Nʜậɴ XP ᴍỗɪ ᴋʜɪ ʙạɴ đâᴍ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʙằɴɢ Tʜươɴɢ.
