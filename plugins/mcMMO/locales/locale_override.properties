Acrobatics.SubSkill.Roll.Mechanics=§x§A§A§A§A§A§ALộɴ ᴠòɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴘʜụ ᴄʜủ độɴɢ ᴋèᴍ ᴛʜᴇᴏ ʜɪệᴜ ứɴɢ ʙị độɴɢ.\nMỗɪ ᴋʜɪ ɴʜậɴ ꜱáᴛ ᴛʜươɴɢ ʀơɪ, ʙạɴ ᴄó ᴛỉ ʟệ ᴄʜặɴ đứɴɢ ʜᴏàɴ ᴛᴏàɴ ꜱáᴛ ᴛʜươɴɢ ᴅựᴀ ᴛʀêɴ ᴄấᴘ độ ᴋỹ ɴăɴɢ. Tạɪ ᴄấᴘ độ §x§F§D§F§D§9§6{6}%§x§A§A§A§A§A§A ʙạɴ ᴄó §x§F§D§F§D§9§6{0}%§x§A§A§A§A§A§A ᴄʜặɴ ꜱáᴛ ᴛʜươɴɢ, ᴠà §x§F§D§F§D§9§6{1}%§x§A§A§A§A§A§A ɴếᴜ ᴋíᴄʜ ʜᴏạᴛ Lộɴ ᴠòɴɢ Hᴏàɴ ʜảᴏ.\nTỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ ᴛỉ ʟệ ᴛʜᴜậɴ ᴠớɪ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴛʜᴇᴏ đườɴɢ ᴛʜẳɴɢ ᴄʜᴏ đếɴ ᴄấᴘ §x§F§D§F§D§9§6{2}§x§A§A§A§A§A§A ᴛʜì ᴛốɪ đᴀ, ᴍỗɪ ᴄấᴘ Nʜàᴏ ʟộɴ ᴛăɴɢ ᴛʜêᴍ §x§F§D§F§D§9§6{3}%§x§A§A§A§A§A§A ᴛỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ.\nGɪữ ᴘʜíᴍ ɴɢồɪ (ꜱɴᴇᴀᴋ) để ɴʜâɴ đôɪ ᴛỉ ʟệ ʟộɴ ᴠòɴɢ ᴠà ᴄʜặɴ đứɴɢ ɢấᴘ đôɪ ꜱáᴛ ᴛʜươɴɢ ʀơɪ! Gɪữ ᴘʜíᴍ ɴɢồɪ ꜱẽ đổɪ ᴛừ ʟộɴ ᴠòɴɢ ᴛʜườɴɢ ᴛʜàɴʜ Lộɴ ᴠòɴɢ Hᴏàɴ ʜảᴏ.\nLộɴ ᴠòɴɢ ᴛʜườɴɢ ᴄʜặɴ đếɴ §x§E§D§4§2§4§5{4}§x§A§A§A§A§A§A ꜱáᴛ ᴛʜươɴɢ. Lộɴ ᴠòɴɢ Hᴏàɴ ʜảᴏ ᴄʜặɴ đếɴ §x§B§9§F§B§C§0{5}§x§A§A§A§A§A§A ꜱáᴛ ᴛʜươɴɢ.
