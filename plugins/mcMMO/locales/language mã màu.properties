# ᴛʜᴇ ᴍᴀꜱᴛᴇʀ ꜰɪʟᴇ ɪꜱ ᴇɴ_ᴜꜱ, ɪꜰ ᴀ ᴛʀᴀɴꜱʟᴀᴛɪᴏɴ ɪꜱ ᴍɪꜱꜱɪɴɢ ᴇɴᴛʀɪᴇꜱ (ᴀꜱ ᴛʜᴇʏ ᴏꜰᴛᴇɴ ᴀʀᴇ) ɪᴛ ᴡɪʟʟ ᴘᴜʟʟ ꜰʀᴏᴍ ᴛʜᴇ ᴇɴ_ᴜꜱ ꜰɪʟᴇ ʜᴛᴛᴘꜱ://ɢɪᴛʜᴜʙ.ᴄᴏᴍ/ᴍᴄᴍᴍᴏ-ᴅᴇᴠ/ᴍᴄᴍᴍᴏ/ʙʟᴏʙ/ᴍᴀꜱᴛᴇʀ/ꜱʀᴄ/ᴍᴀɪɴ/ʀᴇꜱᴏᴜʀᴄᴇꜱ/ʟᴏᴄᴀʟᴇ/ʟᴏᴄᴀʟᴇ_ᴇɴ_ᴜꜱ.ᴘʀᴏᴘᴇʀᴛɪᴇꜱ
