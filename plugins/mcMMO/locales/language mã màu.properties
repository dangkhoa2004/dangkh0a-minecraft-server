Acrobatics.SubSkill.Roll.Mechanics=§x§D§1§E§8§E§2ʟộɴ ᴠòɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴘʜụ ᴄʜủ độɴɢ ᴋèᴍ ᴛʜᴇᴏ ʜɪệᴜ ứɴɢ ʙị độɴɢ.\ɴᴍỗɪ ᴋʜɪ ɴʜậɴ ꜱáᴛ ᴛʜươɴɢ ʀơɪ, ʙạɴ ᴄó ᴛỉ ʟệ ᴄʜặɴ đứɴɢ ʜᴏàɴ ᴛᴏàɴ ꜱáᴛ ᴛʜươɴɢ ᴅựᴀ ᴛʀêɴ ᴄấᴘ độ ᴋỹ ɴăɴɢ. ᴛạɪ ᴄấᴘ độ §x§F§D§F§D§9§6{6}%§x§D§1§E§8§E§2 ʙạɴ ᴄó §x§F§D§F§D§9§6{0}%§x§D§1§E§8§E§2 ᴄʜặɴ ꜱáᴛ ᴛʜươɴɢ, ᴠà §x§F§D§F§D§9§6{1}%§x§D§1§E§8§E§2 ɴếᴜ ᴋíᴄʜ ʜᴏạᴛ ʟộɴ ᴠòɴɢ ʜᴏàɴ ʜảᴏ.\ɴᴛỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ ᴛỉ ʟệ ᴛʜᴜậɴ ᴠớɪ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴛʜᴇᴏ đườɴɢ ᴛʜẳɴɢ ᴄʜᴏ đếɴ ᴄấᴘ §x§F§D§F§D§9§6{2}§x§D§1§E§8§E§2 ᴛʜì ᴛốɪ đᴀ, ᴍỗɪ ᴄấᴘ ɴʜàᴏ ʟộɴ ᴛăɴɢ ᴛʜêᴍ §x§F§D§F§D§9§6{3}%§x§D§1§E§8§E§2 ᴛỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ.\ɴɢɪữ ᴘʜíᴍ ɴɢồɪ (ꜱɴᴇᴀᴋ) để ɴʜâɴ đôɪ ᴛỉ ʟệ ʟộɴ ᴠòɴɢ ᴠà ᴄʜặɴ đứɴɢ ɢấᴘ đôɪ ꜱáᴛ ᴛʜươɴɢ ʀơɪ! ɢɪữ ᴘʜíᴍ ɴɢồɪ ꜱẽ đổɪ ᴛừ ʟộɴ ᴠòɴɢ ᴛʜườɴɢ ᴛʜàɴʜ ʟộɴ ᴠòɴɢ ʜᴏàɴ ʜảᴏ.\ɴʟộɴ ᴠòɴɢ ᴛʜườɴɢ ᴄʜặɴ đếɴ §x§F§F§A§D§A§D{4}§x§D§1§E§8§E§2 ꜱáᴛ ᴛʜươɴɢ. ʟộɴ ᴠòɴɢ ʜᴏàɴ ʜảᴏ ᴄʜặɴ đếɴ §x§B§9§F§B§C§0{5}§x§D§1§E§8§E§2 ꜱáᴛ ᴛʜươɴɢ.
