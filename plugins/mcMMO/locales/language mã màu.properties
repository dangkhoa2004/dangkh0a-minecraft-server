# #ꜱᴡᴏʀᴅꜱ
Guides.Swords.Section.0=§x§8§9§C§F§F§0ᴠề ᴅùɴɢ ᴋɪếᴍ:\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ʙᴀɴ ᴛʜưởɴɢ ᴄáᴄ ᴄʜỉ ꜱố ᴄʜɪếɴ đấᴜ ᴄʜᴏ ᴀɪ ᴄʜɪếɴ đấᴜ ʙằɴɢ\ɴ§x§F§D§F§D§9§6ᴋɪếᴍ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ɴʜậɴ xᴘ ᴅựᴀ ᴛʀêɴ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ ɢâʏ ʀᴀ ʟêɴ ǫᴜáɪ ʜᴏặᴄ \ɴ§x§F§D§F§D§9§6ɴɢườɪ ᴄʜơɪ ᴋʜɪ ᴠáᴄ ᴋɪếᴍ ᴛʀêɴ ᴛᴀʏ.
Guides.Swords.Section.1=§x§8§9§C§F§F§0ɴʜáᴛ ᴄʜéᴍ ʀăɴɢ ᴄưᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ɴʜáᴛ ᴄʜéᴍ ʀăɴɢ ᴄưᴀ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴋíᴄʜ ʜᴏạᴛ ʙằɴɢ ᴄáᴄʜ\ɴ§x§F§D§F§D§9§6ᴄʟɪᴄᴋ ᴘʜảɪ ᴋʜɪ ᴄầᴍ ᴋɪếᴍ. ᴋỹ ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ đáɴʜ \ɴ§x§F§D§F§D§9§6ᴀᴏᴇ (ᴅɪệɴ ʀộɴɢ). ᴄú đáɴʜ ᴀᴏᴇ ɴàʏ ꜱẽ ɢâʏ ᴛʜêᴍ 25%\ɴ§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠà ᴄó ᴋʜả ɴăɴɢ ɢâʏ ʀáᴄʜ ᴠếᴛ ᴛʜươɴɢ (ʙʟᴇᴇᴅ).
Guides.Swords.Section.2=§x§8§9§C§F§F§0ᴘʜảɴ ᴄôɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴘʜảɴ ᴄôɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ. ᴋʜɪ ʙạɴ đỡ đòɴ ᴠà ăɴ\ɴ§x§F§D§F§D§9§6ʜɪᴛ ᴛừ ǫᴜáɪ, ʙạɴ ꜱẽ ᴄó ᴛỉ ʟệ ᴘʜảɴ ʟạɪ 50% \ɴ§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠừᴀ ɴʜậɴ.
Guides.Swords.Section.3=§x§8§9§C§F§F§0ʀáᴄʜ ᴠếᴛ ᴛʜươɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʀáᴄʜ ᴠếᴛ ᴛʜươɴɢ ᴋʜɪếɴ đốɪ ᴛʜủ ɴʜậɴ ꜱáᴛ ᴛʜươɴɢ ᴍỗɪ ʜᴀɪ ɢɪâʏ. ᴍụᴄ \ɴ§x§F§D§F§D§9§6ᴛɪêᴜ ꜱẽ ʙị ʀỉ ᴍáᴜ ᴄʜᴏ đếɴ ᴋʜɪ ʜɪệᴜ ứɴɢ ᴋếᴛ ᴛʜúᴄ, ʜᴏặᴄ ᴄʜếᴛ, \ɴ§x§F§D§F§D§9§6ᴛùʏ ᴄáɪ ɴàᴏ ᴛớɪ ᴛʀướᴄ.\ɴ§x§F§D§F§D§9§6ᴛʜờɪ ɢɪᴀɴ ʀỉ ᴍáᴜ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ ᴋỹ ɴăɴɢ ᴋɪếᴍ ᴄủᴀ ʙạɴ.
# #ᴛᴀᴍɪɴɢ
Guides.Taming.Section.0=§x§8§9§C§F§F§0ᴠề ᴛʜᴜầɴ ʜóᴀ:\ɴ§x§F§D§F§D§9§6ᴛʜᴜầɴ ʜóᴀ ᴍᴀɴɢ ʟạɪ ᴄʜᴏ ɴɢườɪ ᴄʜơɪ ɴʜɪềᴜ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜɪ ᴅắᴛ ᴛʜᴇᴏ\ɴ§x§F§D§F§D§9§6ꜱóɪ đã đượᴄ ᴛʜᴜầɴ ʜóᴀ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6Để ʟấʏ xᴘ ᴋỹ ɴăɴɢ ɴàʏ, ʙạɴ ᴄầɴ ᴛʜᴜầɴ ʜóᴀ ꜱóɪ/ᴍèᴏ ʀừɴɢ ʜᴏặᴄ\ɴ§x§F§D§F§D§9§6ᴄʜỉ ᴄầɴ ᴍᴀɴɢ ᴄʜúɴɢ ᴛʜᴇᴏ ᴛʀᴏɴɢ ɢɪᴀᴏ ᴛʀᴀɴʜ.
Guides.Taming.Section.1=§x§8§9§C§F§F§0ᴛɪếɴɢ ɢọɪ ɴơɪ ʜᴏᴀɴɢ ᴅã ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴛɪếɴɢ ɢọɪ ɴơɪ ʜᴏᴀɴɢ ᴅã ʟà ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ ɢɪúᴘ ʙạɴ ɢọɪ\ɴ§x§F§D§F§D§9§6ᴍộᴛ ᴄʜú ꜱóɪ ʜᴏặᴄ ᴍèᴏ ʀừɴɢ ᴛớɪ ʙêɴ ᴄạɴʜ. ʙạɴ ᴄó ᴛʜể ʟàᴍ ᴠɪệᴄ ɴàʏ ʙằɴɢ ᴄáᴄʜ\ɴ§x§F§D§F§D§9§6ɴɢồɪ (ꜱɴᴇᴀᴋ) + ᴄʟɪᴄᴋ ᴛʀáɪ ᴋʜɪ đᴀɴɢ ᴄầᴍ xươɴɢ ʜᴏặᴄ ᴄá.
Guides.Taming.Section.2=§x§8§9§C§F§F§0ʜɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʜɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ꜱᴏɪ ᴛʜú ᴄưɴɢ ᴠà xᴇᴍ\ɴ§x§F§D§F§D§9§6ᴄʜỉ ꜱố ᴄủᴀ ꜱóɪ ᴠà ᴍèᴏ ʀừɴɢ. ᴄʟɪᴄᴋ ᴛʀáɪ ᴠàᴏ ꜱóɪ ʜᴏặᴄ ᴍèᴏ ʀừɴɢ để ᴅùɴɢ\ɴ§x§F§D§F§D§9§6ʜɪểᴜ ʙɪếᴛ Độɴɢ ᴠậᴛ.
Guides.Taming.Section.3=§x§8§9§C§F§F§0ᴄắɴ xé ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴄắɴ xé ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ, ᴄó xáᴄ ꜱᴜấᴛ ɢâʏ ʜɪệᴜ ứɴɢ\ɴ§x§F§D§F§D§9§6ʀỉ ᴍáᴜ ʟêɴ ɴʜữɴɢ ᴋẻ địᴄʜ ʙị đàɴ ꜱóɪ ᴄủᴀ ʙạɴ ᴛấɴ ᴄôɴɢ.
Guides.Taming.Section.4=§x§8§9§C§F§F§0ᴠᴜốᴛ ꜱắᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴠᴜốᴛ ꜱắᴄ ʟàᴍ ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ ᴍà ꜱóɪ\ɴ§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ ᴄắɴ ᴠàᴏ đốɪ ᴘʜươɴɢ. ꜱáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴅựᴀ ᴠàᴏ ᴄấᴘ ᴛʜᴜầɴ ʜóᴀ ᴄủᴀ ʙạɴ.
Guides.Taming.Section.5=§x§8§9§C§F§F§0ɴʜậɴ ᴛʜứᴄ ᴍôɪ ᴛʀườɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ꜱẽ ɢɪúᴘ ꜱóɪ ᴅịᴄʜ ᴄʜᴜʏểɴ ᴠề ʙêɴ ʙạɴ ᴋʜɪ\ɴ§x§F§D§F§D§9§6ᴄʜúɴɢ ʟảɴɢ ᴠảɴɢ ǫᴜᴀɴʜ ɴơɪ ɴɢᴜʏ ʜɪểᴍ, ᴋɪểᴜ xươɴɢ ʀồɴɢ/ᴅᴜɴɢ ɴʜᴀᴍ. ɴó ᴄũɴɢ ɢɪúᴘ\ɴ§x§F§D§F§D§9§6ꜱóɪ ᴍɪễɴ ɴʜɪễᴍ ʜᴏàɴ ᴛᴏàɴ ᴠớɪ ꜱáᴛ ᴛʜươɴɢ ʀơɪ.
Guides.Taming.Section.6=§x§8§9§C§F§F§0ʟôɴɢ ᴅàʏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ɢɪảᴍ ꜱáᴛ ᴛʜươɴɢ ᴠà ʟàᴍ ᴄʜᴏ ꜱóɪ\ɴ§x§F§D§F§D§9§6ᴋʜáɴɢ ʟạɪ ʟửᴀ.
Guides.Taming.Section.7=§x§8§9§C§F§F§0ᴄʜốɴɢ ꜱốᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ꜱóɪ ɢɪảᴍ ᴛʜɪệᴛ ʜạɪ\ɴ§x§F§D§F§D§9§6ᴛừ ᴛʜᴜốᴄ ɴổ.
Guides.Taming.Section.8=§x§8§9§C§F§F§0ɢɪᴀᴏ đồ ăɴ ɴʜᴀɴʜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ꜱóɪ ᴄơ ʜộɪ đượᴄ ʜồɪ ᴍáᴜ ᴍỗɪ ᴋʜɪ\ɴ§x§F§D§F§D§9§6ᴄʜúɴɢ ᴄắɴ ᴋẻ địᴄʜ.
# #ᴜɴᴀʀᴍᴇᴅ
Guides.Unarmed.Section.0=§x§8§9§C§F§F§0ᴠề ᴛᴀʏ ᴋʜôɴɢ:\ɴ§x§F§D§F§D§9§6ᴛᴀʏ ᴋʜôɴɢ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ɴʜậɴ ᴄáᴄ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜɪ ꜱử ᴅụɴɢ\ɴ§x§F§D§F§D§9§6ɴắᴍ đấᴍ ʟàᴍ ᴠũ ᴋʜí. \ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6xᴘ ɴʜậɴ đượᴄ ᴅựᴀ ᴛʀêɴ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ đấᴍ đượᴄ ʟêɴ ǫᴜáɪ \ɴ§x§F§D§F§D§9§6ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ ᴋʜɪ ʙạɴ ᴋʜôɴɢ ᴄầᴍ ɢì ᴛʀêɴ ᴛᴀʏ.
Guides.Unarmed.Section.1=§x§8§9§C§F§F§0ᴄᴜồɴɢ ɴộ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴄᴜồɴɢ ɴộ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ đượᴄ ᴋíᴄʜ ʜᴏạᴛ ʙằɴɢ\ɴ§x§F§D§F§D§9§6ᴄʟɪᴄᴋ ᴘʜảɪ. ᴋʜɪ ở ᴛʀạɴɢ ᴛʜáɪ ᴄᴜồɴɢ ɴộ, ʙạɴ ɢâʏ ᴛʜêᴍ 50%\ɴ§x§F§D§F§D§9§6ꜱáᴛ ᴛʜươɴɢ ᴠà ᴄó ᴛʜể đấᴍ ɴáᴛ ᴄáᴄ ᴋʜốɪ ᴍềᴍ ɴɢᴀʏ ᴛứᴄ ᴋʜắᴄ, ᴋɪểᴜ ɴʜư\ɴ§x§F§D§F§D§9§6Đấᴛ ʜᴀʏ ᴄỏ.
Guides.Unarmed.Section.2=§x§8§9§C§F§F§0ᴛʜɪếᴛ ꜱᴀ ᴄʜưởɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴛʜɪếᴛ ꜱᴀ ᴄʜưởɴɢ ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ ᴋʜɪ ʙạɴ ʟấʏ ᴛᴀʏ\ɴ§x§F§D§F§D§9§6đấᴍ ǫᴜáɪ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ.
Guides.Unarmed.Section.3=§x§8§9§C§F§F§0Đẩʏ ʟùɪ ᴄᴜɴɢ ᴛêɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6Đẩʏ ʟùɪ ᴄᴜɴɢ ᴛêɴ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ\ɴ§x§F§D§F§D§9§6ɢạᴛ ᴘʜăɴɢ ᴍũɪ ᴛêɴ ᴄủᴀ ʙộ xươɴɢ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ ʙắɴ ʀᴀ.\ɴ§x§F§D§F§D§9§6ᴍũɪ ᴛêɴ ꜱẽ ʀớᴛ ʙịᴄʜ xᴜốɴɢ đấᴛ, ᴠô ʜạɪ.
Guides.Unarmed.Section.4=§x§8§9§C§F§F§0ᴛᴀʏ ᴋẹᴘ ꜱắᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴛᴀʏ ᴋẹᴘ ꜱắᴛ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ᴄʜốɴɢ ʟạɪ ᴠɪệᴄ ʙị ᴛướᴄ ᴠũ ᴋʜí. ᴄấᴘ độ\ɴ§x§F§D§F§D§9§6ᴛᴀʏ ᴋʜôɴɢ ᴄàɴɢ ᴄᴀᴏ, ᴄơ ʜộɪ ᴄʜốɴɢ ᴛướᴄ ᴠũ ᴋʜí ᴄàɴɢ ᴛăɴɢ.
Guides.Unarmed.Section.5=§x§8§9§C§F§F§0ᴛướᴄ ᴠũ ᴋʜí ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ɴɢườɪ ᴄʜơɪ ᴛướᴄ ᴠũ ᴋʜí ᴄủᴀ ɴɢườɪ ᴋʜáᴄ,\ɴ§x§F§D§F§D§9§6ʟàᴍ ᴠũ ᴋʜí ᴍụᴄ ᴛɪêᴜ đᴀɴɢ ᴄầᴍ ʙị ʀớᴛ ʀᴀ ɴɢᴏàɪ.
# #ᴡᴏᴏᴅᴄᴜᴛᴛɪɴɢ
Guides.Woodcutting.Section.0=§x§8§9§C§F§F§0ᴠề ᴄʜặᴛ ɢỗ:\ɴ§x§F§D§F§D§9§6ᴄʜặᴛ ɢỗ ɴóɪ ᴄʜᴜɴɢ ʟà đɪ đốɴ ᴄâʏ đấʏ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ɴʜậɴ xᴘ ʙấᴛ ᴄứ ᴋʜɪ ɴàᴏ ʙạɴ ᴄʜặᴛ ᴠỡ ᴍộᴛ ᴋʜốɪ ɢỗ.
Guides.Woodcutting.Section.1=§x§8§9§C§F§F§0Đốɴ ᴄâʏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6Đốɴ ᴄâʏ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴄʟɪᴄᴋ ᴘʜảɪ\ɴ§x§F§D§F§D§9§6ᴋʜɪ đᴀɴɢ ᴄầᴍ ʀìᴜ để ᴋíᴄʜ ʜᴏạᴛ. ᴋỹ ɴăɴɢ ɴàʏ\ɴ§x§F§D§F§D§9§6ᴋʜɪếɴ ᴄả ᴄáɪ ᴄâʏ ᴠỡ ᴠụɴ ɴɢᴀʏ ʟậᴘ ᴛứᴄ, ʀớᴛ ʀᴀ\ɴ§x§F§D§F§D§9§6ᴛᴏàɴ ʙộ ɢỗ ᴄủᴀ ᴄâʏ ᴛʀᴏɴɢ ᴛíᴄʜ ᴛắᴄ.
Guides.Woodcutting.Section.2=§x§8§9§C§F§F§0ᴍáʏ ᴛʜổɪ ʟá ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴍáʏ ᴛʜổɪ ʟá ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ ʟàᴍ ᴄʜᴏ\ɴ§x§F§D§F§D§9§6ʟá ᴄâʏ ɴổ ᴛᴜɴɢ ɴɢᴀʏ ʟậᴘ ᴛứᴄ ᴋʜɪ ʙạɴ ᴄʜéᴍ ʀìᴜ ᴠàᴏ. ᴍặᴄ địɴʜ,\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ᴍở ᴋʜóᴀ ở ᴄấᴘ 100.
Guides.Woodcutting.Section.3=§x§8§9§C§F§F§0ɴʜâɴ đôɪ ꜱảɴ ʟượɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ ɴʜặᴛ đượᴄ ᴍộᴛ\ɴ§x§F§D§F§D§9§6ᴋʜốɪ ɢỗ ᴅôɪ ʀᴀ ᴄʜᴏ ᴍỗɪ ᴋʜúᴄ ɢỗ ʙạɴ ᴄʜặᴛ.
# ᴄʀᴏꜱꜱʙᴏᴡꜱ
Guides.Crossbows.Section.0=§x§8§9§C§F§F§0ᴠề ʙắɴ ɴỏ:\ɴ§x§F§D§F§D§9§6ʙắɴ ɴỏ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ʙắɴ ᴋẻ ᴛʜù ʙằɴɢ ᴄʜɪếᴄ ɴỏ ᴄủᴀ ʙạɴ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ɴʜậɴ xᴘ ᴍỗɪ ᴋʜɪ ʙạɴ ʙắɴ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʙằɴɢ ɴỏ.
Guides.Crossbows.Section.1=§x§8§9§C§F§F§0ᴘʜáᴛ ʙắɴ ʙậᴛ ᴛườɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙậᴛ ᴛườɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ʙị độɴɢ, ʙạɴ ɴʜắᴍ ʙắɴ ɴỏ ở ɴʜữɴɢ ɢóᴄ ʜẹᴘ để ᴛʜựᴄ ʜɪệɴ ᴄú ʙậᴛ ᴛườɴɢ. ᴍũɪ ᴛêɴ ꜱẽ ɴảʏ ʙậᴛ ʟạɪ ᴋʜɪ ᴄʜạᴍ ᴠàᴏ ᴛườɴɢ ʜᴏặᴄ ɴềɴ ᴠà ᴄó ᴛʜể xᴜʏêɴ ᴛʀúɴɢ ᴍụᴄ ᴛɪêᴜ. ꜱố ʟượɴɢ ʟầɴ ʙậᴛ ɴảʏ ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ ʙậᴄ xếᴘ ʜạɴɢ ᴄủᴀ ᴘʜáᴛ ʙắɴ ʙậᴛ ᴛườɴɢ.
