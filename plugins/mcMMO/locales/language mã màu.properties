# #ᴀᴄʀᴏʙᴀᴛɪᴄꜱ
Guides.Acrobatics.Section.0=§x§8§9§C§F§F§0ᴠề ɴʜàᴏ ʟộɴ:\ɴ§x§F§D§F§D§9§6ɴʜàᴏ ʟộɴ ʟà ɴɢʜệ ᴛʜᴜậᴛ ᴅɪ ᴄʜᴜʏểɴ ᴜʏểɴ ᴄʜᴜʏểɴ ᴛʀᴏɴɢ ᴍᴄᴍᴍᴏ.\ɴ§x§F§D§F§D§9§6ɴó ᴍᴀɴɢ ʟạɪ ᴄáᴄ ʙᴜꜰꜰ ᴛʀᴏɴɢ ᴄʜɪếɴ đấᴜ ᴠà ʙᴜꜰꜰ ꜱáᴛ ᴛʜươɴɢ ᴍôɪ ᴛʀườɴɢ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6Để ᴄàʏ xᴘ ᴋỹ ɴăɴɢ ɴàʏ ʙạɴ ᴄầɴ ᴛʜựᴄ ʜɪệɴ ᴍộᴛ ᴄú ɴé đòɴ\ɴ§x§F§D§F§D§9§6ᴛʀᴏɴɢ ᴄʜɪếɴ đấᴜ ʜᴏặᴄ ꜱốɴɢ ꜱóᴛ ꜱᴀᴜ ᴋʜɪ ɴʜảʏ ᴛừ ᴛʀêɴ ᴄᴀᴏ xᴜốɴɢ.
Guides.Acrobatics.Section.1=§x§8§9§C§F§F§0ᴋỹ ɴăɴɢ ʟộɴ ᴠòɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ᴄʜặɴ đượᴄ ꜱáᴛ ᴛʜươɴɢ \ɴ§x§F§D§F§D§9§6ᴋʜɪ ɴɢã ᴛừ ᴛʀêɴ ᴄᴀᴏ xᴜốɴɢ. ʙạɴ ᴄó ᴛʜể ɢɪữ ɴúᴛ ɴɢồɪ (ꜱɴᴇᴀᴋ)\ɴ§x§F§D§F§D§9§6để ɴʜâɴ đôɪ ᴄơ ʜộɪ ɴé ꜱáᴛ ᴛʜươɴɢ ʟúᴄ ʀơɪ xᴜốɴɢ.\ɴ§x§F§D§F§D§9§6ʜàɴʜ độɴɢ ɴàʏ ꜱẽ ᴋíᴄʜ ʜᴏạᴛ ʟộɴ ᴠòɴɢ ʜᴏàɴ ʜảᴏ ᴛʜᴀʏ ᴠì ʟộɴ ᴠòɴɢ ᴛʜườɴɢ.\ɴ§x§F§D§F§D§9§6ʟộɴ ᴠòɴɢ ʜᴏàɴ ʜảᴏ ɢɪốɴɢ ʟộɴ ᴛʜườɴɢ ɴʜưɴɢ ᴅễ ᴋíᴄʜ ʜᴏạᴛ ʜơɴ ɢấᴘ đôɪ\ɴ§x§F§D§F§D§9§6ᴠà ᴄʜặɴ đượᴄ ɴʜɪềᴜ ꜱáᴛ ᴛʜươɴɢ ʜơɴ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ʟộɴ ᴠòɴɢ ɢắɴ ʟɪềɴ ᴠớɪ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴄủᴀ ʙạɴ
Guides.Acrobatics.Section.2=§x§8§9§C§F§F§0ɴé đòɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ɴé đòɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ɢɪảᴍ ᴍộᴛ ɴửᴀ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ\ɴ§x§F§D§F§D§9§6ᴛʀᴏɴɢ ʟúᴄ ɢɪᴀᴏ ᴛʀᴀɴʜ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ɴàʏ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ ᴋỹ ɴăɴɢ.
# #ᴀʟᴄʜᴇᴍʏ
Guides.Alchemy.Section.0=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴠề ɢɪả ᴋɪᴍ ᴛʜᴜậᴛ:\ɴ[[ʏᴇʟʟᴏᴡ]]ɢɪả ᴋɪᴍ ᴛʜᴜậᴛ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴘʜᴀ ᴛʜᴜốᴄ.\ɴ[[ʏᴇʟʟᴏᴡ]]ᴋỹ ɴăɴɢ ɴàʏ ɢɪúᴘ ᴛăɴɢ ᴛốᴄ độ ᴘʜᴀ ᴄʜế, ᴄũɴɢ ɴʜư\ɴ[[ʏᴇʟʟᴏᴡ]]ᴄʜế ʀᴀ ɴʜữɴɢ ʟᴏạɪ ᴛʜᴜốᴄ ᴍớɪ (ʙìɴʜ ᴛʜườɴɢ) ᴋʜôɴɢ ᴛʜể ᴄʜế đượᴄ.\ɴ\ɴ\ɴ[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ɴʜẬɴ xᴘ:\ɴ[[ʏᴇʟʟᴏᴡ]]Để ᴄàʏ xᴘ ᴋỹ ɴăɴɢ ɴàʏ ʙạɴ ᴘʜảɪ đɪ ᴘʜᴀ ᴛʜᴜốᴄ.
Guides.Alchemy.Section.1=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴛíɴʜ ɴăɴɢ xúᴄ ᴛáᴄ ʟà ꜱᴀᴏ?\ɴ[[ʏᴇʟʟᴏᴡ]]xúᴄ ᴛáᴄ ʟàᴍ ᴛăɴɢ ᴛốᴄ độ ᴘʜᴀ ᴛʜᴜốᴄ, ᴠớɪ\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛốᴄ độ ᴛốɪ đᴀ ʟà x4 ở ᴄấᴘ 1000.\ɴ[[ʏᴇʟʟᴏᴡ]]ᴋỹ ɴăɴɢ ɴàʏ ᴛự ᴍở ᴋʜóᴀ ở ᴄấᴘ 100 ᴛʜᴇᴏ ᴍặᴄ địɴʜ.
Guides.Alchemy.Section.2=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ ʟà ꜱᴀᴏ?\ɴ[[ʏᴇʟʟᴏᴡ]]ᴄʜᴏ ᴘʜéᴘ ᴅùɴɢ ᴄáᴄ ɴɢᴜʏêɴ ʟɪệᴜ ʟạ để ᴘʜᴀ ᴛʜᴜốᴄ.\ɴ[[ʏᴇʟʟᴏᴡ]]ɴɢᴜʏêɴ ʟɪệᴜ ʟạ ɴàᴏ đượᴄ ᴅùɴɢ ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ\ɴ[[ʏᴇʟʟᴏᴡ]]ʜạɴɢ ᴄủᴀ ʙạɴ. ᴄó 8 ᴛʜứ ʜạɴɢ để ᴍở ᴋʜóᴀ.
Guides.Alchemy.Section.3=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 1:\ɴ[[ʏᴇʟʟᴏᴡ]]ʙộᴛ ǫᴜỷ ʟửᴀ, ᴍắᴛ ɴʜệɴ ʟêɴ ᴍᴇɴ, ɴướᴄ ᴍắᴛ ɢʜᴀꜱᴛ, ʀᴇᴅꜱᴛᴏɴᴇ,\ɴ[[ʏᴇʟʟᴏᴡ]]ʙộᴛ đá ᴘʜáᴛ ꜱáɴɢ, Đườɴɢ, ᴅưᴀ ʜấᴜ ʟấᴘ ʟáɴʜ, ᴄà ʀốᴛ ᴠàɴɢ,\ɴ[[ʏᴇʟʟᴏᴡ]]ᴋᴇᴍ ᴅᴜɴɢ ɴʜᴀᴍ, ʙướᴜ ɴᴇᴛʜᴇʀ, ᴍắᴛ ɴʜệɴ, ᴛʜᴜốᴄ ꜱúɴɢ, ᴄʜâɴ ᴛʜỏ,\ɴ[[ʏᴇʟʟᴏᴡ]]ᴄá ɴóᴄ\ɴ[[ʏᴇʟʟᴏᴡ]](ᴛʜᴜốᴄ ᴍặᴄ địɴʜ ᴍɪɴᴇᴄʀᴀꜰᴛ)
Guides.Alchemy.Section.4=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 2:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴄà ʀốᴛ (ᴛʜᴜốᴄ Đàᴏ ɴʜᴀɴʜ)\ɴ[[ʏᴇʟʟᴏᴡ]]ʙóɴɢ ᴄʜấᴛ ɴʜờɴ (ᴛʜᴜốᴄ Đàᴏ ᴄʜậᴍ)\ɴ\ɴ[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 3:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛʜạᴄʜ ᴀɴʜ (ᴛʜᴜốᴄ ʜấᴘ ᴛʜụ)\ɴ[[ʏᴇʟʟᴏᴡ]]
Guides.Alchemy.Section.5=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 4:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛáᴏ (ᴛʜᴜốᴄ ᴛăɴɢ ᴍáᴜ ᴛốɪ đᴀ)\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛʜịᴛ ᴛʜốɪ (ᴛʜᴜốᴄ ɢâʏ Đóɪ)\ɴ\ɴ[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 5:\ɴ[[ʏᴇʟʟᴏᴡ]]ɴấᴍ ɴâᴜ (ᴛʜᴜốᴄ ɢâʏ ʙᴜồɴ ɴôɴ)\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛúɪ ᴍựᴄ (ᴛʜᴜốᴄ ɢâʏ ᴍù)
Guides.Alchemy.Section.6=[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 6:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴅươɴɢ xỉ (ᴛʜᴜốᴄ ɴᴏ ʙụɴɢ)\ɴ\ɴ[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 7:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴋʜᴏᴀɪ ᴛâʏ độᴄ (ᴛʜᴜốᴄ ᴘʜâɴ ʜủʏ)\ɴ\ɴ[[ᴅᴀʀᴋ_ᴀǫᴜᴀ]]ᴘʜᴀ ᴄʜế Đặᴄ ʙɪệᴛ - ɴɢᴜʏêɴ ʟɪệᴜ ʜạɴɢ 8:\ɴ[[ʏᴇʟʟᴏᴡ]]ᴛáᴏ ᴠàɴɢ ᴛʜườɴɢ (ᴛʜᴜốᴄ ᴋʜáɴɢ ꜱáᴛ ᴛʜươɴɢ)

# #ᴀʀᴄʜᴇʀʏ
Guides.Archery.Section.0=§x§8§9§C§F§F§0ᴠề ʙắɴ ᴄᴜɴɢ:\ɴ§x§F§D§F§D§9§6ʙắɴ ᴄᴜɴɢ ᴛậᴘ ᴛʀᴜɴɢ ᴠàᴏ ᴠɪệᴄ ʙắɴ ʙằɴɢ ᴄᴜɴɢ ᴛêɴ.\ɴ§x§F§D§F§D§9§6ᴄᴜɴɢ ᴄấᴘ ɴʜɪềᴜ ʙᴜꜰꜰ ᴄʜɪếɴ đấᴜ ᴋʜáᴄ ɴʜᴀᴜ, ᴄʜẳɴɢ ʜạɴ ɴʜư ᴛăɴɢ ꜱáᴛ ᴛʜươɴɢ\ɴ§x§F§D§F§D§9§6ᴛʜᴇᴏ ᴄấᴘ độ ᴋỹ ɴăɴɢ ᴠà ᴋʜả ɴăɴɢ ʟàᴍ ᴄʜᴏáɴɢ\ɴ§x§F§D§F§D§9§6đốɪ ᴛʜủ ᴛʀᴏɴɢ ᴘᴠᴘ. ᴛʜêᴍ ᴠàᴏ đó, ʙạɴ ᴄó ᴛʜể ɴʜặᴛ ʟạɪ\ɴ§x§F§D§F§D§9§6ᴘʜầɴ ɴàᴏ ꜱố ᴍũɪ ᴛêɴ đã ʙắɴ ʀᴀ ᴛừ ᴄáɪ xáᴄ ᴄủᴀ ᴋẻ địᴄʜ.\ɴ\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ʙắɴ ᴛʀúɴɢ ǫᴜáɪ ᴠậᴛ ʜᴏặᴄ\ɴ§x§F§D§F§D§9§6ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ.
Guides.Archery.Section.1=§x§8§9§C§F§F§0ʙắɴ ᴄʜᴜẩɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙắɴ ᴄʜᴜẩɴ ᴄộɴɢ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ ᴄʜᴏ ᴍỗɪ ᴘʜáᴛ ʙắɴ.\ɴ§x§F§D§F§D§9§6ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ ᴛừ ʙắɴ ᴄʜᴜẩɴ ᴛăɴɢ ʟêɴ ᴋʜɪ ʙạɴ\ɴ§x§F§D§F§D§9§6ʟêɴ ᴄấᴘ ʙắɴ ᴄᴜɴɢ.\ɴ§x§F§D§F§D§9§6ᴛʜᴇᴏ ᴍặᴄ địɴʜ, ꜱáᴛ ᴛʜươɴɢ ᴛừ ᴄᴜɴɢ ꜱẽ ᴛăɴɢ 10%\ɴ§x§F§D§F§D§9§6ᴍỗɪ 50 ᴄấᴘ, ᴛốɪ đᴀ ʟà ᴄộɴɢ 200% ꜱáᴛ ᴛʜươɴɢ.
Guides.Archery.Section.2=§x§8§9§C§F§F§0ɢâʏ ᴄʜᴏáɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟàᴍ đốɪ ᴛʜủ ʙị ᴄʜᴏáɴɢ ᴋʜɪ\ɴ§x§F§D§F§D§9§6ʙắɴ ᴛʀúɴɢ ʜọ. ɴếᴜ ʙị ᴄʜᴏáɴɢ, ᴍàɴ ʜìɴʜ đốɪ ᴛʜủ ꜱẽ ʙị éᴘ\ɴ§x§F§D§F§D§9§6ɴʜìɴ ᴛʜẳɴɢ ʟêɴ ᴛʀờɪ ᴛʀᴏɴɢ ɢɪâʏ ʟáᴛ.\ɴ§x§F§D§F§D§9§6ᴘʜáᴛ ʙắɴ ɢâʏ ᴄʜᴏáɴɢ ᴄũɴɢ ᴄộɴɢ ᴛʜêᴍ 4 ꜱáᴛ ᴛʜươɴɢ (2 ᴛɪᴍ).
Guides.Archery.Section.3=§x§8§9§C§F§F§0ᴛʜᴜ ʜồɪ ᴍũɪ ᴛêɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟấʏ ʟạɪ đượᴄ ᴍộᴛ ꜱố ᴍũɪ ᴛêɴ\ɴ§x§F§D§F§D§9§6ꜱᴀᴜ ᴋʜɪ ɢɪếᴛ ᴍộᴛ ᴄᴏɴ ǫᴜáɪ ʙằɴɢ ᴄᴜɴɢ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ɴàʏ ᴛăɴɢ ʟêɴ ᴛʜᴇᴏ ᴄấᴘ độ ʙắɴ ᴄᴜɴɢ.\ɴ§x§F§D§F§D§9§6ᴛʜᴇᴏ ᴍặᴄ địɴʜ, ᴋỹ ɴăɴɢ ɴàʏ ᴛăɴɢ 0.1% ᴍỗɪ ᴄấᴘ, ʟêɴ ᴛốɪ đᴀ 100%\ɴ§x§F§D§F§D§9§6ở ᴄấᴘ 1000.
# #ᴀxᴇꜱ
Guides.Axes.Section.0=§x§8§9§C§F§F§0ᴠề ʀìᴜ:\ɴ§x§F§D§F§D§9§6ᴠớɪ ᴋỹ ɴăɴɢ ʀìᴜ, ʙạɴ ᴄó ᴛʜể ᴅùɴɢ ʀìᴜ ʟàᴍ ɴʜɪềᴜ ᴛʀò ʜơɴ\ɴ§x§F§D§F§D§9§6ʟà ᴄʜỉ ʙɪếᴛ đɪ đốɴ ʀừɴɢ! ʙạɴ ᴄó ᴛʜể ᴄʜặᴛ ᴠà ᴄʜéᴍ ǫᴜáɪ\ɴ§x§F§D§F§D§9§6ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ để ᴄàʏ xᴘ, đáɴʜ ǫᴜáɪ ᴠớɪ ʜɪệᴜ ứɴɢ\ɴ§x§F§D§F§D§9§6đẩʏ ʟùɪ ᴠà ɢâʏ ʀᴀ ɴʜữɴɢ đòɴ ᴄʜí ᴍạɴɢ ᴄʜẾᴛ ɴɢƯỜɪ.\ɴ§x§F§D§F§D§9§6ᴄʜɪếᴄ ʀìᴜ ᴄủᴀ ʙạɴ ᴄũɴɢ ʙɪếɴ ᴛʜàɴʜ ᴍáʏ ɴɢʜɪềɴ ɢỗ ᴄầᴍ ᴛᴀʏ,\ɴ§x§F§D§F§D§9§6ᴘʜá ʜủʏ ɢɪáᴘ đốɪ ᴛʜủ ᴄựᴄ ᴅễ ᴋʜɪ ʙạɴ ở ᴄấᴘ độ ᴄᴀᴏ.\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6Để ᴄàʏ xᴘ ʙạɴ ᴄầɴ ᴄʜéᴍ ǫᴜáɪ ʜᴏặᴄ ɴɢườɪ ᴄʜơɪ ᴋʜáᴄ\ɴ§x§F§D§F§D§9§6ʙằɴɢ ʀìᴜ.
Guides.Axes.Section.1=§x§8§9§C§F§F§0ʙổ ᴄủɪ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ɢɪúᴘ ʙạɴ đáɴʜ ᴀᴏᴇ (ꜱáᴛ ᴛʜươɴɢ ᴅɪệɴ ʀộɴɢ).\ɴ§x§F§D§F§D§9§6ᴄú đáɴʜ ᴀᴏᴇ ɴàʏ ꜱẽ ɢâʏ ʀᴀ ʟượɴɢ ꜱáᴛ ᴛʜươɴɢ ʙằɴɢ ᴍộᴛ ɴửᴀ ꜱᴏ ᴠớɪ\ɴ§x§F§D§F§D§9§6ᴍụᴄ ᴛɪêᴜ ᴄʜíɴʜ, ʀấᴛ ʜợᴘ để ᴅọɴ ᴅẹᴘ ʙầʏ ǫᴜáɪ ʟớɴ.
Guides.Axes.Section.2=§x§8§9§C§F§F§0ᴄʜí ᴍạɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴄʜí ᴍạɴɢ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ ɢɪúᴘ ɴɢườɪ ᴄʜơɪ ᴄó\ɴ§x§F§D§F§D§9§6ᴄơ ʜộɪ ɢâʏ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ.\ɴ§x§F§D§F§D§9§6ᴛʜᴇᴏ ᴍặᴄ địɴʜ, ᴄứ 2 ᴄấᴘ ᴋỹ ɴăɴɢ ʀìᴜ ꜱẽ ᴄʜᴏ\ɴ§x§F§D§F§D§9§60.1% ᴛỉ ʟệ ɴổ ᴄʜí ᴍạɴɢ, ꜱáᴛ ᴛʜươɴɢ x2.0 \ɴ§x§F§D§F§D§9§6ʟêɴ ǫᴜáɪ ʜᴏặᴄ x1.5 ʟêɴ ɴɢườɪ ᴄʜơɪ.
Guides.Axes.Section.3=§x§8§9§C§F§F§0ʙậᴄ ᴛʜầʏ ᴅùɴɢ ʀìᴜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙậᴄ ᴛʜầʏ ᴅùɴɢ ʀìᴜ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ ᴛự ᴄộɴɢ ᴛʜêᴍ ꜱáᴛ ᴛʜươɴɢ\ɴ§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ᴅùɴɢ ʀìᴜ.\ɴ§x§F§D§F§D§9§6ᴍặᴄ địɴʜ, ꜱáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴛăɴɢ 1 đɪểᴍ ᴍỗɪ 50 ᴄấᴘ,\ɴ§x§F§D§F§D§9§6ᴛốɪ đᴀ ʟà 4 ꜱáᴛ ᴛʜươɴɢ ở ᴄấᴘ 200.
Guides.Axes.Section.4=§x§8§9§C§F§F§0xᴜʏêɴ ɢɪáᴘ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴄʜéᴍ ᴠớɪ ʟựᴄ đủ ᴍạɴʜ để đậᴘ ɴáᴛ ɢɪáᴘ!\ɴ§x§F§D§F§D§9§6xᴜʏêɴ ɢɪáᴘ ᴄó ᴛỉ ʟệ ʙị độɴɢ ʟàᴍ ʜỏɴɢ\ɴ§x§F§D§F§D§9§6áᴏ ɢɪáᴘ đốɪ ᴛʜủ. ꜱáᴛ ᴛʜươɴɢ ɢɪáᴘ ꜱẽ ᴛăɴɢ ᴛʜᴇᴏ ᴄấᴘ ᴅùɴɢ ʀìᴜ.
Guides.Axes.Section.5=§x§8§9§C§F§F§0ᴄôɴɢ ᴘʜá ᴍạɴʜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙạɴ ᴄó ᴛỉ ʟệ ʙị độɴɢ ᴛᴜɴɢ ʀᴀ ᴍộᴛ ᴄú đáɴʜ ᴄựᴄ ᴍạɴʜ\ɴ§x§F§D§F§D§9§6ᴋʜɪ ᴄʜéᴍ ǫᴜáɪ ʜᴀʏ ɴɢườɪ ʙằɴɢ ʀìᴜ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ᴍặᴄ địɴʜ ʟà 25%. ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢâʏ ʀᴀ ʜɪệᴜ ứɴɢ\ɴ§x§F§D§F§D§9§6đẩʏ ʟùɪ ᴄựᴄ ɢắᴛ, ᴛựᴀ ɴʜư ʙùᴀ ᴋɴᴏᴄᴋʙᴀᴄᴋ ɪɪ\ɴ§x§F§D§F§D§9§6ᴛʜêᴍ ᴠàᴏ đó, ɴó ᴄòɴ ɢâʏ ꜱáᴛ ᴛʜươɴɢ ᴄộɴɢ ᴛʜêᴍ ᴄʜᴏ ᴍụᴄ ᴛɪêᴜ.
# #ᴇxᴄᴀᴠᴀᴛɪᴏɴ
Guides.Excavation.Section.0=§x§8§9§C§F§F§0ᴠề Đàᴏ đấᴛ:\ɴ§x§F§D§F§D§9§6Đàᴏ đấᴛ ʟà ʜàɴʜ độɴɢ xúᴄ đấᴛ ʟêɴ để ᴋɪếᴍ ᴋʜᴏ ʙáᴜ.\ɴ§x§F§D§F§D§9§6ᴄàɴɢ đàᴏ ɴʜɪềᴜ đấᴛ ʙạɴ ᴄàɴɢ ʀᴀ đồ xịɴ.\ɴ§x§F§D§F§D§9§6Đàᴏ ᴄàɴɢ ʟâᴜ ᴋʜᴏ ʙáᴜ ʀᴀ ᴄàɴɢ ᴋʜủɴɢ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ᴄầᴍ xẻɴɢ ᴛʀêɴ ᴛᴀʏ ᴠà đɪ đàᴏ đấᴛ.\ɴ§x§F§D§F§D§9§6ᴄʜỉ ᴍộᴛ ꜱố ʟᴏạɪ ᴋʜốɪ ᴍớɪ ʀớᴛ đồ ᴠà ᴄʜᴏ xᴘ.
Guides.Excavation.Section.1=§x§8§9§C§F§F§0ᴄáᴄ ᴋʜốɪ ʜợᴘ ʟệ:\ɴ§x§F§D§F§D§9§6ᴄỏ, Đấᴛ, ᴄáᴛ, Đấᴛ ꜱéᴛ, ꜱỏɪ, ʀễ ɴấᴍ, ᴄáᴛ ʟɪɴʜ ʜồɴ, ᴛᴜʏếᴛ
Guides.Excavation.Section.2=§x§8§9§C§F§F§0ᴄáᴄʜ ᴅùɴɢ ꜱɪêᴜ ᴍáʏ ᴋʜᴏᴀɴ:\ɴ§x§F§D§F§D§9§6ᴄầᴍ xẻɴɢ ᴛʀêɴ ᴛᴀʏ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴄʜᴜẩɴ ʙị đồ ɴɢʜề.\ɴ§x§F§D§F§D§9§6ʟúᴄ ɴàʏ ʙạɴ ᴄó ᴋʜᴏảɴɢ 4 ɢɪâʏ để xúᴄ ᴠàᴏ\ɴ§x§F§D§F§D§9§6ᴄáᴄ ʟᴏạɪ ᴋʜốɪ Đàᴏ đấᴛ ʜợᴘ ʟệ, ᴛừ đó ꜱẽ\ɴ§x§F§D§F§D§9§6ᴋíᴄʜ ʜᴏạᴛ ꜱɪêᴜ ᴍáʏ ᴋʜᴏᴀɴ.
Guides.Excavation.Section.3=§x§8§9§C§F§F§0ꜱɪêᴜ ᴍáʏ ᴋʜᴏᴀɴ ʟà ɢì?\ɴ§x§F§D§F§D§9§6ꜱɪêᴜ ᴍáʏ ᴋʜᴏᴀɴ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ\ɴ§x§F§D§F§D§9§6ɢắɴ ʟɪềɴ ᴠớɪ Đàᴏ đấᴛ. ɴó x3 ᴄơ ʜộɪ\ɴ§x§F§D§F§D§9§6ᴛìᴍ ᴛʜấʏ ᴋʜᴏ ʙáᴜ ᴠà ᴄʜᴏ ᴘʜéᴘ ʙạɴ Đàᴏ ᴛứᴄ ᴛʜì\ɴ§x§F§D§F§D§9§6(ɪɴꜱᴛᴀɴᴛ ʙʀᴇᴀᴋ) ᴄáᴄ ᴋʜốɪ ʜợᴘ ʟệ.
Guides.Excavation.Section.4=§x§8§9§C§F§F§0ᴋʜảᴏ ᴄổ ʜọᴄ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴍỗɪ ʟᴏạɪ ᴋʜᴏ ʙáᴜ ʀớᴛ ʀᴀ ᴛừ Đàᴏ đấᴛ đềᴜ ᴄó ᴍứᴄ ʏêᴜ ᴄầᴜ\ɴ§x§F§D§F§D§9§6ᴄấᴘ độ ᴋỹ ɴăɴɢ ʀɪêɴɢ, ᴠì ᴛʜế ʀấᴛ ᴋʜó\ɴ§x§F§D§F§D§9§6để ɴóɪ ᴄʜíɴʜ xáᴄ ɴó ɢɪúᴘ đượᴄ ʙạɴ ʙᴀᴏ ɴʜɪêᴜ.\ɴ§x§F§D§F§D§9§6ᴄʜỉ ᴄầɴ ɴʜớ ʟà ᴋỹ ɴăɴɢ Đàᴏ đấᴛ ᴄàɴɢ ᴄᴀᴏ\ɴ§x§F§D§F§D§9§6ᴛʜì ᴋʜᴏ ʙáᴜ ʙạɴ đàᴏ đượᴄ ᴄàɴɢ ɴʜɪềᴜ.\ɴ§x§F§D§F§D§9§6ᴠà ᴄũɴɢ ɴêɴ ɴʜớ ʟà ᴍỗɪ ʟᴏạɪ ᴋʜốɪ ʜợᴘ ʟệ để đàᴏ\ɴ§x§F§D§F§D§9§6đềᴜ ᴄʜứᴀ ɴʜữɴɢ ᴘʜầɴ ᴛʜưởɴɢ ᴋʜᴏ ʙáᴜ ʀɪêɴɢ ʙɪệᴛ.\ɴ§x§F§D§F§D§9§6ɴóɪ ᴄáᴄʜ ᴋʜáᴄ đàᴏ Đấᴛ ʀớᴛ đồ ᴋʜáᴄ\ɴ§x§F§D§F§D§9§6ᴠớɪ đàᴏ ꜱỏɪ.
Guides.Excavation.Section.5=§x§8§9§C§F§F§0ʟưᴜ ý ᴠề Đàᴏ đấᴛ:\ɴ§x§F§D§F§D§9§6Đồ ʀớᴛ ʀᴀ ᴋʜɪ đàᴏ đấᴛ ᴄó ᴛʜể ᴛùʏ ᴄʜỉɴʜ ʜᴏàɴ ᴛᴏàɴ\ɴ§x§F§D§F§D§9§6ɴêɴ đồ ꜱẽ ᴋʜáᴄ ɴʜᴀᴜ ᴛùʏ ᴛʜᴇᴏ ᴛừɴɢ ꜱᴇʀᴠᴇʀ.
# #ꜰɪꜱʜɪɴɢ
Guides.Fishing.Section.0=§x§8§9§C§F§F§0ᴠề ᴄâᴜ ᴄá:\ɴ§x§F§D§F§D§9§6ᴠớɪ ᴋỹ ɴăɴɢ ᴄâᴜ ᴄá, ᴠɪệᴄ ᴄâᴜ ᴄá ʟạɪ ᴛʀở ɴêɴ ᴛʜú ᴠị!\ɴ§x§F§D§F§D§9§6ᴄâᴜ ᴋʜᴏ ʙáᴜ ʙí ᴍậᴛ, ᴠà ɢɪậᴛ đồ ᴛừ ʙọɴ ǫᴜáɪ ᴠậᴛ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6Đɪ ᴄâᴜ ᴄá.
Guides.Fishing.Section.1=§x§8§9§C§F§F§0ᴛʜợ ꜱăɴ ᴋʜᴏ ʙáᴜ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴄâᴜ ʟêɴ ᴋʜᴏ ʙáᴜ\ɴ§x§F§D§F§D§9§6ᴠớɪ ᴛỉ ʟệ ɴʜỏ ᴄâᴜ đượᴄ đồ ᴄó ʙùᴀ ᴘʜéᴘ.\ɴ§x§F§D§F§D§9§6ᴍọɪ ʟᴏạɪ ᴋʜᴏ ʙáᴜ ᴄâᴜ ᴄá đềᴜ ᴄó ᴄơ ʜộɪ\ɴ§x§F§D§F§D§9§6ʀớᴛ ʀᴀ ở ᴍọɪ ᴄấᴘ độ. ᴅù ᴠậʏ ɴó ᴘʜụ ᴛʜᴜộᴄ\ɴ§x§F§D§F§D§9§6ᴠàᴏ độ ʜɪếᴍ ᴄủᴀ ᴍóɴ đồ ᴍà ᴛầɴ ꜱᴜấᴛ ʀớᴛ ᴋʜáᴄ ɴʜᴀᴜ.\ɴ§x§F§D§F§D§9§6ᴄấᴘ độ ᴄâᴜ ᴄá ᴄủᴀ ʙạɴ ᴄàɴɢ ᴄᴀᴏ, ᴄơ ʜộɪ\ɴ§x§F§D§F§D§9§6ᴛìᴍ đượᴄ ᴋʜᴏ ʙáᴜ xịɴ ᴄàɴɢ ʟớɴ.
Guides.Fishing.Section.2=§x§8§9§C§F§F§0ᴄâᴜ ᴄá ᴛʀêɴ ʙăɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ đɪ ᴄâᴜ ở ᴄáᴄ ʜồ đóɴɢ ʙăɴɢ!\ɴ§x§F§D§F§D§9§6ᴘʜóɴɢ ᴍồɪ ᴄâᴜ xᴜốɴɢ ᴍặᴛ ʜồ đóɴɢ ʙăɴɢ ᴠà ᴋỹ ɴăɴɢ ɴàʏ ꜱẽ\ɴ§x§F§D§F§D§9§6ᴛự đụᴄ ᴍộᴛ ʟỗ ɴʜỏ ᴛʀêɴ ʙăɴɢ để ʙạɴ ᴄâᴜ.
Guides.Fishing.Section.3=§x§8§9§C§F§F§0ᴄʜᴜʏêɴ ɢɪᴀ ᴄâᴜ ᴄá ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ʟàᴍ ᴄá ᴄắɴ ᴄâᴜ ɴʜᴀɴʜ ʜơɴ.\ɴ§x§F§D§F§D§9§6ᴋʜɪ đã ᴍở ᴋʜóᴀ, ɴếᴜ ʙạɴ ɴɢồɪ ᴛʀêɴ ᴛʜᴜʏềɴ ᴍà ᴄâᴜ\ɴ§x§F§D§F§D§9§6ᴛʜì ᴛỉ ʟệ ᴄâᴜ ᴛʀúɴɢ ᴄá ꜱẽ ᴄᴀᴏ ʜơɴ.
Guides.Fishing.Section.4=§x§8§9§C§F§F§0ɢɪậᴛ đồ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴍóᴄ ᴍồɪ ᴄâᴜ\ɴ§x§F§D§F§D§9§6ᴠàᴏ ǫᴜáɪ ᴠậᴛ để ɢɪậᴛ đồ ʀơɪ ʀᴀ.\ɴ§x§F§D§F§D§9§6ǫᴜáɪ ꜱẽ ʀớᴛ ʀᴀ ᴍóɴ đồ ᴍà ᴄʜúɴɢ ᴛʜườɴɢ ʀớᴛ ᴋʜɪ ʙị ɢɪếᴛ ᴄʜếᴛ.\ɴ§x§F§D§F§D§9§6ᴛʜậᴍ ᴄʜí ʙạɴ ᴄòɴ ᴄó ᴛʜể ɢɪậᴛ đượᴄ ꜱọ ǫᴜáɪ (ꜱᴋᴜʟʟ),\ɴ§x§F§D§F§D§9§6ᴛʜứ ᴍà ʙìɴʜ ᴛʜườɴɢ ᴋʜôɴɢ ᴛʜể ᴄó đượᴄ ở ᴄʜế độ ꜱɪɴʜ ᴛồɴ.
Guides.Fishing.Section.5=§x§8§9§C§F§F§0ᴄʜế độ ăɴ ᴄủᴀ ɴɢư ᴅâɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴛăɴɢ ʟượɴɢ ᴛʜứᴄ ăɴ đượᴄ ʜồɪ ʟạɪ\ɴ§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ăɴ ᴄá.
Guides.Fishing.Section.6=§x§8§9§C§F§F§0ʟưᴜ ý ᴠề ᴄâᴜ ᴄá:\ɴ§x§F§D§F§D§9§6Đồ ʀớᴛ ʀᴀ ᴋʜɪ ᴄâᴜ ᴄá ᴄó ᴛʜể ᴛùʏ ᴄʜỉɴʜ ʜᴏàɴ ᴛᴏàɴ,\ɴ§x§F§D§F§D§9§6ɴêɴ đồ ꜱẽ ᴋʜáᴄ ɴʜᴀᴜ ᴛùʏ ᴛʜᴇᴏ ᴛừɴɢ ꜱᴇʀᴠᴇʀ.
# #ʜᴇʀʙᴀʟɪꜱᴍ
Guides.Herbalism.Section.0=§x§8§9§C§F§F§0ᴠề ᴛʀồɴɢ ᴛʀọᴛ:\ɴ§x§F§D§F§D§9§6ᴛʀồɴɢ ᴛʀọᴛ xᴏᴀʏ ǫᴜᴀɴʜ ᴠɪệᴄ ᴛʜᴜ ᴛʜậᴘ ᴛʜảᴏ ᴅượᴄ ᴠà ᴄâʏ ᴄốɪ.\ɴ\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ᴛʜᴜ ᴛʜậᴘ ᴄâʏ ᴄốɪ ᴠà ᴛʜảᴏ ᴍộᴄ.
Guides.Herbalism.Section.1=§x§8§9§C§F§F§0ᴄáᴄ ᴋʜốɪ ʜợᴘ ʟệ\ɴ§x§F§D§F§D§9§6ʟúᴀ ᴍì, ᴋʜᴏᴀɪ ᴛâʏ, ᴄà ʀốᴛ, ᴅưᴀ ʜấᴜ, \ɴ§x§F§D§F§D§9§6ʙí ɴɢô, ᴍíᴀ, ʜạᴛ ᴄᴀ ᴄᴀᴏ, ʜᴏᴀ, xươɴɢ ʀồɴɢ, ɴấᴍ,\ɴ§x§F§D§F§D§9§6ʙướᴜ ɴᴇᴛʜᴇʀ, ʟá ꜱúɴɢ, ᴠà ᴅâʏ ʟᴇᴏ.
Guides.Herbalism.Section.2=§x§8§9§C§F§F§0ᴍầᴍ ꜱốɴɢ (ɢʀᴇᴇɴ ᴛᴇʀʀᴀ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴍầᴍ ꜱốɴɢ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ, ʙạɴ ᴄó ᴛʜể ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ\ɴ§x§F§D§F§D§9§6ᴋʜɪ đᴀɴɢ ᴄầᴍ ᴄᴜốᴄ để ᴋíᴄʜ ʜᴏạᴛ ᴍầᴍ ꜱốɴɢ.\ɴ§x§F§D§F§D§9§6ᴍầᴍ ꜱốɴɢ ᴄʜᴏ ʙạɴ ᴛỉ ʟệ ɴʜặᴛ x3 ꜱảɴ ʟượɴɢ ᴋʜɪ\ɴ§x§F§D§F§D§9§6ᴛʜᴜ ʜᴏạᴄʜ ᴄâʏ ᴛʀồɴɢ. ɴó ᴄòɴ ᴄʜᴏ ʙạɴ ǫᴜʏềɴ\ɴ§x§F§D§F§D§9§6ᴛʀᴜʏềɴ ᴍầᴍ ꜱốɴɢ ᴠàᴏ ᴄáᴄ ᴋʜốɪ để ᴛʜᴀʏ đổɪ ᴄʜúɴɢ ʙằɴɢ\ɴ§x§F§D§F§D§9§6ʜạᴛ ɢɪốɴɢ ᴄó ᴛʀᴏɴɢ ᴋʜᴏ đồ.
Guides.Herbalism.Section.3=§x§8§9§C§F§F§0ʙàɴ ᴛᴀʏ xᴀɴʜ (ᴄâʏ ᴛʀồɴɢ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ꜱẽ ᴛự độɴɢ ɢɪᴇᴏ ʟạɪ ʜạᴛ ɢɪốɴɢ\ɴ§x§F§D§F§D§9§6ᴋʜɪ ʙạɴ ᴛʜᴜ ʜᴏạᴄʜ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ᴛʜàɴʜ ᴄôɴɢ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ ᴛʀồɴɢ ᴛʀọᴛ.
Guides.Herbalism.Section.4=§x§8§9§C§F§F§0ʙàɴ ᴛᴀʏ xᴀɴʜ (Đá ᴄᴜộɪ/ɢạᴄʜ đá/Đấᴛ) ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ᴄʜủ độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ʜô ʙɪếɴ ᴄáᴄ ᴋʜốɪ ɴàʏ ᴛʜàɴʜ\ɴ§x§F§D§F§D§9§6ɴʜữɴɢ ᴋʜốɪ "ᴄó ʟɪêɴ ǫᴜᴀɴ ᴛớɪ ᴛʜựᴄ ᴠậᴛ". ʙạɴ ᴄó ᴛʜể ʟàᴍ ᴠậʏ ʙằɴɢ ᴄáᴄʜ ᴄʟɪᴄᴋ ᴘʜảɪ\ɴ§x§F§D§F§D§9§6ᴠàᴏ ᴍộᴛ ᴋʜốɪ, đồɴɢ ᴛʜờɪ ᴄầᴍ ʜạᴛ ɢɪốɴɢ. ᴄáᴄʜ ɴàʏ ꜱẽ ᴛốɴ 1 ʜạᴛ ɢɪốɴɢ.
Guides.Herbalism.Section.5=§x§8§9§C§F§F§0ᴄʜế độ ăɴ ᴄủᴀ ɴôɴɢ ᴅâɴ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴛăɴɢ ʟượɴɢ ᴛʜứᴄ ăɴ ʜồɪ ʟạɪ \ɴ§x§F§D§F§D§9§6ᴋʜɪ ăɴ ʙáɴʜ ᴍì, ʙáɴʜ ǫᴜʏ, ᴅưᴀ ʜấᴜ, ꜱúᴘ ɴấᴍ, ᴄà ʀốᴛ,\ɴ§x§F§D§F§D§9§6ᴠà ᴋʜᴏᴀɪ ᴛâʏ.
Guides.Herbalism.Section.6=§x§8§9§C§F§F§0ᴍᴀʏ ᴍắɴ ᴄủᴀ ʜʏʟɪᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ʙạɴ ᴄơ ʜộɪ ᴛìᴍ ᴛʜấʏ ᴠậᴛ ᴘʜẩᴍ ǫᴜý\ɴ§x§F§D§F§D§9§6ᴋʜɪ ᴄʜéᴍ ᴠỡ ᴍộᴛ ꜱố ʟᴏạɪ ᴋʜốɪ ʙằɴɢ ᴋɪếᴍ.
Guides.Herbalism.Section.7=§x§8§9§C§F§F§0ɴʜâɴ đôɪ ꜱảɴ ʟượɴɢ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ɢɪúᴘ ʙạɴ ᴄó ᴛʜêᴍ ꜱảɴ ʟượɴɢ\ɴ§x§F§D§F§D§9§6ᴋʜɪ ᴛʜᴜ ʜᴏạᴄʜ ᴍùᴀ ᴍàɴɢ.
# #ᴍɪɴɪɴɢ
Guides.Mining.Section.0=§x§8§9§C§F§F§0ᴠề ᴋʜᴀɪ ᴛʜáᴄ:\ɴ§x§F§D§F§D§9§6ᴋʜᴀɪ ᴛʜáᴄ ʙᴀᴏ ɢồᴍ đàᴏ đá ᴠà ǫᴜặɴɢ. ɴó ꜱẽ ᴄộɴɢ ᴛʜêᴍ\ɴ§x§F§D§F§D§9§6ɴɢᴜʏêɴ ʟɪệᴜ ʀớᴛ ʀᴀ ᴋʜɪ ʙạɴ đàᴏ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6Để ᴄó xᴘ ᴋỹ ɴăɴɢ ɴàʏ, ʙạɴ ᴘʜảɪ ᴄầᴍ ᴄúᴘ để đàᴏ.\ɴ§x§F§D§F§D§9§6ᴄʜỉ ᴍộᴛ ꜱố ᴋʜốɪ ɴʜấᴛ địɴʜ ᴍớɪ ᴄʜᴏ xᴘ.
Guides.Mining.Section.1=§x§8§9§C§F§F§0ᴄáᴄ ᴋʜốɪ ʜợᴘ ʟệ:\ɴ§x§F§D§F§D§9§6Đá, ǫᴜặɴɢ ᴛʜᴀɴ, ǫᴜặɴɢ ꜱắᴛ, ǫᴜặɴɢ ᴠàɴɢ, ǫᴜặɴɢ ᴋɪᴍ ᴄươɴɢ, ǫᴜặɴɢ ʀᴇᴅꜱᴛᴏɴᴇ,\ɴ§x§F§D§F§D§9§6ǫᴜặɴɢ ɴɢọᴄ ʟưᴜ ʟʏ, ᴏʙꜱɪᴅɪᴀɴ, Đá ᴄᴜộɪ ᴍọᴄ ʀêᴜ, Đá ᴇɴᴅ,\ɴ§x§F§D§F§D§9§6Đá ᴘʜáᴛ ꜱáɴɢ, ᴠà ɴᴇᴛʜᴇʀʀᴀᴄᴋ.
Guides.Mining.Section.2=§x§8§9§C§F§F§0ᴄáᴄʜ ᴅùɴɢ ꜱɪêᴜ ᴄúᴘ:\ɴ§x§F§D§F§D§9§6ᴄầᴍ ᴄúᴘ ᴛʀêɴ ᴛᴀʏ, ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴄʜᴜẩɴ ʙị đồ ɴɢʜề.\ɴ§x§F§D§F§D§9§6ʟúᴄ ɴàʏ ʙạɴ ᴄó ᴋʜᴏảɴɢ 4 ɢɪâʏ để xúᴄ ᴠàᴏ\ɴ§x§F§D§F§D§9§6ᴄáᴄ ʟᴏạɪ ᴋʜốɪ Đàᴏ đấᴛ ʜợᴘ ʟệ, ᴛừ đó ꜱẽ ᴋíᴄʜ ʜᴏạᴛ\ɴ§x§F§D§F§D§9§6ꜱɪêᴜ ᴄúᴘ.
Guides.Mining.Section.3=§x§8§9§C§F§F§0ꜱɪêᴜ ᴄúᴘ ʟà ɢì?\ɴ§x§F§D§F§D§9§6ꜱɪêᴜ ᴄúᴘ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ ɢắɴ ʟɪềɴ ᴠớɪ ᴋỹ ɴăɴɢ ᴋʜᴀɪ ᴛʜáᴄ.\ɴ§x§F§D§F§D§9§6ɴó x3 ᴄơ ʜộɪ ʀớᴛ ᴛʜêᴍ đồ ᴠà ᴄʜᴏ ᴘʜéᴘ\ɴ§x§F§D§F§D§9§6ʙạɴ Đàᴏ ᴛứᴄ ᴛʜì (ɪɴꜱᴛᴀɴᴛ ʙʀᴇᴀᴋ) ᴠậᴛ ʟɪệᴜ ᴋʜᴀɪ ᴛʜáᴄ.
Guides.Mining.Section.4=§x§8§9§C§F§F§0ᴄáᴄʜ Đàᴏ ʙằɴɢ ᴛʜᴜốᴄ ɴổ:\ɴ§x§F§D§F§D§9§6ᴄầᴍ ᴄúᴘ ᴛʀêɴ ᴛᴀʏ,\ɴ§x§F§D§F§D§9§6ɴɢồɪ xᴜốɴɢ (ᴄʀᴏᴜᴄʜ) ᴠà ᴄʟɪᴄᴋ ᴄʜᴜộᴛ ᴘʜảɪ ᴠàᴏ ᴛɴᴛ ᴛừ xᴀ. ᴄáᴄʜ ɴàʏ ꜱẽ ʟàᴍ ᴛɴᴛ\ɴ§x§F§D§F§D§9§6ɴổ ɴɢᴀʏ ʟậᴘ ᴛứᴄ.
Guides.Mining.Section.5=§x§8§9§C§F§F§0Đàᴏ ʙằɴɢ ᴛʜᴜốᴄ ɴổ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6Đàᴏ ʙằɴɢ ᴛʜᴜốᴄ ɴổ ʟà ᴍộᴛ ᴋỹ ɴăɴɢ ᴄó ᴛʜờɪ ɢɪᴀɴ ʜồɪ ᴄʜɪêᴜ ɢắɴ ʟɪềɴ ᴠớɪ ᴋỹ ɴăɴɢ\ɴ§x§F§D§F§D§9§6ᴋʜᴀɪ ᴛʜáᴄ. ɴó ᴛăɴɢ đɪểᴍ ᴛʜưởɴɢ ᴋʜɪ ᴅùɴɢ ᴛɴᴛ ᴠà ᴄʜᴏ ʙạɴ\ɴ§x§F§D§F§D§9§6ᴛʜể ᴋíᴄʜ ɴổ ᴛɴᴛ ᴛừ xᴀ. ᴄó ʙᴀ ᴘʜầɴ ᴛʀᴏɴɢ Đàᴏ ʙằɴɢ ᴛʜᴜốᴄ ɴổ.\ɴ§x§F§D§F§D§9§6ᴘʜầɴ đầᴜ ʟà ʙᴏᴍ ʟớɴ ʜơɴ, ɢɪúᴘ ᴛăɴɢ ʙáɴ ᴋíɴʜ ɴổ.\ɴ§x§F§D§F§D§9§6ᴘʜầɴ ʜᴀɪ ʟà ᴄʜᴜʏêɴ ɢɪᴀ ᴛʜᴜốᴄ ɴổ, ɢɪúᴘ ɢɪảᴍ ꜱáᴛ ᴛʜươɴɢ\ɴ§x§F§D§F§D§9§6ᴛừ ᴠụ ɴổ ᴛɴᴛ. ᴘʜầɴ ʙᴀ ᴛʜì ꜱɪêᴜ đơɴ ɢɪảɴ, ɴó ᴛăɴɢ\ɴ§x§F§D§F§D§9§6ʟượɴɢ ǫᴜặɴɢ ʀớᴛ ʀᴀ ᴛừ ᴛɴᴛ ᴠà ɢɪảᴍ ʙớᴛ\ɴ§x§F§D§F§D§9§6ɴʜữɴɢ ᴍảɴʜ ᴠỡ ʀáᴄ ʀưởɪ.
# #ʀᴇᴘᴀɪʀ
Guides.Repair.Section.0=§x§8§9§C§F§F§0ᴠề ꜱửᴀ ᴄʜữᴀ:\ɴ§x§F§D§F§D§9§6ꜱửᴀ ᴄʜữᴀ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴅùɴɢ ᴍộᴛ ᴋʜốɪ ꜱắᴛ để ꜱửᴀ ɢɪáᴘ ᴠà\ɴ§x§F§D§F§D§9§6ᴄôɴɢ ᴄụ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ꜱửᴀ ᴄôɴɢ ᴄụ ʜᴏặᴄ ɢɪáᴘ ʙằɴɢ Đᴇ ᴍᴄᴍᴍᴏ. ᴍặᴄ địɴʜ đâʏ ʟà\ɴ§x§F§D§F§D§9§6ᴍộᴛ ᴋʜốɪ ꜱắᴛ ᴠà ᴋʜôɴɢ ɴêɴ ɴʜầᴍ ʟẫɴ ᴠớɪ\ɴ§x§F§D§F§D§9§6Đᴇ ᴛʀᴏɴɢ ᴍɪɴᴇᴄʀᴀꜰᴛ ᴠᴀɴɪʟʟᴀ.
Guides.Repair.Section.1=§x§8§9§C§F§F§0ꜱửᴀ ᴄʜữᴀ ᴅùɴɢ ᴛʜế ɴàᴏ?\ɴ§x§F§D§F§D§9§6Đặᴛ Đᴇ ᴍᴄᴍᴍᴏ xᴜốɴɢ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ꜱửᴀ đồ \ɴ§x§F§D§F§D§9§6ʙạɴ đᴀɴɢ ᴄầᴍ. ʜàɴʜ độɴɢ ɴàʏ ꜱẽ ᴛốɴ 1 ɴɢᴜʏêɴ ʟɪệᴜ ᴄʜᴏ ᴍỗɪ ʟầɴ ꜱửᴀ.
Guides.Repair.Section.2=§x§8§9§C§F§F§0ʙậᴄ ᴛʜầʏ ꜱửᴀ ᴄʜữᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ʙậᴄ ᴛʜầʏ ꜱửᴀ ᴄʜữᴀ ʟàᴍ ᴛăɴɢ ʟượɴɢ độ ʙềɴ ʜồɪ ʟạɪ. ᴘʜầɴ độ ʙềɴ\ɴ§x§F§D§F§D§9§6ᴄộɴɢ ᴛʜêᴍ ɴàʏ ᴘʜụ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ ꜱửᴀ ᴄʜữᴀ ᴄủᴀ ʙạɴ.
Guides.Repair.Section.3=§x§8§9§C§F§F§0ꜱɪêᴜ ꜱửᴀ ᴄʜữᴀ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ꜱɪêᴜ ꜱửᴀ ᴄʜữᴀ ʟà ᴋỹ ɴăɴɢ ʙị độɴɢ. ᴋʜɪ ꜱửᴀ đồ,\ɴ§x§F§D§F§D§9§6ɴó ꜱẽ ᴄʜᴏ ɴɢườɪ ᴄʜơɪ ᴍộᴛ ᴄơ ʜộɪ ꜱửᴀ đượᴄ đồ ᴠớɪ\ɴ§x§F§D§F§D§9§6ʜɪệᴜ ǫᴜả ᴘʜụᴄ ʜồɪ ɴʜâɴ đôɪ.
Guides.Repair.Section.4=§x§8§9§C§F§F§0ʀèɴ ʙí ᴛʜᴜậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋỹ ɴăɴɢ ʙị độɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ꜱửᴀ đồ ᴠà ɢɪữ ʟạɪ\ɴ§x§F§D§F§D§9§6ᴍộᴛ ᴛỉ ʟệ ɴʜấᴛ địɴʜ ʙùᴀ ᴘʜéᴘ ᴄủᴀ đồ. ɴʜữɴɢ ʙùᴀ ᴄʜú ɴàʏ ᴄó ᴛʜể\ɴ§x§F§D§F§D§9§6ɢɪữ ɴɢᴜʏêɴ ᴄấᴘ ʙậᴄ, ʙị ʜạ ᴄấᴘ xᴜốɴɢ ᴍộᴛ ʙậᴄ,\ɴ§x§F§D§F§D§9§6ʜᴏặᴄ ᴍấᴛ ꜱạᴄʜ.
# #ꜱᴀʟᴠᴀɢᴇ
Guides.Salvage.Section.0=§x§8§9§C§F§F§0ᴠề ᴘʜâɴ ʀã:\ɴ§x§F§D§F§D§9§6ᴘʜâɴ ʀã ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴅùɴɢ ᴋʜốɪ ᴠàɴɢ để ᴘʜâɴ ʀã áᴏ ɢɪáᴘ ᴠà\ɴ§x§F§D§F§D§9§6ᴄôɴɢ ᴄụ ᴛʜàɴʜ ɴɢᴜʏêɴ ʟɪệᴜ.\ɴ\ɴ§x§8§9§C§F§F§0ɴʜẬɴ xᴘ:\ɴ§x§F§D§F§D§9§6ᴘʜâɴ ʀã ʟà ᴋỹ ɴăɴɢ ᴘʜâɴ ɴʜáɴʜ ᴄủᴀ ꜱửᴀ ᴄʜữᴀ ᴠà ᴄâᴜ ᴄá, ᴄấᴘ ᴘʜâɴ ʀã\ɴ§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ đượᴄ ᴛíɴʜ ᴅựᴀ ᴛʀêɴ ᴄấᴘ độ ᴄâᴜ ᴄá ᴠà ꜱửᴀ ᴄʜữᴀ.
Guides.Salvage.Section.1=§x§8§9§C§F§F§0ᴘʜâɴ ʀã ᴅùɴɢ ᴛʜế ɴàᴏ?\ɴ§x§F§D§F§D§9§6Đặᴛ Đᴇ ᴘʜâɴ ʀã ᴍᴄᴍᴍᴏ xᴜốɴɢ ᴠà ᴄʟɪᴄᴋ ᴘʜảɪ ᴄʜᴜộᴛ để ᴘʜâɴ ʀã\ɴ§x§F§D§F§D§9§6ᴍóɴ đồ ʙạɴ đᴀɴɢ ᴄầᴍ. ʟàᴍ ᴛʜế ɴàʏ ꜱẽ đậᴘ ᴠỡ ᴍóɴ đồ,\ɴ§x§F§D§F§D§9§6ᴠà ᴛʀả ʟạɪ ᴄʜᴏ ʙạɴ ᴠậᴛ ʟɪệᴜ ᴄấᴜ ᴛʜàɴʜ ᴍóɴ đồ đó.\ɴ\ɴ§x§F§D§F§D§9§6ᴠí ᴅụ, ᴘʜâɴ ʀã ᴄúᴘ ꜱắᴛ ꜱẽ ᴛʀả ʟạɪ ᴄʜᴏ ʙạɴ ᴘʜôɪ ꜱắᴛ.
Guides.Salvage.Section.2=§x§8§9§C§F§F§0ᴘʜâɴ ʀã ɴâɴɢ ᴄᴀᴏ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋʜɪ đượᴄ ᴍở ᴋʜóᴀ, ᴋʜả ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ᴘʜâɴ ʀã đồ ʙị ʜỏɴɢ.\ɴ§x§F§D§F§D§9§6ᴛỉ ʟệ ᴛʜᴜ ʜồɪ ꜱẽ ᴛăɴɢ ᴋʜɪ ʙạɴ ʟêɴ ᴄấᴘ. ᴛỉ ʟệ ᴛʜᴜ ʜồɪ ᴄàɴɢ ᴄᴀᴏ\ɴ§x§F§D§F§D§9§6đồɴɢ ɴɢʜĩᴀ ᴠớɪ ᴠɪệᴄ ʙạɴ ʟấʏ ʟạɪ đượᴄ ᴄàɴɢ ɴʜɪềᴜ ᴠậᴛ ʟɪệᴜ.\ɴ§x§F§D§F§D§9§6ᴠớɪ ᴘʜâɴ ʀã ɴâɴɢ ᴄᴀᴏ ʙạɴ ꜱẽ ʟᴜôɴ ɴʜậɴ đượᴄ 1 ᴠậᴛ ʟɪệᴜ,\ɴ§x§F§D§F§D§9§6ᴛʀừ ᴋʜɪ ᴍóɴ đồ đó ɴáᴛ ᴛươᴍ. ɴêɴ ʙạɴ ᴋʜôɴɢ ᴄầɴ ᴘʜảɪ xᴏắɴ\ɴ§x§F§D§F§D§9§6ᴄʜᴜʏệɴ đậᴘ ᴠỡ đồ ᴍà ᴛʀắɴɢ ᴛᴀʏ ᴋʜôɴɢ đượᴄ ᴄắᴄ ɴàᴏ.
Guides.Salvage.Section.3=§x§8§9§C§F§F§0ᴠí ᴅụ ᴍɪɴʜ ʜọᴀ ᴄʜᴏ ᴅễ ʜɪểᴜ ɴʜé:\ɴ§x§F§D§F§D§9§6ɢɪả ꜱử ᴛᴀ đɪ ᴘʜâɴ ʀã ᴍộᴛ ᴄáɪ ᴄúᴘ ᴠàɴɢ đã ʜỏɴɢ 20%,\ɴ§x§F§D§F§D§9§6ɴɢʜĩᴀ ʟà ʟượɴɢ ᴠậᴛ ʟɪệᴜ ᴛốɪ đᴀ ʙạɴ ᴄó ᴛʜể ʟấʏ ʟạɪ ᴄʜỉ ʟà 2 ᴛʜỏɪ\ɴ§x§F§D§F§D§9§6(ᴠì ᴄʜế ᴛạᴏ ᴄúᴘ ᴄầɴ 3 ᴛʜỏɪ ᴠàɴɢ - ᴍỗɪ ᴛʜỏɪ ᴄʜɪếᴍ\ɴ§x§F§D§F§D§9§633,33% độ ʙềɴ) ʙằɴɢ ᴠớɪ 66%. ɴếᴜ ᴘʜầɴ ᴛʀăᴍ ᴛʜᴜ ʜồɪ\ɴ§x§F§D§F§D§9§6ᴄủᴀ ʙạɴ ᴅướɪ 66% ᴛʜì ʙạɴ ᴋʜôɴɢ ᴛʜể ʟấʏ ʟạɪ đượᴄ 2 ᴛʜỏɪ đâᴜ.\ɴ§x§F§D§F§D§9§6ɴʜưɴɢ ɴếᴜ ᴠượᴛ ᴄᴏɴ ꜱố ɴàʏ ᴛʜì ʙạɴ ᴄó ᴛʜể ʟấʏ "ᴛʀọɴ ᴠẹɴ",\ɴ§x§F§D§F§D§9§6ᴛứᴄ ʟà ʙạɴ ꜱẽ ẵᴍ ᴛʀọɴ 2 ᴛʜỏɪ ᴠàɴɢ.
Guides.Salvage.Section.4=§x§8§9§C§F§F§0ᴘʜâɴ ʀã ʙí ᴛʜᴜậᴛ ʜᴏạᴛ độɴɢ ʀᴀ ꜱᴀᴏ?\ɴ§x§F§D§F§D§9§6ᴋʜả ɴăɴɢ ɴàʏ ᴄʜᴏ ᴘʜéᴘ ʙạɴ ɴʜậɴ ꜱáᴄʜ ᴘʜéᴘ ᴋʜɪ ᴘʜâɴ ʀã\ɴ§x§F§D§F§D§9§6đồ ᴄó ʙùᴀ ᴄʜú. ᴛùʏ ᴛʜᴜộᴄ ᴠàᴏ ᴄấᴘ độ ᴄủᴀ ʙạɴ ᴍà ᴛỉ ʟệ\ɴ§x§F§D§F§D§9§6ʀúᴛ ᴛᴏàɴ ʙộ ʙùᴀ ʜᴀʏ ʀúᴛ ᴍộᴛ ᴘʜầɴ ʙùᴀ ꜱẽ ᴋʜáᴄ ɴʜᴀᴜ.\ɴ\ɴ§x§F§D§F§D§9§6ɴếᴜ ᴄʜỉ ʀúᴛ đượᴄ ᴍộᴛ ᴘʜầɴ ʙùᴀ ᴄʜú, ꜱáᴄʜ ᴘʜéᴘ ꜱẽ ᴄó\ɴ§x§F§D§F§D§9§6ᴄấᴘ ʙùᴀ ᴛʜấᴘ ʜơɴ ꜱᴏ ᴠớɪ ʙùᴀ ɢốᴄ\ɴ§x§F§D§F§D§9§6ᴛʀêɴ ᴍóɴ đồ.
