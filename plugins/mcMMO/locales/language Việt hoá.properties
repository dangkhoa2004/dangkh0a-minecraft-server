##Acrobatics
Guides.Acrobatics.Section.0=&3Về Nhào lộn:\n&eNhào lộn là nghệ thuật di chuyển Uyển chuyển trong mcMMO.\n&eNó mang lại các buff trong chiến đấu và buff sát thương môi trường.\n\n&3NHẬN XP:\n&eĐể cày XP kỹ năng này bạn cần thực hiện một cú né đòn\n&etrong chiến đấu hoặc sống sót sau khi nhảy từ trên cao xuống.
Guides.Acrobatics.Section.1=&3Kỹ năng Lộn vòng hoạt động ra sao?\n&eBạn có tỉ lệ bị động chặn được sát thương \n&ekhi ngã từ trên cao xuống. Bạn có thể giữ nút ngồi (sneak)\n&eđể nhân đôi cơ hội né sát thương lúc rơi xuống.\n&eHành động này sẽ kích hoạt Lộn vòng Hoàn hảo thay vì Lộn vòng thường.\n&eLộn vòng Hoàn hảo giống lộn thường nhưng dễ kích hoạt hơn gấp đôi\n&evà chặn được nhiều sát thương hơn.\n&eTỉ lệ Lộn vòng gắn liền với cấp độ kỹ năng của bạn
Guides.Acrobatics.Section.2=&3Né đòn hoạt động ra sao?\n&eNé đòn có tỉ lệ bị động giảm một nửa lượng sát thương\n&etrong lúc giao tranh.\n&eTỉ lệ này phụ thuộc vào cấp độ kỹ năng.
##Alchemy
Guides.Alchemy.Section.0=[[DARK_AQUA]]Về Giả kim thuật:\n[[YELLOW]]Giả kim thuật xoay quanh việc pha thuốc.\n[[YELLOW]]Kỹ năng này giúp tăng tốc độ pha chế, cũng như\n[[YELLOW]]chế ra những loại thuốc mới (bình thường) không thể chế được.\n\n\n[[DARK_AQUA]]NHẬN XP:\n[[YELLOW]]Để cày XP kỹ năng này bạn phải đi pha thuốc.
Guides.Alchemy.Section.1=[[DARK_AQUA]]Tính năng Xúc tác là sao?\n[[YELLOW]]Xúc tác làm tăng tốc độ pha thuốc, với\n[[YELLOW]]tốc độ tối đa là x4 ở cấp 1000.\n[[YELLOW]]Kỹ năng này tự mở khóa ở cấp 100 theo mặc định.
Guides.Alchemy.Section.2=[[DARK_AQUA]]Pha chế Đặc biệt là sao?\n[[YELLOW]]Cho phép dùng các nguyên liệu lạ để pha thuốc.\n[[YELLOW]]Nguyên liệu lạ nào được dùng tùy thuộc vào\n[[YELLOW]]Hạng của bạn. Có 8 thứ hạng để mở khóa.
Guides.Alchemy.Section.3=[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 1:\n[[YELLOW]]Bột Quỷ lửa, Mắt nhện lên men, Nước mắt Ghast, Redstone,\n[[YELLOW]]Bột đá phát sáng, Đường, Dưa hấu lấp lánh, Cà rốt vàng,\n[[YELLOW]]Kem dung nham, Bướu Nether, Mắt nhện, Thuốc súng, Chân thỏ,\n[[YELLOW]]Cá nóc\n[[YELLOW]](Thuốc mặc định Minecraft)
Guides.Alchemy.Section.4=[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 2:\n[[YELLOW]]Cà rốt (Thuốc Đào nhanh)\n[[YELLOW]]Bóng chất nhờn (Thuốc Đào chậm)\n\n[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 3:\n[[YELLOW]]Thạch anh (Thuốc Hấp thụ)\n[[YELLOW]]
Guides.Alchemy.Section.5=[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 4:\n[[YELLOW]]Táo (Thuốc Tăng Máu tối đa)\n[[YELLOW]]Thịt thối (Thuốc Gây Đói)\n\n[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 5:\n[[YELLOW]]Nấm Nâu (Thuốc Gây Buồn nôn)\n[[YELLOW]]Túi Mực (Thuốc Gây Mù)
Guides.Alchemy.Section.6=[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 6:\n[[YELLOW]]Dương xỉ (Thuốc No bụng)\n\n[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 7:\n[[YELLOW]]Khoai tây độc (Thuốc Phân hủy)\n\n[[DARK_AQUA]]Pha chế Đặc biệt - Nguyên liệu Hạng 8:\n[[YELLOW]]Táo Vàng thường (Thuốc Kháng sát thương)

##Archery
Guides.Archery.Section.0=&3Về Bắn cung:\n&eBắn cung tập trung vào việc bắn bằng cung tên.\n&eCung cấp nhiều buff chiến đấu khác nhau, chẳng hạn như tăng sát thương\n&etheo cấp độ kỹ năng và khả năng làm choáng\n&eđối thủ trong PvP. Thêm vào đó, bạn có thể nhặt lại\n&ephần nào số mũi tên đã bắn ra từ cái xác của kẻ địch.\n\n\n&3NHẬN XP:\n&eBắn trúng quái vật hoặc\n&engười chơi khác.
Guides.Archery.Section.1=&3Bắn chuẩn hoạt động ra sao?\n&eBắn chuẩn cộng thêm sát thương cho mỗi phát bắn.\n&eLượng sát thương từ Bắn chuẩn tăng lên khi bạn\n&elên cấp Bắn cung.\n&eTheo mặc định, sát thương từ cung sẽ tăng 10%\n&emỗi 50 cấp, tối đa là cộng 200% sát thương.
Guides.Archery.Section.2=&3Gây Choáng hoạt động ra sao?\n&eBạn có tỉ lệ bị động làm đối thủ bị choáng khi\n&ebắn trúng họ. Nếu bị Choáng, màn hình đối thủ sẽ bị ép\n&enhìn thẳng lên trời trong giây lát.\n&ePhát bắn gây choáng cũng cộng thêm 4 sát thương (2 tim).
Guides.Archery.Section.3=&3Thu hồi mũi tên hoạt động ra sao?\n&eBạn có tỉ lệ bị động lấy lại được một số mũi tên\n&esau khi giết một con quái bằng cung.\n&eTỉ lệ này tăng lên theo cấp độ Bắn cung.\n&eTheo mặc định, kỹ năng này tăng 0.1% mỗi cấp, lên tối đa 100%\n&eở cấp 1000.
##Axes
Guides.Axes.Section.0=&3Về Rìu:\n&eVới kỹ năng Rìu, bạn có thể dùng Rìu làm nhiều trò hơn\n&elà chỉ biết đi đốn rừng! Bạn có thể chặt và chém quái\n&ehoặc người chơi để cày XP, đánh quái với hiệu ứng\n&eđẩy lùi và gây ra những đòn chí mạng CHẾT NGƯỜI.\n&eChiếc rìu của bạn cũng biến thành máy nghiền gỗ cầm tay,\n&ephá hủy giáp đối thủ cực dễ khi bạn ở cấp độ cao.\n&3NHẬN XP:\n&eĐể cày XP bạn cần chém quái hoặc người chơi khác\n&ebằng Rìu.
Guides.Axes.Section.1=&3Bổ củi hoạt động ra sao?\n&eKỹ năng này giúp bạn đánh AoE (Sát thương Diện rộng).\n&eCú đánh AoE này sẽ gây ra lượng sát thương bằng một nửa so với\n&emục tiêu chính, rất hợp để dọn dẹp bầy quái lớn.
Guides.Axes.Section.2=&3Chí mạng hoạt động ra sao?\n&eChí mạng là kỹ năng bị động giúp người chơi có\n&ecơ hội gây thêm sát thương.\n&eTheo mặc định, cứ 2 cấp kỹ năng Rìu sẽ cho\n&e0.1% tỉ lệ nổ Chí mạng, sát thương x2.0 \n&elên quái hoặc x1.5 lên người chơi.
Guides.Axes.Section.3=&3Bậc thầy dùng Rìu hoạt động ra sao?\n&eBậc thầy dùng Rìu là kỹ năng bị động tự cộng thêm sát thương\n&ekhi bạn dùng Rìu.\n&eMặc định, sát thương cộng thêm tăng 1 điểm mỗi 50 cấp,\n&etối đa là 4 sát thương ở cấp 200.
Guides.Axes.Section.4=&3Xuyên giáp hoạt động ra sao?\n&eChém với lực đủ mạnh để đập nát giáp!\n&eXuyên giáp có tỉ lệ bị động làm hỏng\n&eáo giáp đối thủ. Sát thương giáp sẽ tăng theo cấp dùng Rìu.
Guides.Axes.Section.5=&3Công phá Mạnh hoạt động ra sao?\n&eBạn có tỉ lệ bị động tung ra một cú đánh cực mạnh\n&ekhi chém quái hay người bằng rìu.\n&eTỉ lệ mặc định là 25%. Kỹ năng bị động này gây ra hiệu ứng\n&eđẩy lùi cực gắt, tựa như bùa Knockback II\n&eThêm vào đó, nó còn gây sát thương cộng thêm cho mục tiêu.
##Excavation
Guides.Excavation.Section.0=&3Về Đào đất:\n&eĐào đất là hành động xúc đất lên để kiếm kho báu.\n&eCàng đào nhiều đất bạn càng ra đồ xịn.\n&eĐào càng lâu kho báu ra càng khủng.\n\n&3NHẬN XP:\n&eCầm xẻng trên tay và đi đào đất.\n&eChỉ một số loại khối mới rớt đồ và cho XP.
Guides.Excavation.Section.1=&3Các khối hợp lệ:\n&eCỏ, Đất, Cát, Đất sét, Sỏi, Rễ nấm, Cát linh hồn, Tuyết
Guides.Excavation.Section.2=&3Cách dùng Siêu Máy khoan:\n&eCầm xẻng trên tay và click phải chuột để chuẩn bị đồ nghề.\n&eLúc này bạn có khoảng 4 giây để xúc vào\n&ecác loại khối Đào đất hợp lệ, từ đó sẽ\n&ekích hoạt Siêu Máy Khoan.
Guides.Excavation.Section.3=&3Siêu Máy khoan là gì?\n&eSiêu Máy khoan là một kỹ năng có thời gian hồi chiêu\n&egắn liền với Đào đất. Nó x3 cơ hội\n&etìm thấy kho báu và cho phép bạn Đào tức thì\n&e(Instant break) các khối hợp lệ.
Guides.Excavation.Section.4=&3Khảo cổ học hoạt động ra sao?\n&eMỗi loại kho báu rớt ra từ Đào đất đều có mức yêu cầu\n&ecấp độ kỹ năng riêng, vì thế rất khó\n&eđể nói chính xác nó giúp được bạn bao nhiêu.\n&eChỉ cần nhớ là kỹ năng Đào đất càng cao\n&ethì kho báu bạn đào được càng nhiều.\n&eVà cũng nên nhớ là mỗi loại khối hợp lệ để đào\n&eđều chứa những phần thưởng kho báu riêng biệt.\n&eNói cách khác đào Đất rớt đồ khác\n&evới đào Sỏi.
Guides.Excavation.Section.5=&3Lưu ý về Đào đất:\n&eĐồ rớt ra khi đào đất có thể tùy chỉnh hoàn toàn\n&enên đồ sẽ khác nhau tùy theo từng server.
##Fishing
Guides.Fishing.Section.0=&3Về Câu cá:\n&eVới kỹ năng Câu cá, việc câu cá lại trở nên thú vị!\n&eCâu kho báu bí mật, và giật đồ từ bọn quái vật.\n\n&3NHẬN XP:\n&eĐi câu cá.
Guides.Fishing.Section.1=&3Thợ săn Kho báu hoạt động ra sao?\n&eKỹ năng này cho phép bạn câu lên kho báu\n&evới tỉ lệ nhỏ câu được đồ có bùa phép.\n&eMọi loại kho báu Câu cá đều có cơ hội\n&erớt ra ở mọi cấp độ. Dù vậy nó phụ thuộc\n&evào độ hiếm của món đồ mà tần suất rớt khác nhau.\n&eCấp độ Câu cá của bạn càng cao, cơ hội\n&etìm được kho báu xịn càng lớn.
Guides.Fishing.Section.2=&3Câu cá trên Băng hoạt động ra sao?\n&eKỹ năng bị động này cho phép bạn đi câu ở các hồ đóng băng!\n&ePhóng mồi câu xuống mặt hồ đóng băng và kỹ năng này sẽ\n&etự đục một lỗ nhỏ trên băng để bạn câu.
Guides.Fishing.Section.3=&3Chuyên gia Câu cá hoạt động ra sao?\n&eKỹ năng bị động này làm cá cắn câu nhanh hơn.\n&eKhi đã mở khóa, nếu bạn ngồi trên thuyền mà câu\n&ethì tỉ lệ câu trúng cá sẽ cao hơn.
Guides.Fishing.Section.4=&3Giật đồ hoạt động ra sao?\n&eKỹ năng chủ động này cho phép bạn móc mồi câu\n&evào quái vật để giật đồ rơi ra.\n&eQuái sẽ rớt ra món đồ mà chúng thường rớt khi bị giết chết.\n&eThậm chí bạn còn có thể giật được sọ quái (Skull),\n&eThứ mà bình thường không thể có được ở chế độ sinh tồn.
Guides.Fishing.Section.5=&3Chế độ ăn của Ngư dân hoạt động ra sao?\n&eKỹ năng bị động này tăng lượng thức ăn được hồi lại\n&ekhi bạn ăn cá.
Guides.Fishing.Section.6=&3Lưu ý về Câu cá:\n&eĐồ rớt ra khi Câu cá có thể tùy chỉnh hoàn toàn,\n&enên đồ sẽ khác nhau tùy theo từng server.
##Herbalism
Guides.Herbalism.Section.0=&3Về Trồng trọt:\n&eTrồng trọt xoay quanh việc thu thập thảo dược và cây cối.\n\n\n&3NHẬN XP:\n&eThu thập cây cối và thảo mộc.
Guides.Herbalism.Section.1=&3Các Khối hợp lệ\n&eLúa mì, Khoai tây, Cà rốt, Dưa hấu, \n&eBí ngô, Mía, Hạt ca cao, Hoa, Xương rồng, Nấm,\n&eBướu Nether, Lá súng, và Dây leo.
Guides.Herbalism.Section.2=&3Mầm sống (Green Terra) hoạt động ra sao?\n&eMầm sống là một kỹ năng chủ động, bạn có thể click phải chuột\n&ekhi đang cầm cuốc để kích hoạt Mầm sống.\n&eMầm sống cho bạn tỉ lệ nhặt x3 sản lượng khi\n&ethu hoạch cây trồng. Nó còn cho bạn quyền\n&etruyền mầm sống vào các khối để thay đổi chúng bằng\n&ehạt giống có trong kho đồ.
Guides.Herbalism.Section.3=&3Bàn tay Xanh (Cây Trồng) hoạt động ra sao?\n&eKỹ năng bị động này sẽ tự động gieo lại hạt giống\n&ekhi bạn thu hoạch.\n&eTỉ lệ thành công phụ thuộc vào cấp độ Trồng trọt.
Guides.Herbalism.Section.4=&3Bàn tay Xanh (Đá cuội/Gạch đá/Đất) hoạt động ra sao?\n&eKỹ năng chủ động này cho phép bạn hô biến các khối này thành\n&enhững khối "có liên quan tới thực vật". Bạn có thể làm vậy bằng cách click phải\n&evào một khối, đồng thời cầm hạt giống. Cách này sẽ tốn 1 hạt giống.
Guides.Herbalism.Section.5=&3Chế độ ăn của Nông dân hoạt động ra sao?\n&eKỹ năng bị động này tăng lượng thức ăn hồi lại \n&ekhi ăn Bánh mì, Bánh quy, Dưa hấu, Súp Nấm, Cà rốt,\n&evà Khoai tây.
Guides.Herbalism.Section.6=&3May mắn của Hylia hoạt động ra sao?\n&eKỹ năng bị động này cho bạn cơ hội tìm thấy vật phẩm quý\n&ekhi chém vỡ một số loại khối bằng kiếm.
Guides.Herbalism.Section.7=&3Nhân đôi Sản lượng hoạt động ra sao?\n&eKỹ năng bị động này giúp bạn có thêm sản lượng\n&ekhi thu hoạch mùa màng.
##Mining
Guides.Mining.Section.0=&3Về Khai thác:\n&eKhai thác bao gồm đào đá và quặng. Nó sẽ cộng thêm\n&enguyên liệu rớt ra khi bạn đào.\n\n&3NHẬN XP:\n&eĐể có XP kỹ năng này, bạn phải cầm cúp để đào.\n&eChỉ một số khối nhất định mới cho XP.
Guides.Mining.Section.1=&3Các Khối hợp lệ:\n&eĐá, Quặng Than, Quặng Sắt, Quặng Vàng, Quặng Kim cương, Quặng Redstone,\n&eQuặng Ngọc lưu ly, Obsidian, Đá cuội mọc rêu, Đá End,\n&eĐá phát sáng, và Netherrack.
Guides.Mining.Section.2=&3Cách dùng Siêu Cúp:\n&eCầm cúp trên tay, click phải chuột để chuẩn bị đồ nghề.\n&eLúc này bạn có khoảng 4 giây để xúc vào\n&ecác loại khối Đào đất hợp lệ, từ đó sẽ kích hoạt\n&eSiêu Cúp.
Guides.Mining.Section.3=&3Siêu Cúp là gì?\n&eSiêu Cúp là một kỹ năng có thời gian hồi chiêu gắn liền với kỹ năng Khai thác.\n&eNó x3 cơ hội rớt thêm đồ và cho phép\n&ebạn Đào tức thì (Instant break) vật liệu Khai thác.
Guides.Mining.Section.4=&3Cách Đào bằng Thuốc nổ:\n&eCầm cúp trên tay,\n&engồi xuống (crouch) và click chuột phải vào TNT từ xa. Cách này sẽ làm TNT\n&enổ ngay lập tức.
Guides.Mining.Section.5=&3Đào bằng Thuốc nổ hoạt động ra sao?\n&eĐào bằng Thuốc nổ là một kỹ năng có thời gian hồi chiêu gắn liền với kỹ năng\n&eKhai thác. Nó tăng điểm thưởng khi dùng TNT và cho bạn\n&ethể kích nổ TNT từ xa. Có ba phần trong Đào bằng Thuốc nổ.\n&ePhần đầu là Bom Lớn Hơn, giúp tăng bán kính nổ.\n&ePhần hai là Chuyên gia Thuốc nổ, giúp giảm sát thương\n&etừ vụ nổ TNT. Phần ba thì siêu đơn giản, nó tăng\n&elượng quặng rớt ra từ TNT và giảm bớt\n&enhững mảnh vỡ rác rưởi.
##Repair
Guides.Repair.Section.0=&3Về Sửa chữa:\n&eSửa chữa cho phép bạn dùng một khối Sắt để sửa giáp và\n&ecông cụ.\n\n&3NHẬN XP:\n&eSửa công cụ hoặc giáp bằng Đe mcMMO. Mặc định đây là\n&emột khối sắt và không nên nhầm lẫn với\n&eĐe trong Minecraft Vanilla.
Guides.Repair.Section.1=&3Sửa chữa dùng thế nào?\n&eĐặt Đe mcMMO xuống và click phải chuột để sửa đồ \n&ebạn đang cầm. Hành động này sẽ tốn 1 nguyên liệu cho mỗi lần sửa.
Guides.Repair.Section.2=&3Bậc thầy Sửa chữa hoạt động ra sao?\n&eBậc thầy Sửa chữa làm tăng lượng độ bền hồi lại. Phần độ bền\n&ecộng thêm này phụ thuộc vào cấp độ Sửa chữa của bạn.
Guides.Repair.Section.3=&3Siêu Sửa chữa hoạt động ra sao?\n&eSiêu Sửa chữa là kỹ năng bị động. Khi sửa đồ,\n&enó sẽ cho người chơi một cơ hội sửa được đồ với\n&ehiệu quả phục hồi nhân đôi.
Guides.Repair.Section.4=&3Rèn Bí thuật hoạt động ra sao?\n&eKỹ năng bị động này cho phép bạn sửa đồ và giữ lại\n&emột tỉ lệ nhất định bùa phép của đồ. Những bùa chú này có thể\n&egiữ nguyên cấp bậc, bị hạ cấp xuống một bậc,\n&ehoặc mất sạch.
##Salvage
Guides.Salvage.Section.0=&3Về Phân rã:\n&ePhân rã cho phép bạn dùng khối Vàng để phân rã áo giáp và\n&ecông cụ thành nguyên liệu.\n\n&3NHẬN XP:\n&ePhân rã là kỹ năng phân nhánh của Sửa chữa và Câu cá, cấp Phân rã\n&ecủa bạn được tính dựa trên cấp độ Câu cá và Sửa chữa.
Guides.Salvage.Section.1=&3Phân rã dùng thế nào?\n&eĐặt Đe Phân rã mcMMO xuống và click phải chuột để phân rã\n&emón đồ bạn đang cầm. Làm thế này sẽ đập vỡ món đồ,\n&evà trả lại cho bạn vật liệu cấu thành món đồ đó.\n\n&eVí dụ, phân rã cúp sắt sẽ trả lại cho bạn phôi sắt.
Guides.Salvage.Section.2=&3Phân rã Nâng cao hoạt động ra sao?\n&eKhi được mở khóa, khả năng này cho phép bạn phân rã đồ bị hỏng.\n&eTỉ lệ thu hồi sẽ tăng khi bạn lên cấp. Tỉ lệ thu hồi càng cao\n&eđồng nghĩa với việc bạn lấy lại được càng nhiều vật liệu.\n&eVới phân rã nâng cao bạn sẽ luôn nhận được 1 vật liệu,\n&etrừ khi món đồ đó nát tươm. Nên bạn không cần phải xoắn\n&echuyện đập vỡ đồ mà trắng tay không được cắc nào.
Guides.Salvage.Section.3=&3Ví dụ minh họa cho dễ hiểu nhé:\n&eGiả sử ta đi phân rã một cái cúp vàng đã hỏng 20%,\n&enghĩa là lượng vật liệu tối đa bạn có thể lấy lại chỉ là 2 thỏi\n&e(vì chế tạo cúp cần 3 thỏi vàng - mỗi thỏi chiếm\n&e33,33% độ bền) bằng với 66%. Nếu phần trăm thu hồi\n&ecủa bạn dưới 66% thì bạn không thể lấy lại được 2 thỏi đâu.\n&eNhưng nếu vượt con số này thì bạn có thể lấy "trọn vẹn",\n&etức là bạn sẽ ẵm trọn 2 thỏi vàng.
Guides.Salvage.Section.4=&3Phân rã Bí thuật hoạt động ra sao?\n&eKhả năng này cho phép bạn nhận sách phép khi phân rã\n&eđồ có bùa chú. Tùy thuộc vào cấp độ của bạn mà tỉ lệ\n&erút toàn bộ bùa hay rút một phần bùa sẽ khác nhau.\n\n&eNếu chỉ rút được một phần bùa chú, sách phép sẽ có\n&ecấp bùa thấp hơn so với bùa gốc\n&etrên món đồ.
##Smelting
Guides.Smelting.Section.0=Sắp ra mắt...
##Swords
Guides.Swords.Section.0=&3Về Dùng Kiếm:\n&eKỹ năng này ban thưởng các chỉ số chiến đấu cho ai chiến đấu bằng\n&ekiếm.\n\n&3NHẬN XP:\n&eNhận XP dựa trên lượng sát thương gây ra lên quái hoặc \n&engười chơi khi vác kiếm trên tay.
Guides.Swords.Section.1=&3Nhát chém Răng cưa hoạt động ra sao?\n&eNhát chém Răng cưa là một kỹ năng chủ động, bạn có thể kích hoạt bằng cách\n&eclick phải khi cầm kiếm. Kỹ năng này cho phép bạn đánh \n&eAoE (Diện rộng). Cú đánh AoE này sẽ gây thêm 25%\n&esát thương và có khả năng gây Rách vết thương (Bleed).
Guides.Swords.Section.2=&3Phản công hoạt động ra sao?\n&ePhản công là một kỹ năng chủ động. Khi bạn đỡ đòn và ăn\n&ehit từ quái, bạn sẽ có tỉ lệ phản lại 50% \n&esát thương vừa nhận.
Guides.Swords.Section.3=&3Rách vết thương hoạt động ra sao?\n&eRách vết thương khiến đối thủ nhận sát thương mỗi hai giây. Mục \n&etiêu sẽ bị rỉ máu cho đến khi hiệu ứng kết thúc, hoặc chết, \n&etùy cái nào tới trước.\n&eThời gian rỉ máu phụ thuộc vào cấp kỹ năng kiếm của bạn.
##Taming
Guides.Taming.Section.0=&3Về Thuần hóa:\n&eThuần hóa mang lại cho người chơi nhiều buff chiến đấu khi dắt theo\n&esói đã được thuần hóa.\n\n&3NHẬN XP:\n&eĐể lấy XP kỹ năng này, bạn cần thuần hóa sói/mèo rừng hoặc\n&echỉ cần mang chúng theo trong giao tranh.
Guides.Taming.Section.1=&3Tiếng gọi Nơi Hoang dã hoạt động ra sao?\n&eTiếng gọi Nơi Hoang dã là kỹ năng chủ động giúp bạn gọi\n&emột chú sói hoặc mèo rừng tới bên cạnh. Bạn có thể làm việc này bằng cách\n&engồi (sneak) + click trái khi đang cầm xương hoặc cá.
Guides.Taming.Section.2=&3Hiểu biết Động vật hoạt động ra sao?\n&eHiểu biết Động vật cho phép người chơi soi thú cưng và xem\n&echỉ số của sói và mèo rừng. Click trái vào sói hoặc mèo rừng để dùng\n&eHiểu biết Động vật.
Guides.Taming.Section.3=&3Cắn xé hoạt động ra sao?\n&eCắn xé là kỹ năng bị động, có xác suất gây hiệu ứng\n&erỉ máu lên những kẻ địch bị đàn sói của bạn tấn công.
Guides.Taming.Section.4=&3Vuốt Sắc hoạt động ra sao?\n&eVuốt Sắc làm tăng sát thương mà sói\n&ecủa bạn cắn vào đối phương. Sát thương cộng thêm dựa vào cấp Thuần hóa của bạn.
Guides.Taming.Section.5=&3Nhận thức Môi trường hoạt động ra sao?\n&eKỹ năng bị động này sẽ giúp sói dịch chuyển về bên bạn khi\n&echúng lảng vảng quanh nơi nguy hiểm, kiểu Xương rồng/Dung nham. Nó cũng giúp\n&esói miễn nhiễm hoàn toàn với sát thương rơi.
Guides.Taming.Section.6=&3Lông Dày hoạt động ra sao?\n&eKỹ năng bị động này giúp giảm sát thương và làm cho sói\n&ekháng lại lửa.
Guides.Taming.Section.7=&3Chống Sốc hoạt động ra sao?\n&eKỹ năng bị động này giúp sói giảm thiệt hại\n&etừ thuốc nổ.
Guides.Taming.Section.8=&3Giao đồ ăn Nhanh hoạt động ra sao?\n&eKỹ năng bị động này cho sói cơ hội được hồi máu mỗi khi\n&echúng cắn kẻ địch.
##Unarmed
Guides.Unarmed.Section.0=&3Về Tay Không:\n&eTay không cho phép người chơi nhận các buff chiến đấu khi sử dụng\n&enắm đấm làm vũ khí. \n\n&3NHẬN XP:\n&eXP nhận được dựa trên lượng sát thương đấm được lên quái \n&ehoặc người chơi khác khi bạn không cầm gì trên tay.
Guides.Unarmed.Section.1=&3Cuồng nộ hoạt động ra sao?\n&eCuồng nộ là một kỹ năng chủ động được kích hoạt bằng\n&eclick phải. Khi ở trạng thái Cuồng nộ, bạn gây thêm 50%\n&esát thương và có thể đấm nát các khối mềm ngay tức khắc, kiểu như\n&eĐất hay Cỏ.
Guides.Unarmed.Section.2=&3Thiết Sa Chưởng hoạt động ra sao?\n&eThiết Sa Chưởng tăng sát thương khi bạn lấy tay\n&eđấm quái hoặc người chơi khác.
Guides.Unarmed.Section.3=&3Đẩy lùi Cung tên hoạt động ra sao?\n&eĐẩy lùi Cung tên là một kỹ năng bị động cho bạn cơ hội\n&egạt phăng mũi tên của Bộ Xương hoặc người chơi khác bắn ra.\n&eMũi tên sẽ rớt bịch xuống đất, vô hại.
Guides.Unarmed.Section.4=&3Tay kẹp sắt hoạt động ra sao?\n&eTay kẹp sắt là một kỹ năng bị động chống lại việc bị tước vũ khí. Cấp độ\n&eTay không càng cao, cơ hội chống tước vũ khí càng tăng.
Guides.Unarmed.Section.5=&3Tước vũ khí hoạt động ra sao?\n&eKỹ năng bị động này cho phép người chơi tước vũ khí của người khác,\n&elàm vũ khí mục tiêu đang cầm bị rớt ra ngoài.
##Woodcutting
Guides.Woodcutting.Section.0=&3Về Chặt gỗ:\n&eChặt gỗ nói chung là đi đốn cây đấy.\n\n&3NHẬN XP:\n&eNhận XP bất cứ khi nào bạn chặt vỡ một khối gỗ.
Guides.Woodcutting.Section.1=&3Đốn cây hoạt động ra sao?\n&eĐốn cây là một kỹ năng chủ động, bạn có thể click phải\n&ekhi đang cầm rìu để kích hoạt. Kỹ năng này\n&ekhiến cả cái cây vỡ vụn ngay lập tức, rớt ra\n&etoàn bộ gỗ của cây trong tích tắc.
Guides.Woodcutting.Section.2=&3Máy Thổi Lá hoạt động ra sao?\n&eMáy Thổi Lá là một kỹ năng bị động làm cho\n&elá cây nổ tung ngay lập tức khi bạn chém rìu vào. Mặc định,\n&ekỹ năng này mở khóa ở cấp 100.
Guides.Woodcutting.Section.3=&3Nhân đôi Sản lượng hoạt động ra sao?\n&eKỹ năng bị động này cho bạn cơ hội nhặt được một\n&ekhối gỗ dôi ra cho mỗi khúc gỗ bạn chặt.
# Crossbows
Guides.Crossbows.Section.0=&3Về Bắn nỏ:\n&eBắn nỏ xoay quanh việc bắn kẻ thù bằng chiếc nỏ của bạn.\n\n&3NHẬN XP:\n&eNhận XP mỗi khi bạn bắn trúng quái vật bằng Nỏ.
Guides.Crossbows.Section.1=&3Phát bắn Bật tường hoạt động ra sao?\n&eBật tường là một kỹ năng bị động, bạn nhắm bắn nỏ ở những góc hẹp để thực hiện cú Bật tường. Mũi tên sẽ nảy bật lại khi chạm vào tường hoặc nền và có thể xuyên trúng mục tiêu. Số lượng lần bật nảy tùy thuộc vào bậc xếp hạng của Phát bắn Bật tường.
# Tridents
Guides.Tridents.Section.0=&3Về Đinh ba:\n&eKỹ năng Đinh ba xoay quanh việc phóng đinh ba xuyên thủng kẻ thù.\n\n&3NHẬN XP:\n&eNhận XP mỗi khi bạn phi Đinh ba vào quái vật.
Guides.Maces.Section.0=&3Về Chùy:\n&eChùy nói chung là đi đập tan nát kẻ thù bằng một cái Chùy.\n\n&3NHẬN XP:\n&eNhận XP mỗi khi bạn nện Chùy vào quái vật.
Guides.Spears.Section.0=&3Về Thương:\n&eThương xoay quanh việc đâm kẻ thù bằng cây Thương.\n\n&3NHẬN XP:\n&eNhận XP mỗi khi bạn đâm trúng quái vật bằng Thương.
