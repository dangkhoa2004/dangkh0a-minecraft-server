    embed_ban:
      title: ʙị ᴄấᴍ
      color: '#CC2200'
      content: |-
        $playerName đã ʙị ᴄấᴍ
        • ɴɢườɪ ᴄấᴍ: $executor
        • ᴛʜờɪ ʜạɴ: $duration
        • ʟý ᴅᴏ: $reason
      thumbnail: ''
      fields: ''
    embed_unban:
      title: ɢỡ ᴄấᴍ
      color: '#727374'
