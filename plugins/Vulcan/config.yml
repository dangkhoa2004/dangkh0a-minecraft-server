prefix: '#ff7109&lᴠᴜʟᴄᴀɴ &8»'
alerts:
  format: '%prefix% &e%player% &fnghi vấn &e%check%&f (&e%complex-type%&f) &8[#ff7109%vl%
    &8| #ff7109%ping%ms&8]'
  hover-message:
  - '#DBD9D9• &fNgười chơi: &e%player%'
  - '#DBD9D9• &fClient: &e%client-brand% #DBD9D9(%version%)'
  - '#DBD9D9• &fKiểm tra: &e%check% #DBD9D9(Dạng &f%type%#DBD9D9)'
  - '#DBD9D9• &fMức vi phạm: &e%vl% #DBD9D9/ &e%max-vl%'
  - '#DBD9D9• &fPing: &e%ping%ms'
  - '#DBD9D9• &fTPS: &e%tps%'
  - ''
  - '#DBD9D9Chi tiết: %description%'
  - '#DBD9D9Thông số: %info%'
  - ''
  - '#DBD9D9• &fBấm vào để dịch chuyển đến &e%player%'
  click-commands:
  - /tp %player%
  click-alert-command-commands:
  - tp %player%
  toggled-on-message: '%prefix% &fĐã &abật&f cảnh báo Anticheat.'
  toggled-off-message: '%prefix% &fĐã &ctắt&f cảnh báo Anticheat.'
  print-to-console: true
  console-format: '[Vulcan] %player% vi pham %check% %dev%(Dang %type%)%dev% (%vl%/%max-vl%)'
  custom-commands: []
  severity:
    violations:
      '2': 2
      '3': 4
      '4': 6
      '5': 8
      '6': 10
      '7': 12
      '8': 14
      '9': 16
      '10': 18
    colors:
      '1': '&a'
      '2': '&e'
      '3': '&e'
      '4': '&6'
      '5': '&6'
      '6': '&c'
      '7': '&c'
      '8': '&4'
      '9': '&4'
      '10': '&4'
  experimental-symbol: ✦
log-file:
  enabled: true
  alert-message: '&e%player% &fvi pham &e%check% (%type%) #DBD9D9| #ff7109x%vl%
    #DBD9D9%ping%ms TPS: %tps% Version: %version% Client: %client-brand%]'
  punishment-message: '&e%player% &fbi xu ly vi &e%check% (%type%) #DBD9D9| #ff7109x%vl%
    #DBD9D9%ping%ms TPS: %tps% Client: %client-brand%'
unloaded-chunks:
  setback-enabled: true
  message: '%prefix% &f%player% #DBD9D9bị kéo lại do đi vào chunk chưa được tải!'
  max-ticks: 40
punishment-file:
  enabled: true
violation-reset:
  enabled: true
  interval-in-minutes: 8
  message-enabled: false
  message: '%prefix% &6Đã làm mới điểm vi phạm của toàn bộ người chơi!'
client-brand-alerts:
  resolve: true
  enabled: true
  ignore-alerts-list:
  - vanilla
  message: '%prefix% &f%player% #DBD9D9vào server bằng &f%client-brand%'
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&cBạn không thể vào server bằng %client-brand%!'
  console: false
  console-message: '[Vulcan] %player% join bang %client-brand%!'
  whitelist-enabled: false
  whitelisted-client-brands: []
connection:
  debug-messages: false
  ignore-ids-over-0: false
  other-anticheat-support: false
  invalid:
    enabled: true
    kick-message: '&cMất kết nối: Nhận được gói tin xác nhận không hợp lệ.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9bị ngắt kết nối do gửi gói tin xác nhận lỗi. &8(ID: &c%id%&8)'
    console-alert-message: '[Vulcan] &e%player% bi kick vi loi goi tin. ID: &c%id%'
  out-of-order:
    enabled: true
    kick-message: '&cMất kết nối: Các gói tin đến không đúng thứ tự.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9gửi gói tin sai thứ tự! &8(Nhận: &c%id% #DBD9D9| Đợi: &c%last-id%&8)'
    console-alert-message: '[Vulcan] &e%player% gui goi tin sai thu tu. Nhan: %id%, Doi: %last-id%'
  no-response:
    delay-in-seconds: 45
    kick-message: '&cMất kết nối: Không phản hồi gói tin kiểm tra mạng của máy chủ.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9không phản hồi máy chủ trong &c%delay%ms#DBD9D9.'
    console-alert-message: '[Vulcan] &e%player% bi ngat ket noi do khong phan hoi trong &c%delay%ms.'
    code-of-conduct-fix: true
  max-size:
    amount: 2000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7bị kick do nghẽn mạng hoặc thao tác tay quá nhiều! (&c%size%&7)'
    console-alert-message: '[Vulcan] %player% was kicked for too many pending confirmations! (&c%size%&7)'
  keepalive:
    kick-enabled: true
    max-delay: 45000
    kick-message: '&cMất kết nối: Tín hiệu mạng quá yếu.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9không phản hồi tín hiệu keepalive trong &c%delay%ms#DBD9D9.'
    console-message: '[Vulcan] &e%player% did not respond to keepalive packets in &c%delay%ms.'
  max-ping:
    kick-enabled: true
    max-ping: 5000
    max-ticks: 20
    kick-message: '&cMất kết nối: Ping của bạn vượt quá giới hạn cho phép.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9bị kick do ping quá cao (&c%ping%ms#DBD9D9).'
    console-message: '[Vulcan] &e%player% bi kick vi ping cao: &c%ping%ms.'
punishments:
  message: '%prefix% &e%player% &fbị văng khỏi máy chủ do &e%check% (%type%) #DBD9D9| #ff7109x%vl%'
  broadcast:
  - '&6× &f%player% #DBD9D9đã bị cấm vì &cGian lận (Hack/Cheat)#DBD9D9.'
judgement-days:
  started-broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&cĐợt Quét Hack (Vulcan) đang bắt đầu...'
  - '&6&m---»--*-------------------------------------*--«---'
  ended-broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&cĐợt Quét Hack kết thúc... Đã ban #ff7109%amount% tài khoản.'
  - '&6&m---»--*-------------------------------------*--«---'
  commands:
  - ban %player% &cGian lận (Phát hiện từ Đợt Quét Hack)
  broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&e%player% &6đã bay màu trong &cĐợt Quét Hack&6.'
  - '&6&m---»--*-------------------------------------*--«---'
  cooldown: 1000
  run-at-interval: false
  interval: 36000
freeze:
  logged-out-while-frozen-commands: []
ghost-blocks-fix:
  enabled: true
  ghost-water-fix: true
  minimum-tps: 18.5
  ignore-legacy-via: true
  buffer:
    max: 3
    decay: 0.1
  setback: true
  update-blocks: true
  ticks: 3
  message-enabled: true
  message: '&cBạn vừa kẹt vào block ảo. Máy chủ đã sửa lại vị trí của bạn!'
  staff-message-enabled: true
  staff-message: '%prefix% Vị trí của &f%player% #DBD9D9vừa được sửa lại do lỗi block ảo tại &e(&c%world%, %x%, %y%, %z%&e) &6[%ticks% ticks]'
  print-to-console: true
  console-message: '[Vulcan] %player%''s position fixed for ghost block at (%world%, %x%, %y%, %z%) &6[%ticks% ticks]'
