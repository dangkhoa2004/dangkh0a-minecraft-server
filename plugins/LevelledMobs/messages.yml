        success:
        - '%prefix% đã ᴛɪêᴜ ᴅɪệᴛ &#A3C4F3%killed%&#D1E8E2 ᴍᴏʙ ᴄó ᴄấᴘ ᴛʀᴏɴɢ ʙáɴ ᴋíɴʜ &#A3C4F3%radius%&#D1E8E2 ʙʟᴏᴄᴋ &#888888(&#A3C4F3%skipped%&#D1E8E2 ᴍᴏʙ đã ʙị ʙỏ ǫᴜᴀ&#888888)&#D1E8E2.'
