# This is the Bukkit configuration file in Paper.
# As you can see, there's actually not that much to configure without any plugins.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/bukkit-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

settings:
  allow-end: true # whether end should be enabled (false = portals won't work anymore)
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000 # if you're running a proxy (bungeecord/velocity) you should set it to 0, so queue plugins and etc. will work properly
  query-plugins: false
  deprecated-verbose: default
  shutdown-message: Máy chủ đã tắt. Vui lòng tham gia lại sau!
  minimum-api: none
  use-map-color-cache: true
spawn-limits: # [!!!] actually this section is pretty various, survival servers probably should set those values to higher limits
  monsters: 17
  animals: 5
  water-animals: 2
  water-ambient: 2
  water-underground-creature: 3
  axolotls: 2
  ambient: 0 # ambient = bats, it's disabled since a lot of servers are struggling with them ticking a lot
chunk-gc:
  period-in-ticks: 400 # this value should fit 99% of servers, but if you are experiencing issues with chunk garbage collector, you could set it to lower one
ticks-per:
  animal-spawns: 400
  monster-spawns: 20
  water-spawns: 400
  water-ambient-spawns: 600
  water-underground-creature-spawns: 600
  axolotl-spawns: 400
  ambient-spawns: 0 # 0, since bats are disabled
  autosave: 6000 # how frequent whole world and player data on it should be saved, by default it's 5 minutes
aliases: now-in-commands.yml
